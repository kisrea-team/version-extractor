t-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.5 (64357)</td><td>6.4.5 (53616)</td><td>6.4.5 (1259)</td><td>6.4.5 (29471)</td><td>6.4.5 (29472)</td><td>6.4.5 (24064)</td><td>6.4.5 (24065)</td><td>6.4.5 (24066)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Notification for microphone mute during proximity detection</td><td>Users attempting to pair with a Zoom Room using ultrasonic proximity detection will be alerted if their device&#39;s microphone is muted or set to minimum volume at the operating system level. The Zoom Workplace app monitors the microphone status and displays a notification when issues are detected. Users can quickly resolve the issue through a one-click unmute button in the notification, eliminating the need to navigate system settings. The notification system helps prevent failed pairing attempts due to accidental microphone muting, particularly on laptops where function keys can inadvertently trigger mute settings.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Advance Notice: Zoom Workplace App to end support for Windows 32-bit starting December 2025 (6.7.0)</td><td>Zoom plans to release the final version of the Zoom Workplace app that supports Windows 32-bit on November 17, 2025, with the anticipated last minor release being version 6.6.0. Starting with version 6.7.0, scheduled for release on December 15, 2025, the Zoom Workplace app will no longer support devices running Windows 32-bit. Zoom recommends upgrading all PCs running Windows 32-bit to Windows 64-bit. As this upgrade may take longer than a standard application update, customers are advised to prioritize operating system upgrades ahead of time.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">AI Companion</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Introducing Custom AI Companion</td><td>With the Custom AI Companion add-on, customers can include information from their data sources, including third-party applications, using Zoom AI Studio for expanded knowledge to help drive decisions, actions, and complete tasks. <br />In this release, Custom AI Companion will include:\r\n<ul><li><strong>Bring your own data</strong>: Enable customers to connect to a wider range of enterprise resources (PDFs, docs, etc.) to be used by users within their organization. Account owners and admins can create and publish data collections using AI Studio, supporting local files in this release, and various data sources such as Google Drive and OneDrive in the upcoming releases, allowing them to organize related documents/sources across their tools by a single topic.</li><li><strong>Bring your own index</strong>: Gives customers the ability to use 3rd party indexes and enables customers to access their enterprise resources through AI Companion. In this release, customers can integrate with Amazon Q Business and Glean indexing services.</li><li><strong>Integration with 3rd party apps</strong>: Customers can integrate third party apps with AI Companion to streamline their workflows. In this release, customers can integrate AI Companion with Jira to create, update, delete, search, and summarize Jira tickets.</li><li><strong>Custom Dictionary</strong>: Allows customers to add a custom dictionary to Zoom AI Studio so AI Companion recognizes the organization&#39;s unique vocabulary and terminology.</li><li><strong>Meeting Summary Templates</strong>: Customers can use 10 out-of-the-box meeting summary templates, including one-on-one meetings and brainstorming sessions. They can also build their own meeting summary templates with custom templates.</li><li><strong>AI Companion for Third-Party Meetings</strong>: Customers can bring AI Companion to other meeting platforms like Microsoft Teams and Google Meet so they have one central place for all of their AI-generated meeting summaries and action items.</li><li><strong>Custom avatar with Zoom Clips</strong>: Users can create digital avatars that replicate their facial features and voice by using their webcam and recording a voice sample. Each avatar is securely stored and can be accessed repeatedly for creating new content. The feature includes built-in verification to maintain security and authenticity. Users can generate avatar-based videos by using text input which their avatar converts into spoken content, maintaining their likeness and voice characteristics.</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI Companion panel availability for customer-managed encryption key users</td><td>If the <strong>AI Companion panel in Zoom Workplace</strong> settings is enabled, Customer Managed Key (CMK) users will see an AI Companion diamond button in the Zoom Workplace app. Clicking it opens a right-side panel where they can ask questions and receive tailored responses sourced from different data sources and contexts available to them.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Meeting/webinar features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced waiting room layout with expanded self-view and streamlined audio controls</td><td>The waiting room enhanced interface provides a larger preview area for users to check their video appearance and background settings before joining Zoom Meetings or Webinars. This enhancement creates a seamless transition from the preview window to the main meeting/webinar interface. Users who have not connected their audio can quickly access audio settings directly from the waiting room window. These improvements enable participants to optimize their appearance and audio setup more effectively before joining sessions.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Meeting features </span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Merging floating video reactions setting with Meetings reactions</td><td>To simplify the meeting reaction settings, the <strong>Allow participants to use floating video reactions</strong> sub-setting in the Web Portal has been removed. The floating video reaction feature is still available and is controlled by the <strong>Meeting reactions</strong> setting. If Meeting reactions is enabled for the account, participants will have access to floating video reactions under the React menu in the Zoom Workplace app meeting toolbar during a meeting.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to in-meeting chat visibility for external participants</td><td>When the <strong>Only users in your account can chat setting</strong> is enabled for a meeting, the chat button remains invisible for external participants. When the host or internal participants try to send a chat message to external participants, they will get a notice indicating that their message can&#39;t be sent because external participants can&#39;t receive it.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatic fallback meeting access by recovering expired and deleted meeting ID</td><td>The host can recover an expired or deleted meeting when encountering an invalid meeting instance due to technical issues.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Send contact requests with a note on mobile app</td><td>Users can add personalized notes when sending contact requests through the Zoom mobile app. This feature enhances the user experience by making connection requests more personal and meaningful.</td><td>iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>New channel-level setting to manage who can initiate instant meetings</td><td>Account owners and admins can manage instant meeting permissions using new channel-level settings. The available options are: <strong>all members</strong>, <strong>channel owner/admin only</strong>, or <strong>no one</strong>. When users attempt to start an instant meeting, they will see a visual warning that all channel members will be called into a Zoom meeting. External users attempting to start meetings without permission will receive a message indicating the restriction. For members without permission, the video icon is automatically hidden, and channels exceeding the account-configured size limit will not display the instant meeting option. These controls help organizations better manage meeting initiations and prevent unintended disruptions, especially in large channels.</td><td><br />Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Expanded SharePoint storage for direct messages and group chat files</td><td>Users can benefit from expanded SharePoint storage capabilities that support file sharing in direct messages and group chats. The system implements granular permission controls, ensuring files are only accessible to intended recipients within conversations. This comprehensive storage solution enhances file organization and sharing workflows by centralizing content within the SharePoint ecosystem.</td><td>Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to code blocks</td><td>Code blocks now support syntax highlighting for various languages. Users can also choose a different language from a dropdown within the code block. <strong>Note</strong>: This feature is available only on the desktop app.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enable starring and foldering in shared spaces channels</td><td>Shared space channels can now be starred or added to custom folders for improved organization. Starred channels can appear in multiple sections at once, including the Starred section and their original location within shared spaces or custom folders. This flexibility allows users to create a personalized organizational structure for quick access to frequently used channels.</td><td>Windows <br />macOS <br />Linux <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Display a thread summary pop-up to prompt users to enable it when unlocked</td><td>A new pop-up has been added to the Team Chat interface to help users discover and enable thread summaries. When the feature is off but unlocked at the account level and not yet enabled by the user, they will see a notification prompting them to quickly enable thread summaries or adjust their settings. This makes it easier to take advantage of this useful feature, which automatically creates summaries of chat conversations.</td><td><br />Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Configure settings in the admin portal to restrict members from leaving channels</td><td>Account owners and admins can configure settings to restrict members from leaving specific channels through the admin portal. This setting is available during channel creation and when editing channels via the <strong>Channel Management</strong> page. The <strong>Restrict members from leaving</strong> setting defaults to off, allowing users to freely leave channels. When enabled, channel-level options to remove members or leave a channel are hidden, though deactivated or deleted users are automatically removed from channels. This feature provides admins greater control over channel membership and ensures important communications reach intended audiences.</td><td><br />Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to reset channel invite links in the admin portal</td><td>Account owners and admins can reset channel invite links directly from the <strong>Channel Management</strong> page in the admin portal. This feature provides administrators with greater control over channel access and security without requiring client-side changes. The ability to reset invite links helps maintain secure access to channels across the organization.</td><td> </td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to mention users outside the chat/channel</td><td>Users can mention people who are not in the chat/channel to reference them and share their contact details without sending a notification. The mentioned user&#39;s name will appear in the chat, but they won&#39;t receive an alert unless they are added to the conversation. Additionally, users can use this feature to quickly add members to the conversation while composing a message.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Create customized avatars for video content</td><td>Users can create digital avatars that replicate their facial features and voice by using their webcam and recording a voice sample. Each avatar is securely stored and can be accessed repeatedly for creating new content. The feature includes built-in verification to maintain security and authenticity. Users can generate avatar-based videos by using text input which their avatar converts into spoken content, maintaining their likeness and voice characteristics.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Set default dialing app on iOS devices</td><td>Users can set Zoom Phone as their default dialing application on iOS devices through their device settings. The feature leverages Apple&#39;s CallKit framework to integrate Zoom Phone seamlessly into the iOS ecosystem. When switching to the <strong>Phone</strong> tab after installing the latest version, users receive an alert notifying them of this capability with a direct link to iOS settings. This streamlined configuration eliminates the need to manually open and navigate through the Zoom mobile app when making phone calls. Setting Zoom Phone as the default dialing app provides a more efficient calling experience by reducing the steps needed to place calls. <strong>Note</strong>: This feature depends on the support for the <strong>CallKit Default Calling App Entitlement</strong> and integration with iOS settings to allow Zoom Phone to be listed as a dialer option.</td><td>iOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Zoom Contact Center apps available in Zoom Web App</td><td>Agents using the Zoom Web App can launch, interact, switch between, and close Zoom Apps for Contact Center when handling engagements in the same way as in the desktop app. Third-party apps will also get consistent data flow between the web and desktop app. This allows agents to fully utilize apps to assist customers, even when using the Zoom Web App.</td><td> </td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Email preview in queues for use with cherry-picking</td><td>Agents and supervisors with queue membership and permissions to view open engagements can now preview email message details before assignment. The preview displays the full content of email engagements, including the subject, body, sender email addresses, and attachment details. A <strong>View Details</strong> button allows quick access, similar to messaging engagements. This enhancement enables agents to make more informed decisions when selecting emails from queues set to <strong>Do Not Distribute</strong> mode for cherry-picking. Agents in the queue can assign emails to themselves, and supervisors in the queue can assign engagements in queue to themselves or other users in the queue.</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Security enhancement</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where users could not view attendee&#39;s calendar availability</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the display name was incorrect in the Activity Center for inbound SMS conversations</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where a user&#39;s calls failed with error code 4102701</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where starred contacts were unexpectedly un-starred in the desktop app</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the <strong>#</strong> character in Zoom Phone <strong>Launch an external app or a URL for incoming calls</strong> was incorrectly converted to <strong>%23</strong>, causing the URL launcher to malfunction</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where Emergency Address Verification repeatedly prompted every 30 seconds</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where incoming SMS messages triggered a popup and audible alert even when the Zoom desktop app was set to <strong>Do Not Disturb</strong></td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the video overlay with green screen appeared in Presenter Layouts during screen sharing, showing part of the green screen</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where screen sharing in Wayland failed when attempting to share the entire desktop screen</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue with toolbar inconsistencies between the Zoom Windows and Linux clients when sharing two screens</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue with performance degradation in the Zoom Workplace app when resizing the application window and when enabling wallpapers.</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Production Studio watermark did not display</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with accepting multiple calls on the power pack widget</td><td>macOS</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The <strong>Support in-meeting sub-group chat</strong>, <strong>Enhancements to Workplace app desktop settings interface</strong>, and <strong>Auto-Call for opted-in meeting attendees</strong> features have been pulled from release due to issues with deployment and will be available in another upcoming release.</p>\r\n<h3 id=\"mcetoc_1iuf0lu2r321\">March 31, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.3 <br />(63669)</td><td>6.4.3 <br />(52139)</td><td>6.4.3 (827)</td><td>6.4.3 <br />(28913)</td><td>6.4.3 <br />(28914)</td><td>6.4.3 <br />(23526)</td><td>6.4.3 <br />(23527)</td><td>6.4.3 <br />(23528)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> General features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Voice Recorder with AI Companion</td><td>Users can use AI Companion to capture in-person conversations with the Zoom mobile app. They can start voice recordings directly from the app, including for scheduled calendar events. Users can access the summary, recording and transcript, and tag speakers from the calendar card of the Zoom Workplace app both on mobile and desktop. This feature will be rolling out to accounts over the next few months.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced Zoom Workplace App interface for signed out users</td><td>When a signed out user opens the Zoom Workplace App, they would see the enhanced workplace interface with tabs that reflects Zoom products. The last login of the user will be saved for a seamless sign-in. Upon signing in, users would only see the products as per their license entitlements. For customers who use device level policies, a new MSI/GPO flag, <strong>EnableNewSigninUI</strong>, will be enabled by default to show this experience. It can be disabled to continue showing the older experience.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enable the new login UI - EnableNewSigninUI</td><td>Enabled by default, this policy allows the use of the new login user interface.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> AI Companion features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to custom notice controls for Zoom AI Companion recording consent</td><td>Account owners and admins can configure custom notices that require participant consent before their audio or video can be recorded for use with Zoom AI Companion. The notice appears as a modal with options to accept or leave the meeting, remaining visible for 90 seconds. Participants who consent have their microphone and camera unlocked but remain muted, while those who don&#39;t consent or take no action remains in-meeting with mic and camera off. Hosts are not required to consent as they are conducting the meeting and control AI Companion behavior in-meeting.</td><td>Windows <br />macOS</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where GIFs stored locally on end-user devices were not properly cleaned up</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r322\">March 23, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.2 (62735)</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app, when running in the background, improperly stole focus from Microsoft Outlook, disrupting users when typing in the CC field or editing emails.</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r323\">March 22, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.1 (62504)</td><td>6.4.1 (51520)</td><td>6.4.1 (587)</td><td>6.4.1 (28653)</td><td>6.4.1 (28654)</td><td>6.4.1 (23195)</td><td>6.4.1 (23196)</td><td>6.4.1 (23197)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue in Zoom meetings where additional unwanted characters were added to a user&#39;s name</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where selecting a URL from a Zoom Contact Center custom variable incorrectly opened in a small embedded browser instead of the system default browser</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where Zoom became unresponsive or crashed for some users after updating to version 6.4.0</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r324\">March 17, 2025</h3>\r\n<p><strong>Note</strong>: This release has been delayed by 1 day for Windows, and will be available on March 18, 2025.</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.0 (62047)</td><td>6.4.0 (51205)</td><td>6.4.0 (471)</td><td>6.4.0 (28542)</td><td>6.4.0 (28543)</td><td>6.4.0 (23029)</td><td>6.4.0 (23030)</td><td>6.4.0 (23031)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Zoom for Intune: End of support for iOS versions below iOS 16</td><td>With this release, Zoom for Intune users will need to be on iOS version 16 or higher. Supporting only recent versions of iOS allows Zoom for Intune to take advantage of all Intune functionality. Devices using versions below iOS 16 will no longer be supported on Zoom for Intune.</td><td>iOS (Intune)</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Enhancements to detailed crash dumps collection</td><td>If enabled in the account, a detailed crash dumps are generated with more information in the event of an application crash on Zoom Workplace for Windows. That information can assist Zoom with troubleshooting issues. The dumps are not automatically shared or uploaded to Zoom and will only be shared with Zoom when you <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0060047\" rel=\"nofollow\"> send a problem report and logs to Zoom Support</a>.</td><td>Windows</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Use WinINet to do proxy resolve - UseWinINetResolveProxy</td><td>Disabled by default, this policy allows the Workplace app to always use WinINet to do proxy resolve.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Use preferred language when translating messages - PreferredLanguage</td><td>Default policy is empty, admins can enable this policy by specifying their preferred language when translating messages.</td><td>Windows <br />macOS<br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Set keywords for triggering message notification - ReceiveNotificationsByKeyword</td><td>Default policy is empty, admins can enable this policy by specifying keywords to trigger message notifications.</td><td>Windows <br />macOS<br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Configure where to start when viewing unread messages UnreadViewOrder</td><td>The default policy is set to 0 (first unread message), this refers to the order of messages when viewing unread messages in a channel.</td><td>Windows <br />macOS<br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Option to keep unread messages at the top - KeepUnreadMessagesOnTop</td><td>Disabled by default, this policy refers to keeping all unread messages at the top of recent chats.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Show number of unread channel messages - ShowUnreadCountForChannel</td><td>Disabled by default, this policy refers to showing unread messages count for channels.</td><td>Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Show number of unread meetings chats - ShowUnreadCountForMeetingChat</td><td>Disabled by default, this policy refers to showing unread message count for meeting chats.</td><td>Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Message notification preference for Team Chat - MessageNotificationPreference</td><td>Set to <strong>direct messages, mentioned, and replies</strong> by default, this corresponds to <strong>Message Preferences</strong> under <strong>Settings</strong>, <strong>Team Chat</strong> then <strong>Notifications </strong>of the Zoom Workplace app</td><td>Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Keep meeting on top of other apps - KeepMeetingOnTop</td><td>Disabled by default, this corresponds to the <strong>Keep on top </strong>setting for the desktop app that forces the meeting window to be on top of other apps during a meeting.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Disable full dump generation - DisableWindowsGenFullDump</td><td>Disabled by default, this policy controls full dump generation. If enabled, the Zoom Workplace app will not be able to generate full dump</td><td>Windows <br /><br /><br /></td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Set a local storage url for update - AU2_Update3rdStorageUrl</td><td>Default policy is empty, this policy allows setting a local storage url for update</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Meeting features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Suppress meeting prompts when sharing or viewing contents</td><td>On-screen indicators that are visible on the main meeting window are suppressed when a user is sharing or viewing a shared Zoom Doc or Zoom Whiteboard. This enhancement will prevent meeting indicators from blocking important buttons and web view content, making it easier to interact with shared contents.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Background permission alerts for meeting notifications</td><td>When the <strong>Battery</strong> settings for the Zoom Workplace app is set to <strong>Optimized</strong> or <strong>Restricted</strong>, users will be prompted that they may not receive timely notifications about upcoming meetings and important messages. The prompt comes with a direct link to the device&#39;s background usage settings, allowing users to adjust permissions for the app. The notification appears when restrictions are first detected and reappears if settings are changed back to <strong>Restricted</strong> or <strong>Optimized</strong> after being <strong>Unrestricted</strong>. This helps ensure users don&#39;t miss important meeting notifications when the app is running in the background.</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to move participants from waiting room directly to breakout rooms</td><td>Hosts and co-hosts can move participants directly from the waiting room to designated breakout rooms without requiring them to enter the main meeting room first. Additionally, they can lock breakout rooms to prevent participants from returning to the main session. This feature works for both signed-in Zoom users and guests.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Webinar features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Webinar summary and ask questions with AI Companion</td><td>Webinar hosts can access AI-generated high-level summaries of webinar discussions, serving as an automated note-taking solution for both live and recorded sessions. Hosts can distribute these summaries through the webinar&#39;s follow-up email workflow or their preferred communication channels. Account owners and admins can control AI summary settings, including usage permissions and notification preferences at both account and group levels.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Vision Pro support for Webinars</td><td>Users can join and participate in Zoom Webinars through their Vision Pro headset. They can be the webinar host or attendee. This enables full participation in webinar sessions through the Vision Pro&#39;s immersive interface, allowing hosts to manage webinar controls and attendees to engage with presented content. Users can access all standard webinar features including chat, Q&amp;A, and polls while maintaining the spatial computing experience native to Vision Pro.</td><td>visionOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Display Real-Time Messaging Protocol (RTMP) streaming details in Workplace app</td><td>Users streaming through Real-Time Messaging Protocol (RTMP) can view their streaming credentials within the Zoom Workplace app. The displayed information includes the session-specific stream key and both primary and secondary stream URLs. When using third-party streaming applications, users can quickly reference and validate their streaming configuration without leaving the app.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Restrict file downloads on desktop and mobile apps</td><td>Users will be restricted from downloading files to their desktop and mobile apps if an admin enables the block file downloads setting. However, they can still view certain supported file types, like PDFs and images, within the desktop/mobile app. This setting applies to Team Chat and continuous meeting chat communications, helping protect data by limiting file downloads to personal devices. The feature requires admin configuration and applies only to supported file types. <br /><br /><strong>Note</strong>: A new setting, <strong>Downloading Files</strong>, will be added and enabled ON by default. Admins can disable it to block file downloads while still allowing limited viewing.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Mass deployment controls for Team Chat settings in mobile apps</td><td>Account owners and admins can streamline the deployment of Team Chat preferences across their organization using enhanced mobile device management (MDM) capabilities. The configuration options allow admins to set how users view unread messages in channels, manage notification preferences, and customize platform-specific settings for both iOS and Android. Admins can specify whether users start at the first or latest unread message, control message count displays, and set notification parameters. These controls enable enterprise-wide consistency in Team Chat settings without requiring individual user configuration.</td><td>Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improved app experience for external users in meetings</td><td>External users can now interact with apps in meetings without authentication or installation requirements. For apps that enable guest mode, unauthenticated or external users can use controls in interactive cards during meetings. This feature streamlines the app experience for participants, eliminating the need for sign-ins or app installations during meetings, and promoting a seamless collaborative environment.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to message forwarding with improved retry and translation capabilities</td><td>Users can now use &#64;mentions when forwarding messages and include a note for additional context. Users can also retry failed forwards and translate messages in forwarded content, improving the overall forwarding experience.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to interactive card support</td><td>Users can continue to interact with interactive cards even when using older versions of the Zoom app. When a card contains new components that cannot be rendered by an outdated Zoom app, the system automatically provides a fallback experience through a web view. This ensures users maintain access to card functionality regardless of their Zoom app version or organizational update policies. The fallback mechanism helps maintain seamless communication and collaboration across different Zoom app versions.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to hyperlink security in chat messages</td><td>Account owners and admins can disable hyperlinks across Team Chat and meeting chat environments through an account-level setting. When enabled, this security feature prevents URLs from becoming clickable links in all chat types, including direct messages, group chats, and channel conversations. Users can still send and view URL text, but the links remain unclickable to prevent accidental clicks. The link formatting option is removed from message compose boxes for internal users, while external users maintain their own hyperlink settings. This feature helps organizations reduce potential security risks from accidental URL clicks. This feature will not be immediately available, as it is dependent on a backend release, currently scheduled for March 30, 2025 <strong>Note</strong>: If admins disable links, only users on version 5.17.5 and above will have them disabled.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to group chat creation</td><td>When starting a new group chat, users will continue to be automatically directed to their most recent conversation with that group (if one exists). The dropdown will now display any named group chats, channels, or continuous meeting chats with the same users, making it easy to find the right conversation. Older unnamed group chats won&#39;t be shown, reducing duplicates and simplifying the continuation of existing conversations, though they can still be found using Search. Users can also send a message directly to a channel, continuous meeting chat, or named group chat by typing its name in the &#34;To&#34; field when creating a new message. This streamlined flow will also be available on mobile.</td><td>Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to global search with direct message link copying</td><td>Users can access a new copy link option directly within Team Chat&#39;s search results interface. The feature appears in both Messages and Top Results tabs, providing quick access to shareable message URLs. Users no longer need to navigate through multiple steps to obtain a message link, as the copy function is integrated directly into the search results view. This direct access to message links enables faster collaboration and simplified message sharing across teams and channels.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to draggable pop-up window behavior on macOS</td><td>Users on macOS can now experience improved window management when using Team Chat&#39;s draggable pop-ups. When users switch from Zoom to other applications, the pop-up windows automatically move beneath the active third-party application window. This behavior applies to Team Chat pop-ups, calendar windows, and home page scheduler, with the exception of Zoom Clips during active recording. This enhancement prevents unwanted obstruction of content in other applications while maintaining necessary visibility during screen recording.</td><td>macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to call and voicemail visibility in Team Chat</td><td>Users of the same account can now see phone call notifications and voicemail messages directly within their one-to-one Team Chat conversations. When receiving or making voice calls through Zoom Phone, call status notifications appear in the chat thread, including accepted, declined, and missed calls. Users can play voicemails, view transcripts, and manage notifications from a single interface. Red badge notifications automatically sync between Zoom Phone and Team Chat to prevent duplicate notifications. This integration helps users maintain conversation continuity and streamlines communication management across different channels. <strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend release, currently scheduled for March 26, 2025.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to badge notifications in channels and shared spaces</td><td>Users can now see <strong>New</strong> badges when they are added to new channels. The <strong>New</strong> badge overrides the unread count setting and remains visible regardless of user preferences. At-mentions take priority over <strong>New</strong> badges when both are present. These improvements help users quickly identify new content and important notifications in their workspace.</td><td>Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to reorder shared spaces in the All tab</td><td>Users can now drag and drop shared spaces within the <strong>All</strong> tab of their sidebar to customize the order according to their preferences. This feature extends the existing reordering capabilities that were previously available for folders, starred items, chats, and channels. The enhancement brings consistency to the sidebar organization, allowing users to arrange all sections, including shared spaces, in their preferred order. This improved flexibility helps users create a more personalized and efficient workspace layout.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Mail and Calendar features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to recurring meeting scheduling</td><td>Users can schedule recurring meetings only for weekdays. This provides more flexibility in managing recurring meeting schedules according to their preferences.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to make local edits to calendar events</td><td>Users can make local edits to calendar events even without edit permissions for the original event. They can modify event details such as adding invitees, updating descriptions, and customizing other event properties in their local calendar view. These changes are only visible to the user making the modifications and do not affect the original event or other attendees.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Zoom Phone call switching between Zoom Workplace desktop and mobile apps</td><td>Users can seamlessly switch an active Zoom Phone call between their Zoom Workplace desktop and mobile apps with a single click or tap. If the call was on mute or recorded before the switch, it remains on mute or continues recording after the switch. When a call is placed on hold and transferred to another endpoint, the system preserves the hold state instead of automatically resuming the call. This feature improves the calling experience by maintaining the desired hold state during device transitions. The call log shows only one entry for the call, regardless of how many times the user switches between devices. This feature provides an experience consistent with meetings and eliminates the need for multiple clicks or taps to switch devices during a call.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android <br />Zoom Phone Appliances</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Use CallKit always for incoming call notifications</td><td>Account owners and admins can enable CallKit to be used consistently for incoming call notifications on iOS and iPadOS devices, regardless of whether the Zoom Workplace app is running in the foreground or background. The setting can be configured at the account, site, group, user, and common area levels. When enabled, the maximum number of concurrent calls supported decreases from four to two. If the policy is not locked, users can modify the setting on their devices, which automatically updates the web portal policy value. This enhancement enables uninterrupted call handling on iOS and iPadOS devices.</td><td><br />iOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Introducing Zoom Fax</td><td>Account owners and admins can designate fax-capable numbers and control which users can receive, access, download, and delete faxes for main numbers. Users can view sender information and page counts, and preview faxes in PDF format directly in the Zoom Workplace app. Zoom Fax supports setting custom cover pages before sending faxes. <br /><strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend server update currently scheduled for March 24, 2025.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Generally available multi-party call conferencing</td><td>Multi-party conferencing (MPC) will be available to all existing and new Zoom Phone users and support up to 10 participants in a conference call. Users can merge two or more multi-party calls into one with a single action. Before merging, if the combined number of participants exceeds the capacity, users will be prevented from merging. During the merge, users can decide whether to keep all participants on hold or not. The number of multi-party calls a user can create is limited by the number of lines the Zoom app can display. Users must be the host or co-host of the calls to merge them. This feature ensures that users can seamlessly transfer calls during conferences, enhancing their collaboration experience. <strong>Note</strong>: This feature will be released in phases, starting with new accounts in December 2024 and rolling out to existing accounts based on their user count in early 2025.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Changes to outbound caller ID visibility with 50-ID limit</td><td>Account owners and admins can manage a refined list of outbound caller IDs that are visible to their users. The system supports a maximum of 50 caller IDs, reduced from the previous limit of 100, and is implemented across all Zoom Phone platforms. The feature includes administrative controls through the Zoom Phone admin portal.</td><td>Windows <br />macOS <br />Linux <br />iOS <br /><br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Call queue and shared line ringtone consistency across routing methods</td><td>Users can set distinctive ringtones for their Call Queue, Shared Line Group, and Shared Line Appearance (assistant) numbers through their audio settings. When calls are received through these channels, the configured ringtone plays consistently regardless of the call&#39;s routing path, including direct calls, transfers, forwards, or overflow scenarios. The feature works whether calls are directly dialed, internally forwarded, transferred, or overflowed to these numbers. Users can configure specific ringtones through the Zoom Workplace app&#39;s settings under <strong>Ringtones</strong>, where both direct inward dialing (DID) and extension numbers are displayed. This enhancement ensures that call handling remains consistent with user-defined preferences, supporting more efficient workflow management. This feature helps organizations maintain appropriate response times for different types of incoming calls by providing clear audio differentiation.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br /><br />Android <br /><br />Zoom Phone Appliances</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Zoom Contact Center integration with Microsoft Teams</td><td>Account owners and admins can integrate Zoom Contact Center (ZCC) with Microsoft Teams to enhance communication between platforms. This integration supports bi-directional on-net calling between ZCC and Microsoft Teams, enabling agents to make outbound calls, transfer engagements, and initiate conference calls with Teams users as well as Teams users call into ZCC flow. Admins can also configure the ZCC flow to automatically route calls to Microsoft Teams. Key call details, such as caller ID, agent name, and queue information, are seamlessly shared across platforms. Additionally, this integration supports Microsoft Teams Presence and Directory sync to ZCC, allowing ZCC agents to view Teams users&#39; availability before initiating, transferring, or inviting them to an engagement. Admins with <strong>Integration Management</strong> permission can enable this feature in the admin web portal. This feature must be enabled by Zoom.</td><td><br /><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Video kiosk orientation support for portrait devices</td><td>Users accessing Zoom Contact Center video kiosks on portrait-oriented devices, such as Neat Frame, can now view agent video in full-screen portrait mode. The video display automatically adjusts to optimize screen space, eliminating unused areas above and below the video feed. This enhancement applies to Zoom Room native kiosks and Zoom Room NEAT kiosk devices used for video engagements in portrait orientation, improving agent visibility and overall screen utilization for a better engagement experience. This feature must be enabled by Zoom.</td><td>iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>New message audio notifications in Zoom Contact Center within the Zoom Web App</td><td>Agents and supervisors can manage audio notifications through a new setting in the Zoom Contact Center settings within the Zoom Web App. This setting applies to all messaging channels, including SMS, web chat, in-app chat, Facebook Messenger, and WhatsApp. When enabled, agents receive an audio alert for new messages, except during active voice or video calls or when <strong>Do Not Disturb</strong> is on. This feature enhances agent awareness of incoming messages, allowing them to multitask efficiently across different engagements and applications.</td><td> </td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Mask consumer meeting controls for Zoom Contact Center agents during remote control</td><td>Account owners and admins can set permissions to restrict agents from accessing consumer meeting controls during remote control sessions. While agents have remote control of the consumer&#39;s screen, the control bar remains hidden. Consumers can stop remote control to see the control bar again. These settings apply at the account level and for video queues. This enhancement improves security by preventing agents from adjusting consumer audio and video settings. This feature must be enabled by Zoom.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Dual-Tone Multi-Frequency (DTMF) tones support for conference calls</td><td>Account owners and admins can enable or disable the Conference DTMF option for multi-party conference calls. When this setting is enabled, users can interact with automated systems, input access codes, or perform other functions using Dual-Tone Multi-Frequency (DTMF) tones without disrupting the call. When an agent presses numbers on their dial pad, the tones are transmitted to all participants, including third-party Interactive Voice Response (IVR) systems.</td><td><br /><br />Windows <br />macOS <br />CTI connector</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Cobrowse support for web chat engagements</td><td>The Cobrowse feature now supports web chat engagements, enabling agents to assist customers more efficiently while maintaining privacy. When customers need help with website forms or navigation, agents can request permission to view only the specific webpage where the issue occurs. This enhancement allows for more precise, real-time support while protecting sensitive information through built-in privacy safeguards. This feature must be enabled by Zoom.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Catalan language support for Zoom Contact Center</td><td>Zoom Contact Center now supports Catalan (ca-ES) language across various features, enhancing accessibility for Catalan-speaking users across voice, video, messaging, and email channels. Key enhancements include Catalan support for queues, flows, preferences, assets, waiting rooms, system prompts, recordings, and surveys. This feature must be enabled by Zoom.</td><td><br /><br />Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI Companion and AI Expert Assist for video channel</td><td>Agents using the video channel can now access the full suite of AI Expert Assist and AI Companion features, previously available only in messaging and voice.\r\n<ul><li><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0073565\" rel=\"nofollow\"> <strong>AI Expert Assist</strong> </a> includes knowledge base retrieval, information retrieval, best action suggestions, auto-disposition, and smart notes—all seamlessly integrated into video calls.</li><li><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0073566\" rel=\"nofollow\"> <strong>AI Companion</strong> </a> provides consumer sentiment analysis, conversation summaries, talk metrics, and follow-up task recommendations.</li></ul>\r\nAI assistance remains active when transitioning from other channels to video, intelligently adapting to space-constrained scenarios like co-browsing or screen sharing. This enhancement enables agents to deliver faster, more efficient customer service during video interactions.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0065270\" rel=\"nofollow\">Revenue Accelerator features</a> </span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Revenue Accelerator availability in Zoom Workplace app for mobile</td><td>The Revenue Accelerator tab is added to the Zoom Workplace app for mobile. This provides users with a complete web view of the Zoom Revenue Accelerator interface allowing users to access conversation recordings, analyze performance metrics, and deliver coaching feedback from their mobile devices.</td><td>Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Security enhancements</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue that allowed registrants to join an upcoming meeting two weeks early despite <strong>Join Before Host</strong> being disabled</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where a specific chat channel caused severe system performance issues, including app freezing and delayed message sending</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where personal and cloud contacts did not appear in the attendee search results</td><td>macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue on where the meeting screen froze after switching between the home screen and the meeting</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where, during interpretation, users heard both the original and translated audio simultaneously</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the <strong>Plan Next Session</strong> feature in Breakout Rooms did not distribute pre-assigned participants</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Command&#43;A shortcut no longer selected text in in-meeting chat</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where users could not view an ongoing screen share when joining a meeting</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where, with Zoom Assistant - Phone enabled, the first of two simultaneous calls did not appear but continued ringing until the second call ended or timed out</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where URLs sent in Zoom chat would break unexpectedly</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the call history did not display contact names</td><td>iOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where local recordings sent to WhatsApp could not be opened due to an <strong>unusual format</strong> error</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where missed calls with a hidden caller ID were not recorded in the call history for delegated call answering</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where Zoom Phone did not display the assigned <strong>Display Name</strong> for selected numbers in the SMS tab, showing <strong>Direct Number</strong> instead.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Intel NUCBoxG3 Plus (Intel N150) could not use a virtual background without a green screen</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where GIFs stored locally on end-user devices were not cleaning up properly, leading to excessive storage use</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users could not paste 2FA codes and had to enter them manually</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Emergency Address Verification prompt repeatedly appeared every 30 seconds</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the SMS compose icon was greyed out, preventing users from composing new texts</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where calls were dropping frequently for users</td><td>iOS</td></tr></tbody></table>\r\n<p><strong>Note</strong>: The <strong>New post-meeting card to indicate meeting summary and recording</strong> and <strong>Enhancement to in-meeting chat visibility for external participants</strong> features have been pulled from release due to issues with deployment and will be available in another upcoming release.</p>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r325\">February 28, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.3.11 (60501)</td><td>6.3.11 (50104)</td><td>6.3.11 (7212)</td><td>6.3.11 (28195)</td><td>6.3.11 (28196)</td><td>6.3.11 (22660)</td><td>6.3.11 (22661)</td><td>6.3.11 (22662)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where Google Pixel 9 XL Pro users were automatically placed on hold once audio is connected</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where Zoom crashed when users signed in using SSO</td><td>Linux</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r326\">February 17, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.3.10 (59437)</td><td>6.3.10 (49367)</td><td>6.3.10 (7150)</td><td>6.3.10 (27968)</td><td>6.3.10 (27969)</td><td>6.3.10 (22381)</td><td>6.3.10 (22382)</td><td>6.3.10 (22383)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">AI Companion features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Localized text within the AI Companion panel</td><td>All UI elements, including hero prompts, buttons, system messages, and category responses are localized for supported languages. The UI layout adapts to accommodate varying text lengths across different languages. This allows users to interact with the AI Companion panel in their preferred language, enhancing the overall user experience. The currently supported languages are:\r\n<ul><li>English</li><li>Chinese (Traditional/Simplified)</li><li>French</li><li>German</li><li>Japanese</li><li>Portuguese</li><li>Spanish</li><li>Italian</li><li>Korean</li><li>Indonesian</li><li>Polish</li><li>Russian</li><li>Swedish</li><li>Turkish</li><li>Vietnamese</li><li>Dutch (Netherlands)</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI Companion integrated into additional mobile tabs</td><td>Users can access AI Companion from additional tabs in the Zoom Workplace mobile app, including Whiteboards, Notes, Clips, Workspace, Apps, and Events. The AI Companion icon appears in the navigation bar on the right side of these tabs. The icon launches the AI Companion screen where users can interact with the AI Companion smart assistant. While this releasee focuses on accessibility across mobile tabs, specific content support for each tab will be added in future updates. The expanded AI Companion integration provides users with convenient access to AI assistance throughout their mobile app experience.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Meeting features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improved preview experience for joining meetings</td><td>Users joining a meeting will consistently see the new simplified preview dialog. This screen displays the selected audio and video sources, the default audio join method (computer audio), and an option to configure their name. Users can easily view and change these settings before joining the meeting so they are properly heard and seen.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to recording sharing with simplified request and approval workflow</td><td>Meeting participants can request access to recordings directly from the meeting card or recording link without having to send separate messages through chat, email, or calls. Meeting hosts receive these requests through in-product notifications and emails, which direct them to a viewing page where they can manage access permissions. Hosts can view all requesters on the share modal, grant or deny access, and manage existing permissions for specific users. The feature respects all security settings, including authentication requirements and password protection.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>End of meeting access to meeting recordings, summaries, and shared content</td><td>After a meeting ends, a dynamic pop-up appears, based on the assets utilized during the meeting, direc

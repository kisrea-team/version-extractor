fferent products and features within the app.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to meeting join experience on mobile devices</td><td>Users joining meetings through the Zoom Workplace mobile apps see a unified preview screen regardless of how they initiate the join flow - whether from calendar invites, push notifications, direct calls, or meeting IDs. The new interface combines meeting ID and passcode entry into a single screen and displays clear meeting information including host name, participant count, and meeting title. Meeting controls remain inactive during the connecting state until the connection is fully established, preventing setting conflicts. Users waiting to be admitted to meetings can now minimize the waiting room screen to access other Zoom Workplace features or device applications. These improvements provide better meeting preparation and multitasking capabilities for mobile users.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to closed captioning for mobile devices</td><td>Users can now access expanded closed captioning capabilities in the Zoom Workplace mobile app during meetings and webinars. The enhanced Captions sheet includes options to enable translation, view both original and translated captions simultaneously, and access a full meeting transcript. Each caption is identified by the speaker&#39;s profile image or initials, and users can tap on captions to view more historical content in a dedicated sheet. The improvements ensure better readability of captions in condensed views and allow users to save their preferred caption settings. These enhancements provide a more comprehensive and accessible captioning experience that matches the desktop functionality.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meeting features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Generation of meeting agenda with AI Companion</td><td>Meeting hosts can generate meeting agendas with the help of AI Companion. When scheduling a meeting, the host can generate an agenda using AI Companion, which actively provides suggestions and updates throughout the meeting. Host or meeting organizers can utilize previous documents or meeting as resources for AI to generate relevant agenda, or just let AI provide agenda based on meeting title with accurate time stamps for each section. During the meeting, AI Companion helps the host maintain and update the agenda in real-time, and the host can grant participants edit access to adjust it based on ongoing discussions. Meeting agenda can be shared and accessed and edited in Zoom Docs.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automated captions on device</td><td>Users can experience automated captions generated on eligible devices. This means that for some meetings with lower internet connectivity or lower quality audio, users can still receive reliable captions when the <strong>Automated captions</strong> and <strong>Automated captions on device</strong> settings are enabled in the Zoom web portal. Minimum device requirements include: Windows devices with Intel 11th Gen CPU or higher and 6 cores or higher, Windows devices equipped with AMD Ryzen 7 or higher and having 6 cores or higher, or macOS devices with Apple silicon of M2 or higher. <br /><strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend server update currently scheduled for June 30, 2025.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Enabling Automated captions for remaining paid customers</td><td>To help break down communication barriers and support a more accessible experience for Zoom users, Zoom will be enabling the <strong>Automated captions</strong> setting in the Zoom web portal to remaining paid customer accounts over the next few weeks. This change will expand access for meeting participants to enable captions as needed. <br /><strong>Note</strong>: While this feature is available to all Zoom customers, the settings for customers on free accounts will not be impacted. All customers can manage this setting in their Zoom web portal settings.</td><td>Web portal<br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Far-end audio control for participants</td><td>\r\n<p>Account owners and admins can enable Far-End Audio Control (FEAC) settings, allowing meeting participants to control another participant&#39;s audio during a meeting. This includes adjusting microphone levels, speaker volume, and mute status.Participants can request audio control from either the Zoom Workplace app or Zoom Rooms. FEAC also supports auto-accept functionality, which can be configured by admins via user-based permissions. Participants can choose to auto-accept FEAC requests during a meeting or by adding trusted contacts to their Audio Control Group.</p>\r\n<p><strong>Notes</strong>:</p>\r\n<ul><li>For FEAC and auto-accept to function, both the requester and the participant granting control must have FEAC enabled in their settings.</li><li>For Zoom Rooms, account owners and admins can configure auto-accept settings at the account, location, or room level.</li></ul>\r\n</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to emoji reactions with collaborative effects and custom designs</td><td>The emoji reactions will be displayed more prominently across the meeting screen instead of being confined to individual video tiles. When multiple participants use the same emoji simultaneously, special effects appear to create a shared experience. Additionally, the emoji reactions will automatically disappear more quickly to improve the user experience.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to captions and transcripts language support</td><td>Users can access improved language detection and specification capabilities for captions and transcripts in Zoom Meetings. Users can customize caption settings with a new default mode, drag captions outside the meeting window, and resize the caption display. These enhancements enable clearer communication in multilingual meetings and improve accessibility for all participants.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to ultrasonic proximity sharing controls</td><td>Account owners and admins can control ultrasonic proximity settings for direct sharing and pairing separately from Zoom Rooms settings. The new setting is available under <strong>Settings</strong> &gt; <strong>General</strong> tab in the <strong>Other</strong> section at the account, group, and user levels. When enabled, users can share screens, start meetings, switch meetings in progress, open whiteboards, or send phone calls from their devices to Zoom Rooms without entering meeting IDs or sharing keys. The setting is enabled by default for new accounts to maintain existing functionality.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Efficiency mode for Windows devices</td><td>Users with lower-end Windows machines can enable efficiency mode to optimize their Zoom experience. This mode automatically:\r\n<ul><li>Turns on hardware acceleration for sending and receiving video</li><li>Limits max send &amp; receive &amp; capture video to 360p 30fps</li><li>Limits max share send &amp; capture to 1080p 5fps, limit max share receive to 5fps</li><li>Disables video share (optimize for video clip)</li></ul>\r\nEfficiency mode helps ensure reliable audio, stable video, and smoother content sharing on devices with limited resources. Account owners and admins can manage this setting in the Web portal at the account or group levels under the <strong>Meeting</strong> tab &gt; <strong>In Meeting (Advanced)</strong> section &gt; <strong>Turn on efficiency mode</strong> toggle. If allowed within the account and not locked under the account or group levels, users can control this setting in the Zoom Workplace app when they go to their profile picture, then <strong>Settings</strong> &gt; <strong>Meetings &amp; webinars</strong> &gt; <strong>Performance</strong> &gt; <strong>Turn on efficiency mode</strong> toggle.</td><td>Windows</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Changes to existing in-meeting Web portal settings</td><td>Features such as animated reactions, gallery view saving and sorting, and stereo audio selection are enabled by default and can be managed directly within the Zoom Workplace app. Their corresponding settings have been removed from the Web portal:\r\n<ul><li>Animated reactions</li><li>Save Gallery View</li><li>Sort Gallery View</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Auto-Call for opted-in meeting attendees</td><td>The Auto-Call for Zoom Meetings feature helps meeting attendees who opt in avoid missing important meetings by automatically receiving a call when the meeting begins. This applies regardless of whether the host has enabled the feature for that meeting or if it&#39;s for an external meeting. Users can manage their <strong>Auto-Call</strong> settings in the Zoom Workplace app under the General tab, where they can select the Automatically receive a call when a scheduled meeting starts check box to opt in.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to video optimization in multi-share</td><td>Users can enable the Optimize for Video setting when sharing screens with multi-share enabled. This feature allows participants to share video content with higher fidelity while using multiple shares simultaneously. The Optimize for Video option, previously locked when multi-share was active, is now available for selection in the screen share modal. This enhancement improves the quality of video content sharing during multi-share sessions.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Allow in-meeting questions with AI Companion to be archived</td><td>For accounts with <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068489\" rel=\"nofollow\"> Meeting Archiving </a> and <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0057749\" rel=\"nofollow\"> meeting questions with AI Companion </a> enabled, account owners and admins can include in-meeting questions with AI Companion to be archived. Archiving includes hero prompts, user queries, responses, and interaction feedback like thumbs up/down generated by internal regulated users. An archival notification disclaimer appears to inform users when their conversations are being recorded.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Align in-meeting emoji reactions with Team Chat</td><td>Users can access the same standard set of emojis in meeting reactions that are available in Team Chat. The unified emoji set provides consistency between in-meeting reactions and Team Chat interactions, ensuring users have access to familiar expressions across both environments.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to rename voice recordings</td><td>Users can rename voice recordings from the meeting and calendar tabs on mobile apps and calendar cards on desktop app. This helps users better organize and locate their voice recordings, improving file management efficiency.</td><td>Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0073344\" rel=\"nofollow\"> Meeting/webinar features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Mesh support for the Zoom Web app</td><td>Users can utilize the Zoom Web App with Zoom Mesh, allowing better performance and resource utilization during webinar and meeting sessions.</td><td>Zoom Web App</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080361\" rel=\"nofollow\"> Webinar features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Host/co-host option to dismiss questions answered by panelists</td><td>Hosts and co-hosts can dismiss questions that panelists have marked &#34;Answer Live&#34; in webinar Q&amp;As. When a panelist clicks &#34;Answer Live&#34; to answer a question, both the host and the co-host can click &#34;Done&#34; on the panelist&#39;s behalf to complete the answer and move it to the answered queue.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Local recording support for webinar breakout rooms</td><td>Local recording support can be enabled for designated participants within webinar breakout rooms. The recording permissions follow a hierarchical structure where admins can enable local recording for hosts, who can then enable local recording for co-hosts and panelists. Each authorized participant can independently record their breakout room session, creating separate local recordings of simultaneous discussions.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>View Zoom Phone and meeting missed calls in the Missed calls tab within Team Chat</td><td>Users can view Zoom Phone missed calls directly in the <strong>Missed calls</strong> tab within Team Chat&#39;s sidebar, alongside missed meeting calls. The enhanced tab displays visual indicators when voicemails are left, allowing users to access and playback voicemails, read transcripts, and review follow-up tasks without leaving the tab. Users can also navigate directly to specific voicemail cards from the <strong>Activity Center</strong>, streamlining the process of accessing voicemail content. This centralized view helps users quickly respond to missed communications and prevent delayed responses to important calls. <strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend release, currently scheduled for June 22, 2025.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>SharePoint cloud storage integration now supports file sharing in DMs and group chats through OneDrive</td><td>Users leveraging SharePoint cloud storage integration for channels can now benefit from expanded support that stores files shared in direct messages and group chats within OneDrive for Business folders. This update simplifies file management in Team Chat by centralizing shared content within the SharePoint and OneDrive ecosystem.</td><td>Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Self mentions in chat conversations</td><td>Users can now mention themselves in all chat conversations and channels. Self-mentions appear on the <strong>Mentions</strong> tab and can be filtered in search results and the sidebar. This enhancement also includes the ability to &#64;mention oneself in personal conversations. Users receive notifications when they mention themselves, making it easier to track important conversations and set reminders.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>New admin setting to enable/disable visibility of Zoom Phone calls and voicemail notifications in 1:1 chats</td><td>Account owners and admins can manage the visibility of Zoom Phone call and voicemail notifications in one-on-one chats using a new admin setting. Located in <strong>Account Management, Account Settings, Zoom Phone</strong>, this setting is enabled by default. When turned off, users will no longer see call or voicemail notifications in their 1:1 chats. When enabled, notifications will appear directly within chat conversations. This feature gives organizations greater control over notification visibility, supporting a more focused and efficient communication experience. This feature can be managed for eligible accounts through the <a href=\"https://support.zoom.us/hc/en-us/articles/10537910870669\" rel=\"nofollow\"> Feature Release Controls.</a> <br /><strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend release, currently scheduled for June 22, 2025.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Instant meeting support and granular admin controls for continuous meeting chat</td><td>Users can leverage the continuous meeting chat functionality across instant meetings. Account owners and admins can enable or disable continuous meeting chat for instant meetings through the account or group management settings. Post-meeting chat is not available for meetings using a PMI, meetings started from a direct group chat, or meetings started from a channel. <strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend release, currently scheduled to start rolling out June 22, 2025 and will complete end of month.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Import tool to support full migration from Slack to Zoom Team Chat</td><td>Account owners and admins can import Slack export datasets up to 1GB into Zoom Team Chat. The import tool supports migration of public channels, private channels, direct messages, and group conversations. Admins can select specific content types to import and receive alerts about Slack retention settings before proceeding. This comprehensive import solution enables organizations to seamlessly transition their communication history from Slack to Zoom Team Chat without requiring individual user authorization.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Expanded summary with AI Companion capabilities in Team Chat</td><td>Team Chat summary with AI companion is expanding with new capabilities, including:\r\n<ul><li><strong>Summarize new messages</strong>: With one click, users can generate a quick summary of new messages in the current chat or channel.</li><li><strong>Summarize documents</strong>: When a supported text-based document, such as PDF, DOC, DOCX, and TXT is shared in chat, users can receive an instant summary without leaving the conversation.</li></ul>\r\nThese enhancements are part of the existing chat summary feature and appear as &#34; <strong>Summarize with AI Companion</strong> &#34; in <strong>Settings</strong>, <strong>Team Chat</strong>, <strong>AI Companion</strong> tab. The expanded features follow the account&#39;s current thread summarization settings.Admins can enable or disable the <strong>Summarize with AI Companion</strong> capabilities at the account level in <strong>Account Settings</strong> under <strong>Account Management</strong>.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to global search for shared links in the desktop app</td><td>Users can search for shared links in Team Chat messages not only by the URL itself but also using metadata such as the title and/or author of the referenced document. Search results respect user permissions, ensuring that users only see content they are authorized to access. This enhancement helps users quickly locate and retrieve shared documents within their conversations.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to emoji search functionality</td><td>Users can now find emojis more efficiently using multiple search terms and natural language keywords, making it easier to discover emojis even without knowing the exact term.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Channel invite links</td><td>Channel members can share an invitation link and QR code to invite both internal and external users to directly join their channel from desktop and mobile apps. Channel owners have settings to control whether external users can join via the link/QR code, and for public channels, whether channel owner/admin approval is needed (<strong>Note</strong>: Private channel join requests always require channel owner/admin approval.) For enhanced security, channel owners can reset invitation links at any time, deactivating existing links shared with external non-channel members while maintaining access for current channel members and internal users. This streamlined invitation flow makes it easier for teams to grow their channels while maintaining appropriate security controls.</td><td>Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Apply Zoom Workplace themes to Team Chat sidebar</td><td>Users can now personalize the Team Chat sidebar on the desktop app by applying Zoom Workplace themes. The customization updates background colors, active state indicators, and menu elements on both macOS and Windows. In <strong>Settings</strong>, <strong>Team Chat</strong>, <strong>Customize sidebar look</strong>, users can toggle between light and dark sidebar options, with the dark option reflecting their selected Workplace theme. This update adds greater flexibility to tailor the chat interface to individual preferences.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Zoom Clips avatars script moderation</td><td>Prior to generating new clips using prebuilt or custom avatars, Zoom&#39;s moderation system automatically screens user provided scripts to highlight specific sections that may contain offensive language, hate speech, vulgar terms, or other prohibited content directly in the script editor. Users can hover over highlighted sections to view explanations of the flagged content. The moderation system prevents clips generation until all flagged script content is resolved, allowing users to efficiently revise sections before proceeding.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Custom virtual backgrounds for avatar videos</td><td>Users can personalize their Zoom Clips avatar videos by uploading custom background images in addition to the predefined virtual backgrounds. The system automatically aligns uploaded backgrounds with the avatar to maintain proper positioning and visual quality. When uploading images, users can choose from PNG, JPEG, or JPG formats, with a recommended resolution of 1920x1080 for optimal display.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>International Online Fax generally available with improved file handling and notifications</td><td>Account owners and admins can leverage expanded fax capabilities across 46 countries where Zoom has native coverage. Users can send and receive faxes using native Zoom phone numbers or BYOC phone numbers, with BYOC faxes routing through the customer&#39;s SBC. Users can send faxes with customizable cover pages. Fax storage is supported in the designated recordings and content location to meet data residency requirements. Admins can configure email notifications for received faxes and monitor fax page usage through charge reports. These enhancements offer greater flexibility and control over fax communications while supporting data residency needs.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improve Invite Zoom Phone experience with automatic phone participant connection</td><td>Users can experience faster phone participant connections when using the <strong>Automatically reconnect to meeting audio</strong> option in Zoom Phone. When inviting participants via phone during a meeting, the PSTN user connects immediately without waiting for the call to be answered. The keypad is suppressed by default when the automatic reconnection option is disabled. This streamlined process reduces delays and improves the overall meeting joining experience for both hosts and phone participants.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Hide history and voicemail buttons for Teams users</td><td>Users running Zoom Assistant with the <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0057686\" rel=\"nofollow\"> Microsoft Teams integration </a> can experience a streamlined interface where history and voicemail buttons are hidden from view. This change prevents cross-launching between the Zoom app and Microsoft Teams applications during interactions. The feature specifically targets organizations that primarily use Microsoft Teams for their communication needs. By removing these buttons, users can maintain their focus within the Teams environment and reduce workflow disruptions.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to automated Zoom Phone provisioning for frontline workers with optional voicemail control</td><td>Account owners and admins can enable Zoom Phone functionality for frontline worker users through a simplified setup process. When assigning a frontline worker license, users are automatically added to Zoom Phone as basic users. Admins can quickly configure basic Zoom Phone service settings, including the option to disable voicemail functionality for these users. If voicemail is disabled, no mailbox is created, and call handling defaults to playing a message before disconnecting. When frontline worker licenses are removed, users are automatically removed from Zoom Phone unless they have been upgraded to a Pro license. This streamlined administration process reduces configuration time and simplifies phone system management for frontline workers.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Display caller ID consistently during calls</td><td>Users can see consistent caller identification information throughout their entire call experience, from incoming notifications to active engagement. The system displays caller information based on specific rules: external PSTN calls show number and location when no name is available, while internal calls display extension name and number. Users can copy phone numbers directly from the active call window for use in other communication channels. The display maintains consistency when calls are transferred or merged into conference calls, showing original caller information and transfer initiator details when applicable. This enhancement ensures users have clear visibility of who they&#39;re communicating with at all stages of the call. This feature must be enabled by Zoom.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)<br />Appliances</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support for Instagram messaging channel</td><td>Admins can add Instagram Business profiles as entry points for new messaging flows in Zoom Contact Center. Flow widgets like Send Media, Collect Input, and Route to are available for Instagram channel flows. Agents and supervisors receive notifications for new Instagram engagements and can accept or decline them. They can view engagement previews, consumer information, message history, and send or receive messages, images, and notes. Agents can also transfer engagements, upgrade to voice or video channels, and set dispositions. This feature allows brands to engage with consumers through Instagram Direct Messages. This feature must be enabled by Zoom.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Right-click menu settings for email and messaging channels</td><td>Users can now access native right-click menu functionality across all Zoom Contact Center clients, including the web portal and Zoom Web App (ZWA). The right-click menu provides essential features like spell-check and copy/paste capabilities when composing emails and messages. This improvement helps users maintain efficient communication workflows when handling customer interactions through email and messaging channels.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to remote control permissions and authentication</td><td>Zoom Contact Center has strengthened its remote control request process for improved security and clarity. Users now see precise messaging referring to <strong>computer</strong> control and clear identification of the requester (for example, [Agent Name], an agent, is requesting…). Requests from suspicious usernames containing terms like <strong>Zoom systems</strong>, <strong>Zoom platform</strong>, or <strong>Zoom admin</strong> trigger warning alerts. The system defaults to <strong>Decline</strong> as the primary action and requires a two-step confirmation to approve access. These enhancements help prevent unauthorized access and reduce the risk of social engineering attacks.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Email composition with HTML and template support</td><td>Agents can compose and reply to emails using a rich text editor that supports HTML formatting, including font styles, colors, alignment, and indentation options. The editor enables agents to embed images, videos, and GIFs while adjusting their properties. Agents can select predefined HTML templates from the asset library and preview email attachments before sending. In addition, users can trigger saved replies using / at the start of a paragraph, or by typing / (a space followed by a slash) within a paragraph. These enhancements help maintain brand consistency and deliver professional email communications that match enterprise messaging standards.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Arabic language support for Zoom Contact Center</td><td>Zoom Contact Center now supports Arabic language across various features, enhancing accessibility for Arabic-speaking users across voice, video, messaging, and email channels. This feature must be enabled by Zoom.</td><td>Windows <br />macOS <br />Linux <br />CTI connector</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0065270\" rel=\"nofollow\"> Revenue Accelerator features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to mobile navigation design</td><td>The navigation bar across all product tabs in the Zoom Revenue Accelerator mobile application is standardized to improve navigation. In the top menu, the user&#39;s profile, notifications, and activity center can be accessed. The mobile navigation design for Zoom Revenue Accelerator is in-line with modern iOS and Android practices, resulting in a more intuitive experience.</td><td><br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Security enhancements</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with Clips recordings receiving audio on all channels</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue regarding a simulive webinar event going live without the <strong>Transition to live afterward</strong> option being enabled</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in Production Studio that prevented specific users from being sent to spotlight to live due to limitations with email and name mapping</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue regarding presence status not syncing correctly from Microsoft Outlook</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which users received the error message, &#34;Your calendar could not be synchronized. The meeting and calendar services are temporarily busy. Refresh or try again later.&#34;</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue that prevented users from clicking any other options when using the spotlight annotation tool while screen sharing</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue with a breakout room automatically ending after it was set to end at 10 minutes due to a participant&#39;s device settings</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue with the Zoom Workplace app persistently crashing during meetings</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the previously-selected gallery view was not being respected after screen sharing ends</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue that prevented customers from pasting the meeting passcode when joining a meeting from the <strong>Home</strong> tab</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue regarding scheduling recurring meetings with no fixed time</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where a black screen was displayed instead of showing spotlighted speakers</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where meeting participants receive a notification that says, &#34;[X] minutes past the meeting scheduled time&#34; after the meeting has already ended</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in Zoom Phone when calling a user showed their extension number instead of their name</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue regarding OneNote internal links being incorrectly displayed as hyperlinks in Team Chat</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The <strong>Ability to automatically change presence status to Away based on screen lock or screen saver</strong> feature was pulled from release due to issues with deployment and will be available in another upcoming release. The <strong>Non-verbal feedback</strong> and <strong>Allow use of end-to-end encryption</strong> settings were not removed from the web portal in this release due to issues with deployment, and will be changed in an upcoming release.</p>\r\n<h3 id=\"mcetoc_1iuf0lu2r31p\">June 6, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>6.4.13 (2309)</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Security enhancement</td><td>Linux</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r31q\">June 4, 2025</h3>\r\n<p><strong>Note</strong>: This release does not have an associated version.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\" style=\"width: 100%;\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" style=\"width: 4.83247%;\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" style=\"width: 8.69845%;\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" style=\"width: 81.6366%;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" style=\"width: 4.89691%;\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meeting features </a> </span></th></tr><tr class=\"table-row\"><td style=\"width: 4.83247%;\">New or enhanced feature</td><td style=\"width: 8.69845%;\">Support in-meeting sub-group chat</td><td style=\"width: 81.6366%;\">Participants can collaborate more effectively during meetings without interrupting the main session by using sub-group chats. This feature allows participants to have side conversations, such as presenters coordinating program flow, without involving the entire meeting. A participant can create a sub-group chat within the meeting chat and manage members by clicking on the New Chat icon and selecting the name of participants that will be part of the new chat group. After the sub-group chat is created, participants can start sending messages and replies within the sub-group chat thread. Participants must be on Zoom Workplace app version 6.2.10 or higher to create and be added to in-meeting sub-group chats.</td><td style=\"width: 4.89691%;\">Windows <br />macOS<br />Linux<br />iOS<br />Android</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r31r\">May 29, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.12 (64384)</td><td>6.4.12 (56699)</td><td ex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.7 (64367)</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p> </p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r31u\">May 19, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.10 (64378)</td><td>6.4.10 (56141)</td><td>6.4.10 (2027)</td><td>6.4.10 (30378)</td><td>6.4.10 (30379)</td><td>6.4.10 (24950)</td><td>6.4.10 (24951)</td><td>6.4.10 (24952)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">AI Companion</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>&#64;mention support in AI Companion panel</td><td>Users can reference team members in AI Companion conversations within the AI Companion panel using the familiar <strong>&#64;mention</strong> functionality. When typing <strong>&#64;</strong>, a scrollable dropdown appears with contacts&#39; display names, which filters in real-time as users type additional characters. Selected contacts appear as highlighted tokens in the input field, maintaining consistent formatting across the platform. The feature supports multiple &#64;mentions in a single input, handles special characters in names, and is optimized for both desktop accessibility standards.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Enhancements to Workplace app desktop settings interface</td><td>The Zoom Workplace app desktop settings have been enhanced to provide a more intuitive experience for managing preferences. When users click on their profile photo and select <strong>Settings</strong>, they will see the following updates:Added new tabs\r\n<ul><li><strong>Video &amp; effects</strong>\r\n<ul><li>Camera selection from the <strong>Video</strong> tab is now combined with the <strong>Backgrounds &amp; Effects</strong> tab, resulting in a single tab to control all settings related to your appearance.</li><li>Meetings-related settings from the <strong>Video</strong> tab have been moved to the new <strong>Meetings</strong> tab.</li></ul>\r\n</li><li><strong>Notifications &amp; sounds</strong>\r\n<ul><li>Combines notification and sound-related settings previously located across several settings categories.</li></ul>\r\n</li><li><strong>Meetings</strong>\r\n<ul><li>Combines meetings-related settings previously located across several settings categories. Settings impacting similar parts of the meeting experience are grouped together to make them easier to find.</li></ul>\r\n</li></ul>\r\nChanges to existing tabs\r\n<ul><li><strong>General</strong>\r\n<ul><li>Meetings-related settings have been moved to the new <strong>Meetings</strong> tab.</li><li>System settings are now grouped together in a subcategory.</li><li>Added a Zoom apps cache setting.</li></ul>\r\n</li><li><strong>Audio</strong>\r\n<ul><li>Ringtones have been moved to the new <strong>Notifications &amp; sounds</strong> tab.</li><li>Meetings-related settings have been moved to the new <strong>Meetings</strong> tab.</li></ul>\r\n</li><li><strong>Share screen</strong>\r\n<ul><li>Created sub-categories for content sharing settings, divided into three sections: <strong>When others share</strong>, <strong>When I share</strong>, and <strong>Share button behavior</strong>.</li></ul>\r\n</li><li><strong>Phone</strong>\r\n<ul><li>The <strong>Hide incoming calls during a meeting</strong> setting has been moved to the <strong>Notifications &amp; sounds</strong> tab.</li></ul>\r\n</li><li><strong>Team Chat</strong>\r\n<ul><li>Desktop notification-related settings for Team Chat have been moved to the <strong>Notifications &amp; sounds</strong> tab.</li></ul>\r\n</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meeting features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>In-meeting half-panel display mode</td><td>When in half-panel mode, users can toggle between AI Companion panel &#43; Participants list or AI Companion panel &#43; Meeting chat or Continuous Meeting Chat (CMC). The interface automatically optimizes space by hiding suggested prompts in the AI Companion panel. This enhancement allows users to access AI Companion features while maintaining visibility of other in-meeting toolbar options such as Participants list and Team Chat, improving multitasking efficiency during meetings.<br /><strong>Note</strong>: The half panel mode may not be supported on all screen sizes or when resolution scales.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to spotlighted tab display</td><td>When sharing multiple screens simultaneously during a meeting, participants can distinguish spotlighted tabs through a newly designed visual pill that appears next to the selected tab. The spotlight functionality has been refined to work seamlessly with existing gradients and color schemes in the interface.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Billable hours tracking in meetings</td><td>In addition to phone calls, customers can track and manage billable hours for meetings. If the <strong>Track billable hours</strong> setting in the Web Portal is enabled, customers can manually start and stop tracking billable hours from the Zoom Workplace app. Additionally, client codes can be assigned, billing notes during or after a meeting can be added, and billable hours reports can be downloaded directly from <strong>Contacts</strong>. <br /><strong>Note</strong>: This feature is only available to online paid customers and must be enabled by Zoom.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to use slides as meeting presentation backgrounds</td><td>Users can select a PowerPoint or Keynote slide deck to be presented in the background. Users can navigate through their uploaded slide deck images while presenting, and adjust the size and location of their webcam video. The feature is available to Free, Pro, and Enterprise users. This enhancement provides presenters with a flexible way to create engaging visual presentations while maintaining speaker presence on screen.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to choose the meeting waiting room default screen</td><td>When the waiting room is enabled, participants see a default screen unless account owners, admins, or hosts <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0059359#h_57118d8b-1498-4c4c-a520-f8a5815930a7\" rel=\"nofollow\"> customize it</a>. This screen may change over time to reflect Zoom&#39;s latest products or features - for example, switching from the Zoom Workplace image to the AI Companion image. With this release, customers can choose to keep the Zoom Workplace image or use the AI Companion image as the default screen shown in the waiting room. Account owners and admins can manage this setting at the account or group levels under the <strong>Meeting</strong> tab &gt; <strong>Security</strong> section &gt; <strong>Waiting Room Options</strong> &gt; <strong>Customize Waiting Room</strong>. If allowed within the account, the host can also change this setting for their personal use under <strong>Settings</strong> &gt; <strong>Meeting</strong> tab &gt; <strong>Security</strong> section &gt; <strong>Waiting Room Options</strong> &gt; <strong>Customize Waiting Room</strong>. This feature will be added to feature release controls.</td><td><br />Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI Meeting Summary in Slack integration</td><td>This update adds a post-meeting summary feature to the Zoom integration in Slack. After a Zoom meeting ends, a <strong>Zoom AI meeting summary link</strong> will automatically appear in the Slack Zoom bot. To use this feature:\r\n<ul><li><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0077464\" rel=\"nofollow\"> <strong>Zoom AI Companion</strong> </a> must be enabled.</li><li>The <strong>Insert meeting details</strong> option in Slack admin settings must be turned on (enabled by default).</li></ul>\r\nClicking the link opens the AI-generated summary directly in Slack. Users can continue interacting with Zoom AI Companion via a deep link to the Zoom app included in the summary.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI Meeting Summary in Microsoft Teams</td><td>This update adds a post-meeting summary feature to the Zoom integration in Microsoft Teams. After a Zoom meeting ends, a <strong>View meeting insights with AI Companion</strong> link will automatically appear in the Microsoft Teams meeting card. To use this feature:\r\n<ul><li><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0077464\" rel=\"nofollow\"> Zoom AI Companion </a> must be enabled.</li><li>The <strong>Insert meeting details</strong> option in Zoom web settings must be turned on (enabled by default).</li></ul>\r\nClicking the link opens the AI-generated summary directly in Teams. Users can continue interacting with Zoom AI Companion via a deep link to the Zoom app included in the summary.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080361\" rel=\"nofollow\"><span class=\"divider-text\"> Webinars features </span></a></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to spotlight tab design</td><td>When sharing multiple screens simultaneously during a webinar, participants can distinguish spotlighted tabs through a newly designed visual pill that appears next to the selected tab. The spotlight functionality has been refined to work seamlessly with existing gradients and color schemes in the interface.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Streamlined user enablement for chat summary feature</td><td>When the chat summary feature is disabled but unlocked by admins, users will now see a call-to-action (CTA) entry point to learn about the feature and enable it instantly without navigating away. The CTA opens a pop-up containing a feature overview, an enable button, and a link to hide the CTA if they&#39;re not interested. This update empowers users to take advantage of available tools on their own.</td><td><br />Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Reduce UI obstruction from floating buttons</td><td>Dismiss icons were added to floating buttons, allowing users to hide floating notifications on desktop apps. Font styles have been standardized across the sidebar, chat canvas, and mobile app to maintain visual consistency. These enhancements help minimize interface clutter and deliver a more seamless chat experience.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improved Team Chat Compose experience in the mobile app</td><td>Users now benefit from an enhanced Team Chat Compose feature when creating or editing messages in the mobile app. The updated design offers easy access to AI Companion features, &#64;mentions, and rich text formatting options, bringing the mobile experience in line with the desktop app. These improvements allow users to seamlessly switch between tools, making it easier to compose engaging and well-structured messages while on the go.</td><td>iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improved pin to tabs functionality</td><td>The pin-to-tabs experience has been updated to make it easier to pin links, as well as existing or new Zoom Docs, Zoom Notes, or Zoom Whiteboards, directly to channel tabs while setting permissions to view, comment, or edit.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improved message translation in Team Chat</td><td>The updated translation menu now displays <strong>Translate to [Preferred Language]</strong> and provides easier access to translation settings at the top of the submenu. Users can change their preferred language in chat settings and adjust the target language for previously translated messages. These enhancements improve the overall translation experience by making it easier to translate messages into a language other than the preferred one and by streamlining access to language settings.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Expanded Team Chat character limit to 16,000</td><td>Users can now send longer messages in Team Chat with an increased character limit of up to 16,000 characters, compared to the previous limit of 4,000 characters. This enhancement allows users to share more detailed information and complex messages without breaking them into multiple parts, improving communication efficiency across teams.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to meeting asset sharing in channel meeting cards</td><td>Hosts can now manage the sharing of meeting summaries and recordings directly from the continuous meeting chat (CMC) post-meeting card. When shared with all CMC members, the card displays a recording frame and a summary preview, making post-meeting assets easily accessible and visible to the entire group.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced global search for direct messages in desktop app</td><td>Users can now streamline their message search experience with a new direct messages filter in global search. This filter allows for comprehensive searches across all one-on-one conversations and prioritizes direct message results at the top. The interface clearly distinguishes between sent and received messages, offering better context for each result. Even if users don&#39;t remember the conversation participants, they can easily retrieve important messages by searching their full direct message history, making the process faster and more efficient.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced entry points for Zoom Team Chat Compose and Thread Summary with AI Companion icons</td><td>Users can access the Zoom Team Chat Compose and Thread Summary with AI Companion features through updated entry points marked with an updated diamond icon. The Team Chat Compose with AI Companion entry point has been repositioned to the left side of the message compose area, appearing first to ensure consistent placement across the interface. When users select text, the inline toolbar also displays the updated diamond icon for the Compose feature. Additionally, the Zoom Team Chat Thread Summary with AI Companion feature is now visually represented with the same icon, creating a unified visual language for AI Companion functionalities. These updates enhance feature discoverability and contribute to a more cohesive user experience.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Add optional message to contact requests</td><td>Users can now provide context when initiating contact requests by adding optional messages through various methods. When opening a chat me link, scanning a QR code, or adding a contact in a 1-1 chat session, users have the ability to include a personalized message with their request. On the receiving end, users can review these messages before accepting or declining the connection request. This feature, previously available on the desktop app, is now also supported on the mobile app.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Mail and Calendar features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>View world clock multiple time zones</td><td>Users can view current times across multiple time zones directly within their calendar interface. The world clock feature remains visible in the left-hand sidebar while creating or editing calendar events. Users can add several time zones to monitor different regions simultaneously.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support view by Month option</td><td>Users can access a new <strong>Month</strong> view option in their calendar view settings, expanding beyond the current week, work week, and day views. The monthly layout presents events in a traditional calendar grid, supporting Microsoft, Google, and Zoom calendar integrations.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support proposing alternative meeting times on mobile</td><td>Event invitees can suggest different meeting times when they cannot attend at the originally scheduled time using the Zoom Calendar mobile app. Users can include an optional message explaining their scheduling constraints when proposing a new time.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support find meeting times on mobile</td><td>Users can efficiently schedule meetings with multiple participants using the <strong>Find a Time</strong> feature in the Zoom Calendar mobile app. The feature automatically analyzes attendees&#39; calendars and displays available time slots when everyone is free. Users can view participants&#39; calendars side-by-side or in an overlapped format, making it easy to compare schedules, supporting Microsoft, Google, and Zoom calendar integrations.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to embed a clip in Slack Chat</td><td>Account owners and admins can configure the Zoom Clips integration with Slack through OAuth authentication, managing user access and feature settings for their organization. The integration supports inline playback of shared clips within Slack&#39;s chat interface, respecting organizational policies and clip privacy settings. Users can initiate clip recording using the <strong>/zoomclip</strong> command, and the system automatically unfurls shared links into an embedded player. When clips receive engagement, such as views or comments, the original clip owner receives instant Slack notifications. This secure integration enhances team collaboration by keeping all clip-related interactions within the Slack environment.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to Mitel PSI client call forwarding settings</td><td>Users can configure advanced call forwarding options through the Zoom Phone software interface. The presence of hardware devices assigned to PSI users with a dedicated communication channel is established to facilitate collaboration and progress. Additionally, call forwarding capabilities provide more flexibility and control for users. Visual Voicemail is supported, allowing users to easily access and manage their voicemail messages visually.</td><td>Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI Companion-powered call management and insights panel</td><td>Zoom Phone users with paid licenses have access to an enhanced AI Companion side panel that delivers contextual insights and intelligent actions to support phone-related tasks and communications. Whether viewing general phone features or specific assets like voicemails and SMS messages, the panel provides intelligent prompts tailored to user needs. For general phone views, users can request preparation assistance for upcoming calls, revisit past call insights, and receive professional communication tips. When reviewing specific assets, the panel supports generating tasks from voicemails, translating SMS threads, and summarizing unread messages. Additionally, users can identify important missed calls based on organizational hierarchy and communication frequency, extract follow-up tasks from recent conversations, and access a consolidated view of all call-related tasks, voicemails, and messages. This functionality is available across desktop, mobile, web clients, and desk phones. All AI-generated transcripts are subject to admin-defined data retention policies and are deleted alongside their associated call logs. By providing actionable insights and offline support, this release helps users streamline communication workflows and manage phone interactions more effectively.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Default language for video engagements</td><td>Captions and live transcription now default to the engagement language, providing a consistent experience across all engagement types. If the engagement language isn&#39;t included in the list configured by the Contact Center admin, English will be used as the fallback.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />Android <br />Zoom Phone Appliances</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to enable automatic video live transcription for agents</td><td>Account owners and admins can enable or disable automatic video live transcription displayed to the agent from account preferences. When enabled, video transcription starts automatically for all Zoom Contact Center calls without requiring agent intervention. Agents can still initiate ad hoc transcription when automatic transcription is disabled. This feature ensures consistent transcription capture across all video calls while reducing agent workload.</td><td><br /><br />Windows <br />macOS <br />Linux <br /><br />CTI connector</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0065270\" rel=\"nofollow\"> Revenue Accelerator features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Revenue Accelerator and Zoom Docs integration</td><td>Revenue Accelerator users can export call details and analysis directly into Zoom Docs. Additionally, docs can be embedded within call or deal pages, wherein they can be collaboratively viewed and edited. This integration streamlines data gathering and workflows by improving the accessibility of deal information, coaching materials, and other relevant data.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to user feedback collection</td><td>Revenue Accelerator feedback can be provided by users via a thumbs up/thumbs down rating system. After a rating is selected, a text input form will be made available for additional context and details. This feedback collection applies to various aspects of Revenue Accelerator, including automated scorecards, conversations, and playbooks. Feedback is tracked internally to provide insights and promote improvements.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to resolution of automatic recorder conflicts</td><td>Meetings scheduled on third-party platforms with automatic recording enabled hosted by Zoom Revenue Accelerator users will prioritize the host&#39;s recorder over the recorders of other participants. This enhancement removes randomization of which recorder is assigned, ensuring that hosts have control over the recording.</td><td> </td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enable ProxyDetect logic for 30 mins refresh and networkchange - EnableProxyDetectForSpecialCases</td><td>Disabled by default. When enabled, the Windows client will trigger proxy detect logic for 30 mins and network change situation.</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Security enhancements</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom mobile app reminder incorrectly indicated that a meeting had started when it was still one hour away</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where incoming SMS messages triggered popups and audible alerts during Do Not Disturb status in the Zoom desktop Workplace app</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where missed call notifications did not appear on the lock screen when call history was open in Zoom Phone</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where missed call notifications did not clear when switching to other tabs</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the ALT key remained stuck during screen sharing and remote control sessions</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue that caused a black screen when resharing slides in Zoom Events Production Studio</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app crashed with a <strong>Zoom is not responding</strong> error on startup</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue that caused a significant delay when launching the Zoom app from the browser to join a meeting</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where Simulive webinars showed a blank video for participants while audio continued to play</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app crashed with a <strong>Zoom quit unexpectedly</strong> error after upgrading to version 6.4.5</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where local recording stopped immediately after being manually started by the host</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where screen sharing stopped when resizing a window</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where screen sharing from the Zoom desktop app to a Poly Zoom Room failed to display content when using an ultrawide monitor with resolutions greater than 16:9</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where Cloud Contacts were not visible in the Zoom iPhone app on iOS 17 and 18, despite appearing correctly on desktop</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the auto-call feature only worked once per meeting and failed to trigger again after the meeting time was modified</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr></tbody></table>\r\n</article>\r\n<p>The <strong>Auto-Call for opted-in meeting attendees</strong> feature has been pulled from release due to issues with deployment and will be available in another upcoming release.</p>\r\n<h3 id=\"mcetoc_1iuf0lu2r31v\">April 21, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.4.6 (64360)</td><td>6.4.6 (53970)</td><td>6.4.6 (1370)</td><td>--</td><td>--</td><td>6.4.6 (24263)</td><td>6.4.6 (24264)</td><td>6.4.6 (24265)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux<br />iOS<br />iOS (Intune)<br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where other participants saw the user&#39;s video flicker</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where attendees heard static noise after the host activated Production Studio for Zoom Sessions, which worsened when a panelist shared computer audio</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where remote control could not scroll properly when handling a large amount of text</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r320\">April 16, 2025</h3>\r\n<p><strong>Note</strong>: This release was originally scheduled for April 14, but was delayed 2 days.</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"shor

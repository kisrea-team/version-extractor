ort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>--</td><td>7.1.6 (41876)</td><td>7.1.6 (41877)</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fix</td><td>Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jtok65aca\">July 20, 2026</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>7.1.5 (43453)</td><td>7.1.5 (84650)</td><td>7.1.5 (4332)</td><td>7.1.5 (41749)</td><td>7.1.5 (41750)</td><td>7.1.5 (37198)</td><td>7.1.5 (37199)</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"0\">Type</th><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"1\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"2\">Description</th><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"3\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Quick Access to My Notes on iOS</td><td>Users can start capturing a note in My Notes directly from outside the Zoom Workplace mobile app.\r\n<ul style=\"margin-left: -18pt;\"><li style=\"margin-bottom: 0; margin-top: 0; text-align: left; white-space: pre-wrap;\"><strong>Instant Capture</strong>: Start recording immediately using a new Home Screen widget or Control Center control.</li><li style=\"margin-bottom: 0; margin-top: 0; text-align: left; white-space: pre-wrap;\"><strong>Visual Indicators</strong>: A Live Activity and the system microphone indicator will confirm that your recording is active. You can easily stop an active note via the Dynamic Island (when unlocked) or the Lock Screen (when locked).</li><li style=\"margin-bottom: 0; margin-top: 0; text-align: left; white-space: pre-wrap;\"><strong>Permissions</strong>: If microphone permissions have not yet been granted, the app will automatically prompt the user for permission before capture begins.</li></ul>\r\n</td><td>iOS<br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to Zoom Marketplace discovery and management with a unified view</td><td>On the <strong>Marketplace</strong> tab in the Zoom Workplace desktop app, users can discover, manage, and open apps from a single, unified view. The <strong>Marketplace</strong> tab surfaces contextual sections, including apps the user has added, apps approved by an account admin, and featured apps that work across Zoom product lines such as Meetings, Chat, Contact Center, Phone, ZoomMate, and more.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\">Meetings features</a></span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Voice translator: Support projection of translated speech</td><td>The enhanced Voice Translator includes a <strong>Translate My Voice</strong> capability that, when enabled, allows participants project their translated speech back to other participants in the meeting. Listeners do not need the Voice Translator add-on to hear this translated speech.<br /><strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend server update currently scheduled for July 27, 2026.</td><td><br />Windows<br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Voice translator: General availability</td><td>Users can translate spoken language in real time during a Zoom Meetings session using the voice translator feature. This allows participants who speak different languages to communicate more effectively without relying on manual interpretation. The feature integrates with existing AI-powered translated captions technology and provides automated text-to-speech services in multiple languages. Translation quality may vary and evolve depending on language pair, audio quality, and speaking clarity. Users can customize their translation experience by selecting interpreter personas and preferred spoken languages.Users can customize their translation experience by selecting interpreter personas and preferred spoken languages.Voice Translator requires the Live Translation add-on or Zoom Mate credits.Account owners and admins can manage access to voice translator through the Web Portal. Once enabled, participants can activate voice translation during a meeting to hear translated audio in their preferred language. Supported languages include:\r\n<ul><li>English</li><li>Chinese</li><li>French</li><li>Japanese</li><li>Spanish</li></ul>\r\n</td><td>Windows<br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Smart Name Tag: Enhancements to speaker name display in stream tiles</td><td>In a meeting, the names of people identified in a Zoom Room appears directly on the room&#39;s video tile, with a clearer distinction between the room name and the participant names. Users can see who&#39;s in the room and recognize who&#39;s speaking without any extra clicks. A single person&#39;s name shows directly on the tile; when a room&#39;s tile is small and several people are present, the additional names may still be behind the name-tag icon. Previously these names were tucked behind the name-tag icon.</td><td>Windows<br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced Media: Support high bit rate for screen sharing</td><td>When enabled, screen sharing can use a higher bit rate, up to 12 Mbps, to keep detailed content clear while the shared screen is in motion. This preserves fine detail in text, code, and design work when the screen scrolls or updates quickly. The bit rate increases when the content needs it and lowers automatically on limited connections. High bit rate for screen sharing is available to hosts and participants with an Enhanced Media license. Account owners and admins control its availability for meetings under <strong>Admin Center</strong> &gt; <strong>Settings</strong> &gt; <strong>Meeting</strong> &gt; <strong>Media Settings</strong>.</td><td>Windows<br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced Media: Enhancements to screen share resolution on Mac</td><td>When sharing an application window with 60fps content sharing on a Mac running macOS 26 or later, the window is captured at native resolution, giving viewers sharper application windows that preserve fine detail even when scaled.</td><td>macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced Media: 60fps content sharing for application windows</td><td>Users with the Enhanced Media license can use 60fps content sharing when sharing a single application window. This allow users to share motion-heavy content from one app, such as an app or emulator window, at a higher frame rate without sharing your whole screen. Previously, this option was only available when sharing an entire screen or a video file.</td><td>Windows<br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\">Phone features</a></span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Real-time transcription and note capture during phone calls</td><td>Users can activate My Notes during an active Zoom Phone call on desktop or mobile to capture real-time, speaker-attributed captions directly within the call interface. When a call ends, a full transcript with speaker labels and timestamps is automatically saved to the My Notes hub, where it appears alongside existing meeting notes. The in-note experience mirrors the meetings experience, including AI-generated summaries and manual annotation support. All participants on the call receive an audio announcement when My Notes is activated, and a persistent visual indicator remains visible throughout the call. Users can choose to start notes manually or configure My Notes to auto-start for all Zoom Phone calls in their personal settings. Account owners and admins can enable or disable the feature at the account or group level and will see a banner in Zoom Phone retention settings with a direct link to My Notes retention settings.</td><td><br />Windows<br />macOS<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to incoming call caller ID name display</td><td>Users receiving incoming calls on Zoom Phone see the caller&#39;s phone number instead of generic caller ID name labels such as &#34;Wireless Caller,&#34; &#34;Verified,&#34; or &#34;Location&#34; when no contact name is available. For internal extension-to-extension calls, the caller ID name is sourced from the company directory and displays the caller&#39;s extension name and extension number. For external incoming PSTN calls, the client resolves the caller ID name using a priority order &#34;from VIP contact at the highest priority down to third-party caller ID name at the lowest&#34; applied consistently across all platforms including desktop, mobile, Zoom Phone Appliances, and desk phones.The fixed priority order is documented in Zoom Phone support documentation for admin reference and is not configurable in the admin portal or by users. These changes apply to accounts with the Manage Caller ID operator flag enabled. This feature must be enabled by Zoom.</td><td><br />Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Email body content support for email to fax</td><td>Zoom Phone users with Online Fax enabled can send fax content directly within email bodies using HTML or plain text formatting, expanding beyond the previous attachment-only limitation. Additionally, email-to-fax functionality becomes available to all Zoom users rather than being limited to specific user groups.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\">Contact Center features</a></span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Preview dialer notification updates</td><td>Agents using the preview dialer in Zoom Contact Center receive clearer notification and guidance when the configured skip threshold has been reached.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">MSI/PLIST/GPO/MDM features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Add telemetry for server-driven passive rate limiting - EnableWebRequestRateLimit_Serve</td><td>Disabled by default. When this policy is enabled, the client will enable server-driven passive rate limiting for web requests and report related rate limit telemetry. If this policy is disabled, the client will not enable server-driven passive rate limiting for web requests. If this policy is not set, the client will use the default setting.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Add Passive Rate Limit Telemetry - WebRequestRateLimit_ClientMode</td><td>This policy works in conjunction with EnableWebRequestRateLimit_Server. If this policy is set, the client will use the specified mode for web request rate limiting. The value range is 0 to 3: 0 disables client-side web request rate limiting, 1 enables telemetry only, 2 enables rate limiting without telemetry, and 3 enables both telemetry and rate limiting. If this policy is not set, the client will use the default setting.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"0\">Description</th><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"1\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where regular Outlook appointments failed to appear in the Zoom desktop app&#39;s upcoming meetings list when using Microsoft Exchange On-Premises</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue causing duplicate meeting entries to appear in the Zoom desktop app when meetings were synchronized from Outlook</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where editing Zoom meetings created by another user would cause the Outlook plugin to get stuck loading instead of allowing edits</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue causing the Microsoft Contacts service to disconnect in the Zoom app and requiring users to re-authenticate</td><td>Windows<br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue in the Outlook plugin where the <strong>Allow users to access meeting chats before and after the meeting</strong> setting appeared enabled when editing an existing meeting, even when disabled at the account level</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where meetings scheduled beyond a one-year range were not displayed on the list of upcoming meetings in the <strong>Home</strong> tab</td><td>Windows<br />iOS<br />iOS (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jredaefq5o\">June 22, 2026</h3>\r\n<p><strong>Note</strong>: This release has been delayed by 1 day for Android and Android (Intune).</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>7.1.0 (41345)</td><td>7.1.0 (83064)</td><td>7.1.0 (3715)</td><td>7.1.0 (41065)</td><td>7.1.0 (41066)</td><td>7.1.0 (36404)</td><td>7.1.0 (36405)</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"0\">Type</th><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"1\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"2\">Description</th><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"3\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Slides, Sheets, and Paper available on mobile</td><td>Users can access dedicated <strong>Slides</strong>, <strong>Sheets</strong>, and <strong>Paper</strong> tabs in the Zoom Workplace mobile app navigation bar. These tabs provide entry points to Zoom AI Productivity tools. Slides are view-only on mobile, while Sheets and Paper support both viewing and basic editing functions. Certain features require a subscription and available credits.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Retirement of the &#34;AI Companion&#34; name</td><td>The AI Companion name has been retired and will no longer be in use. The AI features previously available under the AI Companion brand (Meeting Summaries, Chat Compose, Scheduling Assistance, Smart Recording, etc.) will remain available throughout Zoom Workplace. As a part of this change, the AI Companion settings page has been renamed to AI.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)<br />visionOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to the Notifications &amp; sounds setting menu</td><td>The <strong>Notifications &amp; sounds</strong> settings menu in the Zoom Workplace mobile app has been updated with improved labeling and organization.\r\n<ul><li><strong>When to notify me of messages</strong> is renamed to <strong>When to notify me</strong>, to more accurately reflect that the setting governs push notifications for messages, incoming video calls, and incoming phone calls.</li><li>The <strong>Set Canvas Docs notifications</strong> section has been relocated from near the top of the <strong>Notifications &amp; sounds</strong> settings menu to near the bottom. This change brings call, meeting, and chat notification controls to the top of the menu, where users are more likely to look first when troubleshooting missed alerts.</li><li>Notification behaviors remain unchanged.</li></ul>\r\n</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Admin-configured tab ordering for Zoom Workplace mobile app</td><td>Account owners and admins can establish organization-wide default tab ordering for the Zoom Workplace mobile app navigation bar, either mirroring their desktop configuration or defining a mobile-specific layout. The <strong>Use custom default Workplace navigation bar</strong> configuration setting allows admins to specify which tabs appear on the bottom bar versus under the <strong>More</strong> menu. Admins can choose to apply configurations to new users only or push changes to all existing users, with appropriate user notifications when overriding personal customizations. The system displays the complete set of tabs available, automatically adapting to individual user licensing and permissions.</td><td><br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\">Meetings features</a></span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Video thumbnail capture in local recordings</td><td>When Record video during screen sharing is enabled, local recordings continue to include participant videos during screen sharing, even if the presenter displays the full meeting window, changes the meeting view, or hides the floating video thumbnails. If the floating thumbnails are unavailable, Zoom records participant videos from the current meeting view and displays them alongside the shared content. Previously, participant videos could be missing from local recordings in these scenarios.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support management of screen capture capabilities for meeting content</td><td>Account owners and admins will have the option to enable or disable users&#39; ability to capture a screenshot during Zoom meetings. When this setting is enabled, the Zoom meeting window will be rendered inaccessible or invisible to certain print screen functions and screen capture tools on the device. This means that when users attempt to capture shared content (screens, videos, whiteboards, in-meeting chat, captions, polls, and quizzes), the Zoom window will not appear in the captured image. This helps maintain content security and prevent data loss for sensitive information shared during meetings. This feature does not prevent screen capture using mobile phones, cameras or other external techniques.</td><td><br />Windows<br />macOS<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support automatic disabling of AI features for restricted users</td><td>Account owners and admins can restrict AI features in meetings when certain restricted users join. When a restricted user joins a meeting, AI features, such as Meeting Summary, Meeting Questions and My Notes, will automatically stop for the meeting and they will have no ability to start them.</td><td><br />Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support AI catch-up prompt for late joiners</td><td>Participants who join a meeting late are automatically shown a pop-up offering to use AI to summarize what they missed. The prompt is available when the Meeting Questions setting is configured to allow the joining participant to ask questions.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Recent files and tile improvements in screen share</td><td>\r\n<p>When starting a screen share in a meeting, users can access recently used Zoom AI Productivity Suite documents from the <strong>Files</strong> tab in the share window. Up to six files appear, each with its document type icon, file name, folder location, and timestamp. Users can also create a new Zoom AI Productivity Suite file from the <strong>Files</strong> tab or select <strong>View all</strong> to see all their files, including those not shown in the recent list, and search for files. When a user has no files yet, the <strong>Files</strong> tab presents options to create their first one. Window tiles in the share picker display the source application&#39;s icon, and open tabs in the same browser are grouped into a single labeled tile. The three-tab picker structure, cloud-tile row, and all share-preference behavior are unchanged.</p>\r\n<p><strong>Note</strong>: This enhancement will gradually roll out to customers.</p>\r\n</td><td>Windows<br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Push notifications for last-minute meeting schedule changes on mobile</td><td>Users on the Zoom Workplace mobile app can receive push notifications when a meeting they are invited to is created, rescheduled, or canceled within a configurable time threshold before the start time, or when they are added to or removed from a meeting&#39;s invite list within that window. Notifications include the meeting topic, relevant time details, and a link to the calendar view for the relevant date and time. A new <strong>Meeting updates</strong> setting under <strong>Settings</strong> &gt; <strong>Notifications &amp; sounds </strong>&gt;<strong> Set meeting notifications</strong> offers <strong>None</strong>, <strong>Same day</strong>, and <strong>All </strong>options, defaulting to <strong>None</strong> for existing users and <strong>Same day</strong> for new installs. Push notifications respect OS-level Do Not Disturb and Zoom&#39;s quiet hours settings; existing email notifications for changes outside the threshold window are unaffected. <strong>Note</strong>: Changes to a whole recurring meeting series will not send a push notification, but changes to an individual occurrence of a meeting series will.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Move breakout rooms settings into the right panel</td><td>Users can access Breakout Rooms directly in the right panel during a meeting, replacing the previous modal window. The right panel can be split to display Breakout Rooms alongside other panel content simultaneously. Users can also pop out the Breakout Rooms panel into a separate, movable window. These layout options give users more control over their in-meeting workspace without obstructing the main meeting view.</td><td><br />Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Meeting summary enablement prompts on mobile</td><td>Users who have both meeting summary and auto-start summary settings disabled and unlocked are prompted to turn on these settings from the Zoom mobile app. When scheduling a meeting, a banner appears encouraging the user to enable summaries for their hosted meetings. When viewing a summary from a meeting they attended, a similar prompt is displayed. Tapping <strong>Enable</strong> on either prompt activates both the meeting summary and auto-start summary settings across all of the user&#39;s meetings.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Instant meetings on the calendar</td><td>Users can view instant meetings and their associated assets directly on the <strong>Calendar</strong> tab in the Zoom Workplace app and web portal. A setting to show or hide instant meetings on the calendar is available at the user level and is enabled by default. Users who do not want instant meetings displayed on their calendar can turn off this setting. The post-meeting recap pop-up for instant meetings is shown only to the meeting host, as there is a 30-second delay between meeting end and the meeting appearing on participant calendars.</td><td><br />Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to unmanaged device restrictions for meeting content</td><td>Account owners and admins can restrict access to Meeting Recordings and Meeting Transcripts from devices not enrolled in Zoom Device Management, extending the existing restriction that applies to Meeting Summaries. When the <strong>Restrict users from using selected features on unauthorized devices</strong> setting is enabled, account owners and admins can select from the sub-options to enforce restrictions on <strong>Meeting summaries</strong>, <strong>Cloud recording</strong>, <strong>Transcript</strong>, or all of them. This setting can be managed at the account and group level, under <strong>General</strong> &gt; <strong>Security</strong>.</td><td><br />Windows<br />macOS<br />Linux<br />iOS<br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to the media indicator badge</td><td>When a host has an active <strong>Enhanced Media</strong> license, an Enhanced Media <strong>Enabled</strong> status row appears in the Meeting Info panel (the (i) icon) for the host and all participants, confirming that premium quality features are active for the meeting. The badge appears automatically with no setup required, and includes a <strong>Learn more </strong>link to guide the users.</td><td><br />Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to the AI Avatar creation wizard appearance controls</td><td>Users will have their <strong>Touch Up My Appearance</strong> and <strong>Adjust for Low Light</strong> values from Video Settings automatically inherited when they enter the Appearance step of the AI Avatar creation wizard. Changes made to either setting during avatar creation are reflected back to Video Settings in real time, so the two surfaces remain consistent. The Adjust for Low Light control in the avatar wizard also gains an Auto/Manual mode toggle to match the equivalent control in Video Settings. If Low Light is set to Manual in Video Settings, the slider value carries over at the same level. Virtual backgrounds, video effects, and filters are not included in this sync and continue to be removed automatically during avatar creation.</td><td>Windows<br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to post meeting experience</td><td>With the enhanced post-meeting experience, users can easily find meeting assets through a consistent user interface across the <strong>Home</strong>, <strong>Calendar</strong>, and <strong>Hub</strong> tabs of their Zoom Workplace app. Users can view these assets through icons and thumbnails directly on event cards of their past meetings. When an event card is clicked, a new Meeting assets section appears in the small meeting card, showing thumbnails that link directly to the corresponding asset tab in the full meeting card. Meeting assets are displayed regardless of the number of attendees, including single-user meetings.</td><td><br />Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to AI-generated virtual backgrounds</td><td>Zoom makes it easier to generate a virtual background with AI, both in and out of meetings with these enhancements:<br /><strong>A more prominent way to generate</strong>: Generate now sits as a tile in the backgrounds panel alongside your other options, so AI generation is easy to find and start.<br /><strong>Spaces</strong>: Choose a ready-made scene like a home office, coffee shop, or tropical beach and generate an AI background in one tap, no typing required.<br />A larger prompt field: Gives you room to describe your own background in more detail when you want it.<br />An optional style selector: Allows you to set the look of your generated background to match the feel you want.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Display caption speaker name</td><td>When viewing captions, meeting participants can see the speaker&#39;s meeting display name alongside spoken text. Speaker names are pulled from the participant&#39;s current meeting display name. This allows multi-speaker meetings to identify who is speaking directly within the caption display.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Custom disclaimer for transcript</td><td>Account owners and admins can configure a custom disclaimer specifically for Meeting transcript. The disclaimer can be enabled or disabled from the Web portal and supports custom text input, following the same configuration options as existing custom disclaimers. When transcription starts in a meeting, participants are prompted with the disclaimer and must acknowledge it before transcription proceeds. This setting is available at the account and group levels.</td><td>Windows<br />macOS<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Blocking copy and download of files in meeting chat general availability</td><td>The ability to prevent all meeting participants from copying or downloading content uploaded to meeting chat through Zoom&#39;s interface is generally available. The restriction covers files, images, and screenshots shared by any attendee during the meeting session. This setting controls Zoom application features but cannot prevent participants from using external screen capture tools, taking photos of screens, or utilizing other methods of content capture outside the Zoom application.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatic audio adjustment when joining a Zoom Room meeting on multiple devices</td><td>When a user joins the same meeting on both the Zoom desktop app and a Zoom Room, the system automatically detects both devices and mutes audio on the secondary device by default to help prevent echo and audio feedback. No user setup is required, and a clear, non-intrusive message is displayed to inform the user that audio behavior has been adjusted. Users retain the ability to manually re-enable audio on the desktop app at any time.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI Avatars: Expanded hardware support</td><td>Users can access AI Avatars (Realistic and Stylized) on a wider range of devices. On Windows, supported graphics cards include NVIDIA RTX 3050 and AMD Radeon 6600.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to adjust playback speed for shared local video files</td><td>Users sharing local video files (such as MP4 or MOV files) in a meeting can control playback speed from within the in-meeting video player. Playback speed options range from 0.25x to 2.0x and are accessible during an active video file share through the <strong>Advanced</strong> tab. The updated player interface is consistent with the playback speed controls found in Zoom Clips, providing a unified experience across video sharing surfaces. This change allows participants to move through video content at a pace that suits the context of their meeting.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">Mail and Calendar features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support for Microsoft 365 Journal Rules in Zoom Mail</td><td>Account owners and admins can configure their Microsoft 365 Journal Rules to capture and process emails sent through Zoom Mail agents. This support allows organizations using Microsoft 365 to apply their existing journaling workflows to Zoom Mail agent traffic. Admins manage Journal Rule configuration from within their Microsoft 365 environment, and Zoom Mail agent emails are routed in a way that is compatible with those rules. This is particularly relevant for organizations that require consistent email capture across all mail sources within their Microsoft 365 tenant.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\">Phone features</a></span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>ZVA Receptionist Variables display in Zoom Phone pop-up windows and incoming notification window</td><td>Users can view variables captured during Zoom Virtual Agent (ZVA) interactions when calls are transferred to Zoom Phone through pop-up windows or incoming notifications. When users have <strong>Launch an external app or URL for incoming calls</strong> enabled, the pop-up displays both static contact information and variables collected during the ZVA call flow. Zoom Virtual Agent admins can control which specific variables are shared with Zoom Phone users. This enhancement provides users with comprehensive call context and dynamic information beyond basic caller identification.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Self-service channel creation and discovery capabilities for Push to Talk</td><td>Account owners and admins can configure public and hidden channel types for Push to Talk, reducing manual provisioning requirements. Users can discover and join public channels directly from their Zoom Workplace mobile app without admin pre-assignment, while hidden channels remain accessible to users who know the exact channel name. Users with appropriate permissions can create channels from the Zoom app, with channels automatically set to public by default. The feature supports monitoring up to 5 active channels simultaneously and allows users to leave channels they joined independently.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Phone-only mobile client experience for focused user workflows</td><td>Account owners and admins can enable a phone-only user interface on the Zoom Phone mobile client for eligible users, removing all non-phone elements such as Home, Chat, Mail, Calendar, Docs, and Meetings from the client. Only Zoom Phone functions are displayed, including the keypad, call history, lines, voicemail, SMS, Push to Talk, fax, and contacts. This setting is managed through the account-level operator flag, which is disabled by default, and is configured at the group level using Zoom Phone-specific group settings to support large-scale provisioning. Admins can also designate a secondary focus — SMS or Push to Talk — to surface that function prominently in the bottom navigation bar. The phone-only experience applies only to paid Zoom Phone Pro, Metered, or Unlimited users and supports all existing sign-in methods, including SSO. Certain workflows incompatible with this mode, such as escalating a call to a meeting, are disabled. This feature must be enabled by Zoom.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Hands-free voice calling for Zoom Phone on iOS</td><td>Users can initiate and accept Zoom Phone calls using voice commands through Siri on iOS without interacting with the device screen. Supported commands include phrases such as &#34;Call John Smith on Zoom Phone,&#34; and incoming calls can be accepted or declined entirely by voice. Calls are routed through Zoom Phone when the feature is enabled, providing consistent and predictable behavior separate from Zoom Meetings routing. The feature is compatible with Apple CarPlay, supporting hands-free calling scenarios while driving. Account owners and admins can configure default routing behavior and enable or disable the feature to align with organizational requirements. Hands-free calling with Android Auto will be released later.</td><td>iOS<br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to contact search filters in Zoom Phone</td><td>Zoom Phone users will now have an option to use contact search filters. Users can filter contact search results by three categories: All, Company Contacts, and My Contacts. The Company Contacts filter surfaces internal users with phone numbers, Zoom Phone extensions across all sites, and external contacts based on admin-configured visibility settings. These filters are available across desktop, mobile, and web clients during pre-call, active call, and transfer scenarios. When a search returns no results in the selected filter, results from other filters are displayed automatically.</td><td>\r\n<p><br />Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</p>\r\n</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to Apple CarPlay calling experience</td><td>Users can make Zoom Phone calls directly from Apple CarPlay using voice commands, speed dial, or recent call history. Incoming calls are displayed within the in-vehicle interface, where users can accept or decline them using steering wheel controls, touch input, or voice commands via Siri. Missed calls appear in the recent calls list, allowing users to return calls without handling their mobile device. In-call controls including mute, unmute, and end call are supported through the in-vehicle interface. Zoom Phone integration with Android Auto will be released later.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Email body content support for email to fax</td><td>Zoom Phone users with Online Fax enabled can send fax content directly within email bodies using HTML or plain text formatting, expanding beyond the previous attachment-only limitation. Additionally, email-to-fax functionality becomes available to all Zoom users rather than being limited to specific user groups. When cover pages are configured, email body content automatically incorporates into the cover page layout, while any attachments appear as subsequent fax pages.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Cellular companion billing integration</td><td>Users can enable Cellular Companion to route incoming Zoom Phone calls to their mobile devices, with calls charged according to Pay As You Go rates. The feature requires Pay As You Go billing to be enabled on the account before activation. When calls are directed to cellular numbers in countries where billing is not supported, the system automatically routes them to voicemail and logs the activity for administrative review. An onboarding wizard in the Zoom Workplace desktop and mobile apps helps users discover and configure this functionality, extending Zoom Phone accessibility across multiple devices.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Call summaries and notifications for missed Zoom Virtual Agent calls</td><td>Users who rely on Zoom Virtual Agent for after-hours call handling can view missed call notifications with summarized descriptions of caller inquiries. When filtering call history by <strong>Summary</strong>, users can identify missed calls from Zoom Virtual Agent and review concise explanations of what callers were seeking. The feature is available on the desktop app. Users can quickly determine whether calls are from new customers seeking services or existing customers with issues requiring follow-up. This visibility into missed call context reduces delays and improves callback efficiency.</td><td><br />Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Broadcast channels for Push to Talk</td><td>Account owners and admins can enable a broadcast channel type for Push to Talk, allowing authorized users such as store managers and supervisors to send one-way audio messages to multiple channels simultaneously. Broadcast messages take precedence over other active transmissions across those channels. This channel type is disabled by default and can be enabled through the admin web portal and API. Admins can assign broadcast permissions to specific users within the account.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067995\" rel=\"nofollow\">My Notes features</a></span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Dedicated My Notes homepage</td><td>Users have access to a dedicated My Notes homepage that serves as the daily entry point for note-taking. The homepage displays a meeting list, recent notes, insights, and notebooks, ordered by behavioral frequency. Live meetings appear with a live badge, and upcoming meetings show a countdown alongside a pre-meeting brief that surfaces the last decision, open items, and suggested topics pulled from relevant notebooks. Recent notes support batch operations, including adding to a notebook, exporting, or deleting, and notes can be tagged to a notebook inline. New users see a simplified view that surfaces live and upcoming meetings with an option to join and start notes.</td><td><br />Windows<br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Centralized template management</td><td>Users can create, manage, and apply custom templates in My Notes through a centralized template center. Templates can be created manually using the Agentic Workflow editor or generated from a natural-language description with AI. Three template types are available: system templates provided by Zoom, personal templates created by individual users, and organization templates published by admins for all members.</td><td><br />Windows<br />macOS<br />iOS<br />Android</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">MSI/PLIST/GPO/MDM features</span></th></tr><tr class=\"table-row\"><td>Changes to existing features</td><td>Set network port range for Zoom Mesh parent-child node communication - MeshListenPortRange</td><td>When utilizing Zoom Mesh, this policy allows a valid port range to be used to set up listen sockets for connection requests between Mesh parents and children nodes. The nodes will also use this range to send signals and media data. For Zoom Mesh Windows firewall rules, the configured range must start at port 2000 or higher and span fewer than 5120 ports; otherwise, the firewall rule will not be added.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Prevent camera restart during video sending - EnableForceMaximumCameraSizeForSending</td><td>Disabled by default. When this policy is enabled, the Zoom Workplace app will maintain the maximum camera capture size when sending video, preventing a camera restart when a higher video resolution is requested during a meeting. If this policy is disabled, the app may adjust camera capture size as needed during video sending.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Force enable WebView recycle behavior - ForceEnableWebViewRecycle</td><td>Disabled by default. When this policy is enabled, the Zoom Workplace app will force WebView recycling to reclaim memory from supported WebView-based tabs in accordance with the configured recycle rules. If this policy is disabled, the app will use the default Memory Saver and WebView recycling settings.</td><td>Windows<br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enable IPv4 retry for IPv6 TLS errors - V4RetryForV6TlsError</td><td>Disabled by default. When this policy is enabled, when the Zoom Workplace app resolves both IPv4 and IPv6 addresses, and the IPv6 TLS connection fails, the app will retry the connection using IPv4. If this policy is disabled, the app will not retry IPv4 for IPv6 TLS errors.</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"0\">Description</th><th class=\"short-text-col\" tabindex=\"0\" aria-sort=\"none\" data-col=\"1\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Security enhancements</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in meetings where profile pictures were duplicated after breakout rooms were opened</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where chat messages containing both Hebrew and English text displayed in the wrong order</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where emoji shortcodes (like :emojiname:) appeared as plain text instead of actual emoji images in the SMS message preview pane</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue causing inconsistent paragraph spacing in the custom message shown when turning on AI features in a meeting</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue causing the app to crash</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where screen sharing annotations appeared on the wrong monitor when using multiple displays</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where the OK button remained grayed out when creating new chats, preventing users from starting conversations in Zoom Chat</td><td>iOS<br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where some webinar attendees received low-resolution screen shares at 180p despite the presentation being sent at 720p or higher</td><td>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users continued receiving incoming call notifications after signing out of the app</td><td>iOS<br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where virtual and blurred backgrounds were not displaying correctly during voice-to-video call upgrades in Zoom Contact Center</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where Ubuntu users could not properly view presentations shared through the Slides as background feature</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where My Notes did not work for meetings scheduled through the Outlook plugin</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue on Ubuntu in which the auto-call feature did not use the selected video call ringtone in the desktop app settings, and instead played the default ringtone</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace Windows app automatically undocked and resized when switching to the Phone tab</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue preventing Zoom from recognizing the latest version of Apple Keynote, blocking the Slides as background screen sharing feature</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where PowerPoint presentation mode changes were not visible to other participants when sharing the application window</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where mobile app users viewing a clustered Zoom Room saw duplicate camera feeds in the gallery view</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Alt key would become stuck on a remote participant&#39;s computer during remote control sessions, making their device temporarily unusable</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where an agent&#39;s status was incorrectly changed to Not Ready in Zoom Contact Center due to a missed engagement that was never presented to the agent</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where shared video files would freeze and cause the Zoom app to become unresponsive approximately 30-35 minutes into playback</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue causing excessive lag, slowness, and network instability for Mac users joining webinars with high latency and connection delays</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where recurring meetings were not displaying on the Home tab for iPad users</td><td>iOS<br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users on Zoom for Intune were unable to authenticate and sign in to the app</td><td>iOS (Intune)<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where secondary ringer devices were not working for incoming phone calls and would reset after restarting the app</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The <strong>Enhancements to Zoom Marketplace discovery and management with a unified view</strong> feature has been pulled from release due to issues with deployment and will be available in an upcoming release.</p>\r\n<h3 id=\"mcetoc_1jo23mae78r\">May 18, 2026</h3>\r\n<p><strong>Note</strong>: This release was originally scheduled for May 11, but was delayed by one week.</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>7.0.5 (38856)</td><td>7.0.5 (81138)</td><td>7.0.5 (3034)</td><td>7.0.5 (40164)</td><td>7.0.5 (40165)</td><td>7.0.5 (35512)</td><td>7.0.5 (35513)</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Show or hide icon labels in the navigation bar</td><td>Users can hide text labels on navigation bar app icons in the Zoom Workplace desktop app, displaying icons only for a more compact interface. This setting is accessible through a right-click menu on app icons. The default behavior continues to display icons with text labels. This is an app-level setting with no admin controls, and users who reinstall the app or switch devices will need to reconfigure their preferred state.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>My Notes on mobile </td><td> My Notes is available in the Zoom Workplace mobile app for Zoom meetings and in-person conversations. My Notes allows the user to transcribe meetings, take manual notes, and generate an AI summary. Users can access My Notes from the Home tab (replacing the previous Voice Recorder option) or from within a Zoom meeting. The user can also enable auto-save My Notes recording for in-person meetings through web settings.<br /><strong>Note</strong>: This enhancement will gradually roll out to customers.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune) </td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Improvements to the AI Companion side panel user experience</td><td>\r\n<p>The AI Companion side panel is transitioning from a global navigation element to local, product-specific side panels within individual Zoom Workplace surfaces (such as Mail, Calendar, Chat, Canvas, and Phone). The AI Companion icon will be removed from the desktop app header, and each product tab will instead have its own entry point for its AI Companion side panel, providing more contextual assistance within each product. <br /><strong>Note</strong>: This enhancement will gradually roll out to customers and is expected to be available to most customers by the end of May 2026. At this time, customers with Custom AI Companion are not impacted by this change.</p>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meetings features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support automatic sign-in when joining a meeting from a web browser</td><td>Users who are signed into the Zoom web portal and click a meeting link from a browser can be signed into the Zoom Workplace app during the meeting join flow. On the pre-meeting preview screen, users are presented with the option to sign in as the current web portal user, join without sign-in or join as another account. If the web and Zoom Workplace app sessions already share the same signed-in user, no additional prompt is displayed and the existing flow is followed. When the automatic login completes, the full app session is established, making features such as Mail, Calendar, and Canvas available within the application. <br /><strong>Note</strong>: Implementation will be done in phases, with deployment expected to complete on June 2026.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Meeting summary enablement prompts on desktop</td><td>Users who have both the meeting summary and auto-start summary settings disabled and unlocked at the user level are prompted to enable these settings for their hosted meetings. The prompt appears when scheduling a meeting. Clicking <strong>Enable</strong> launches the existing AI Companion onboarding widget to guide users through enabling meeting summary and its associated sub-settings. Clicking <strong>X</strong> dismisses the prompt on that specific surface, while clicking <strong>Don&#39;t show again</strong> dismisses it across all relevant surfaces on that device.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to meeting transcripts and captions</td><td>Transcript experience in meetings is improved to make viewing and saving more flexible and easier to understand. The enhancement includes:\r\n<ul><li>Higher-quality transcripts are available during meetings.</li><li><strong>Greater host control</strong>: Hosts decide whether Transcripts are enabled for a meeting and can manage who is allowed to view or save them.</li><li><strong>Participant requests</strong>: If Transcript is not enabled, participants can request that the host enable Transcripts for the meeting.</li><li><strong>Admin configuration</strong>: Organizations can configure transcripts to be &#34;always on&#34; across meetings.</li><li><strong>New transcript settings</strong>: Clearer host and admin controls, with existing settings migrated where technically possible.</li><li><strong>Clear distinction</strong>: Captions support in-meeting accessibility, while transcripts serve as the saved meeting record.</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Consolidate custom disclaimers</td><td>The consolidated notice experience lets account owners and admins bring all active custom disclaimers together into a single modal shown at join rather than several notices appearing at one time.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Introducing the new Zoom Chat experience</td><td>Zoom is introducing a new Zoom Chat experience, a next-generation design that enhances how users communicate across Zoom Workplace. The updated experience brings a refreshed look along with a range of usability improvements designed to support more efficient everyday workflows. These include:\r\n<ul><li><strong>Modernized interface</strong>: Updated navigation structure and improved visual hierarchy</li><li><strong>Enhanced compose experience</strong>: Streamlined compose box with configurable tools and send options</li><li><strong>Unified expression picker</strong>: Combined emoji and GIF selection with global search</li><li><strong>Inline attachments</strong>: Insert and reorder images and files directly within messages</li><li><strong>Quick actions</strong>: One-click hover actions with recently used emoji reactions</li><li><strong>Merged Shared Spaces section</strong>: Shared Spaces are consolidated into a single, unified section for easier navigation and streamlined access to collaborative conversations</li><li>And many more enhancements throughout the experience</li></ul>\r\n<p>With this change, enhancements to Zoom Chat will only be included in the <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\">Release notes for Zoom Chat</a> moving forward.</p>\r\n<br />\r\n<p><strong>Note</strong>: The new Zoom Chat experience will gradually roll out to customers.</p>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\">Clips features</a></span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Prompt-based background image generation for Clips Avatar</td><td>Users can generate custom background images in Zoom Clips Avatar by entering a text prompt within the background selection area of the scene editor. Each prompt produces four image options for the user to choose from. For each generated image, users can apply it as the scene background, the avatar background, or both. This feature is available for both slide-based and avatar-based videos.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to commenting on clips and recordings</td><td>Users can quickly add a comment to a clip or recording by selecting from a set of helpful comment suggestions displayed directly in the comment input field. Clicking a suggestion submits the comment in one click, removing the need to type a response manually. </td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080703\" rel=\"nofollow\"> Zoom Workflow Automation features </a> </span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Enhancements to the Workflow Automation tab migration experience</td><td>The Workflow Automation tab in the Zoom Workplace desktop app has been updated to incorporate the new AI Companion Workflow feature. New users without any classic workflows will be directed to the AI Companion Workflows builder. Existing users who have used the Workflow Automation tab will see a message encouraging them to transition to the new AI Companion Workflows experience, providing a clear migration path to the latest workflow functionality, while still retaining access to the legacy Workflow Automation builder. In addition, admins will have access to a new <strong>Allow incoming Webhook for agentic workflows</strong> setting, available under the main Workflow Automation setting, to control webhook access in new agentic workflows. This setting will be enabled by default.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">MSI/PLIST/GPO/MDM features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Disable My Notes - DisableMyNotes</td><td>Disabled by default. When this policy is enabled, the Zoom Workplace app will enable My Notes. If this policy is disabled or not set, My Notes will not be available in the Zoom Workplace app.</td><td>Windows<br />macOS<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)<br />visionOS</td></tr><tr class=\"table-row\"><td>Security enhancement</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue that prevented GIFs from working</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue on Linux systems where screen sharing displayed a black screen to other participants on the second and subsequent attempts within the same meeting</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue causing the Zoom desktop app to crash when users attempted to share their screen on Linux version 7.0.0</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where contacts disappeared from the Zoom desktop app after closing and reopening the application, requiring users to manually refresh the contacts list each time</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app version 7.0.0 stopped recognizing touchscreen inputs</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where meetings scheduled on specific dates were not appearing in the Zoom desktop app calendar, even though they were visible in the Zoom web portal</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the interpretation feature appeared to be available in the meeting interface but did not actually activate</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where Google contacts were not appearing in Zoom Mail&#39;s email compose search when typing contact names or partial email addresses</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The <strong>Real-time caption translation support for international collaboration</strong> (Zoom Phone) feature has been pulled from release due to issues with deployment and will be available in another upcoming release.</p>\r\n<h3 id=\"mcetoc_1jncvlid75\">April 29, 2026</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>--</td><td>7.0.4 (39601)</td><td>7.0.4 (39602)</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fix</td><td>Android</td></tr><tr class=\"table-row\"><td>Resolved an issue causing devices to get stuck on the organization verification screen, preventing users from accessing the app</td><td>Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jmbt430cc\">April 21, 2026</h3>\r\n<p><strong>Note</strong>: This release was originally scheduled for April 20, but was delayed by one day.</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>--</td><td>7.0.3 (39335)</td><td>7.0.3 (39336)</td><td>7.0.3 (34618)</td><td>7.0.3 (34619)</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080489\" rel=\"nofollow\"> Hub features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Zoom Hub tab available on the Zoom Workplace mobile app</td><td>Users can access <strong>Hub</strong> directly from a dedicated tab in the navigation bar of the Zoom Workplace mobile app. Zoom Hub provides users with a centralized space to search and manage their Zoom assets, such as recordings and docs.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with screen sharing PDFs in meetings</td><td>iOS <br />iOS (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jl89adcf22\">April 3, 2026</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n

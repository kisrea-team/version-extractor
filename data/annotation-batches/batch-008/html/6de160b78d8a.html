rvisors can view and modify an agent&#39;s next status from the <strong>Teams</strong> page. This enhancement ensures accurate status tracking and reporting while giving agents more control over their availability. Previously, admins had to submit a request to Zoom to have this feature enabled. This feature is not supported for customers using CTI v2.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />Android <br />CTI connector</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatic engagement start for Zoom Team Chat</td><td>When a Zoom Team Chat channel is used as a messaging channel, engagements will automatically start when consumers click on the Zoom Team Chat app. The system triggers a Zoom Team Chat event that is sent to the Zoom Contact Center flow, allowing bots or flows to immediately send greeting messages and present available engagement options. When users navigate away from the app, the chat session remains active, and returning users can continue their existing engagement without restarting. This feature eliminates the blank page experience and provides immediate guidance to consumers about available interaction options.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0081420\" rel=\"nofollow\">Video Management features</a> </span></th></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Use slide control with the Office API - OptimizeSlideControlWithOfficeAPI</td><td>Disabled by default, admins can enable this policy to use the Office API to control PowerPoint slides with the slide control feature.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Configure the Webview Proxy Server - WebviewProxyServer</td><td>Empty by default, this policy provides admins a way to configure the webview proxy server. If this policy is empty or invalid, it will be ignored.</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue in which certain URLs copied from the Edge browser did not appear as clickable links in Team Chat due to strict URL validation rules</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue for a subset of users that prevented them from using the gallery view grid while screen sharing when there were 5 or more participants in the meeting</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which playing a video in Zoom Team Chat caused the screen to freeze and the mobile app to become unresponsive after turning the screen off and back on</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the camera preview froze when users zoomed in to the maximum while using their camera to take an image directly in Zoom Team Chat</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which webinar panelists and hosts/co-hosts received an incorrect error message when they were moved to backstage that said &#34; <strong>The webinar ended for attendees</strong> &#34;</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue for a subset of users with the MAPI calendar integration with Outlook that prevented some calendar events from displaying correctly in Zoom</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue with slide control for Google Slides in the Edge browser</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with the desktop app closing unexpectedly</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the meeting controls toolbar was missing, showing only the mute and unmute options</td><td>Android<br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j61cme3e5\">September 29, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>6.6.2 (65462)</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue that prevented multiple alternative hosts from being assigned when scheduling a meeting</td><td>macOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j5gjtq365\">September 19, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.6.1 (15968)</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j4qhg2bnhm\">September 15, 2025</h3>\r\n<h4>Full versions</h4>\r\n<p><strong>Note</strong>: The Zoom Workplace app release for Windows, Android, and Android (Intune) has been delayed 1 day.</p>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.6.0 (15547)</td><td>6.6.0 (64511)</td><td>6.6.0 (4410)</td><td>6.6.0 (33360)</td><td>6.6.0 (33361)</td><td>6.6.0 (28131)</td><td>6.6.0 (28132)</td><td>6.6.0 (28133)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\" style=\"width: 100%; height: 5272.43px;\"><thead><tr class=\"table-head-row\" style=\"height: 15.3906px;\"><th class=\"short-text-col\" style=\"width: 5.98481%; height: 15.3906px;\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" style=\"width: 20.1799%; height: 15.3906px;\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" style=\"width: 62.3071%; height: 15.3906px;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" style=\"width: 6.1159%; height: 15.3906px;\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> General features </span></th></tr><tr class=\"table-row\" style=\"height: 30.7812px;\"><td style=\"width: 5.98481%; height: 30.7812px;\">Changed feature</td><td style=\"width: 20.1799%; height: 30.7812px;\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0061734\" rel=\"nofollow\">End of support for iOS 13 and iOS 14</a></td><td style=\"width: 62.3071%; height: 30.7812px;\">With this release, iOS users will need to be on iOS version 15 or higher. Devices still using iOS 13 or 14 will no longer be supported and will have 6.5.12 (or any additional patches in the 6.5.x branch) as the last app version available.</td><td style=\"width: 6.1159%; height: 30.7812px;\">iOS</td></tr><tr class=\"table-row\" style=\"height: 46.1719px;\"><td style=\"width: 5.98481%; height: 46.1719px;\">Changed feature</td><td style=\"width: 20.1799%; height: 46.1719px;\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0061734\" rel=\"nofollow\">End of support for Android 8.0 and Android 8.1</a></td><td style=\"width: 62.3071%; height: 46.1719px;\">With this release, Android users will need to be on Android version 9.0 or higher. Devices still using Android version 8.0 or 8.1 will no longer be supported and will have 6.5.12 (or any additional patches in the 6.5.x branch) as the last app version available.</td><td style=\"width: 6.1159%; height: 46.1719px;\">Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 109.953px;\"><td style=\"width: 5.98481%; height: 109.953px;\">Changed feature</td><td style=\"width: 20.1799%; height: 109.953px;\">Removed functionality for live streaming on Workplace from Meta</td><td style=\"width: 62.3071%; height: 109.953px;\">\r\n<p>Due to <a href=\"https://www.facebook.com/help/1167689491269151/\" target=\"_blank\" rel=\"noopener noreferrer nofollow\"> Meta&#39;s recent announcement about the closure of Workplace from Meta</a>, Zoom customers can no longer live stream Zoom meetings or webinars on Workplace from Meta. As an alternative, it is recommended to live stream a meeting or webinar to a custom platform, such as Workvivo. Learn more about <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064210\" rel=\"nofollow\">enabling and setting up custom live streaming</a> on your Zoom account or <a href=\"https://support.workvivo.com/hc/en-gb/articles/10468176605853\" rel=\"nofollow\"> setting up a custom live stream to Workvivo</a>.</p>\r\n<p><strong>Note</strong>: Live streaming a Zoom meeting or webinar on <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0061523\" rel=\"nofollow\">Facebook</a> is still available.</p>\r\n</td><td style=\"width: 6.1159%; height: 109.953px;\"><br />Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Enhancements to presence management with reset capability</td><td style=\"width: 62.3071%; height: 138.516px;\">Users can reset their presence status in the Zoom Workplace app through the <strong>Reset</strong> option in the presence menu. When users manually override system-driven presence states (such as <strong>In a Zoom Meeting</strong>), they can use this reset function to revert back to the appropriate system-determined status.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Expanded language support for automated captions</td><td style=\"width: 62.3071%; height: 138.516px;\">\r\n<p>Automated captioning support is expanding to include the following languages and regional dialects: Afrikaans, Arabic (Gulf), Bengali, Catalan, Croatian, Galician, German (Switzerland), Greek, Latvian, Norwegian, Serbian, Slovak, Somali, and Zulu. These languages are enabled by default, but admins can <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0058810\" rel=\"nofollow\">control the availability of the languages</a> through the <strong>Automated captions</strong> setting within the web portal.</p>\r\n<p><strong>Note</strong>: The following locales were rolled back due to backend issues: English (Australian), English (India), English (Ireland), English (New Zealand), English (Scot), English (South Africa), English (United Kingdom), English (Welsh), Spanish (Mexico).</p>\r\n</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 92.3438px;\"><td style=\"width: 5.98481%; height: 92.3438px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 92.3438px;\">Global search available on mobile devices</td><td style=\"width: 62.3071%; height: 92.3438px;\">Users can access the global search feature from the <strong>Team Chat</strong> and <strong>Contacts</strong> tabs on the Zoom Workplace mobile app (Android). This enhanced mobile search supports contacts, messages, chats and channels, meetings, files, SMS, Docs, and Whiteboards. Users can sort search results by most relevant or most recent.</td><td style=\"width: 6.1159%; height: 92.3438px;\">Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meetings features </a> </span></th></tr><tr class=\"table-row\" style=\"height: 107.734px;\"><td style=\"width: 5.98481%; height: 107.734px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 107.734px;\">Voice Recorder with AI Companion: Support smart name tags for speaker identification in voice recordings</td><td style=\"width: 62.3071%; height: 107.734px;\">Account owners and admins can enable Smart Name Tags for voice support in the Zoom Workplace app, allowing automatic speaker identification in voice recordings. The feature works with both ad hoc recordings and scheduled offline events, identifying participants who have enrolled their voice profiles. The setting mirrors Zoom Rooms configuration and is controlled by the master toggle <strong>Zoom Workplace app automatic smart name tag</strong>. When enabled, the system automatically tags speakers in transcripts and summaries based on their voice profiles instead of using generic speaker labels.</td><td style=\"width: 6.1159%; height: 107.734px;\"><br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 61.5625px;\"><td style=\"width: 5.98481%; height: 61.5625px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 61.5625px;\">Support video auto framing for meeting participants</td><td style=\"width: 62.3071%; height: 61.5625px;\">With the video auto-framing feature, meeting participants are automatically kept centered in the camera view as the technology detects and adjusts to their movements. The auto-framing capability works with both standard in-built laptop cameras and external webcams, removing the need for manual camera adjustments when participants change position. This ensures a consistent and professional visual presence is maintained throughout Zoom Meetings.</td><td style=\"width: 6.1159%; height: 61.5625px;\">Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 61.5625px;\"><td style=\"width: 5.98481%; height: 61.5625px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 61.5625px;\">Smart recognition - Simplified enrollment flow for uploading image or voice recording</td><td style=\"width: 62.3071%; height: 61.5625px;\">If enabled by admins, users can upload a single voice recording or image from the <strong>Smart Recognition</strong> section in the Zoom Workplace app or web to activate multiple features across Zoom Workplace app and Zoom Rooms. These features include Smart Name Tags for voice and video, as well as personalized audio isolation. Users can also update or delete their image from the same location.</td><td style=\"width: 6.1159%; height: 61.5625px;\"><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\" style=\"height: 92.3438px;\"><td style=\"width: 5.98481%; height: 92.3438px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 92.3438px;\">Simplified meeting transfer from Zoom Workplace mobile app to Zoom Rooms</td><td style=\"width: 62.3071%; height: 92.3438px;\">Users can transfer ongoing meeting from their Zoom Workplace mobile app to a Zoom Room through a simplified one-tap process. When accessing the active meeting interface, users will see a <strong>Transfer to Zoom Room</strong> button that opens a modal or slide-up panel showing nearby available rooms. The feature leverages proximity detection to automatically display nearby rooms, while also providing an option to manually search for specific rooms if needed.</td><td style=\"width: 6.1159%; height: 92.3438px;\">iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 76.9531px;\"><td style=\"width: 5.98481%; height: 76.9531px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 76.9531px;\">Running late notification option</td><td style=\"width: 62.3071%; height: 76.9531px;\">With the running late notification feature, users in a current Zoom Meeting can notify participants of an upcoming meeting that they will be late. When selected, the system automatically sends a pre-formatted message to participants in the upcoming Zoom Meeting. Please note that users must have Zoom meeting notifications turned on in order to use this feature.</td><td style=\"width: 6.1159%; height: 76.9531px;\">Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 46.1719px;\"><td style=\"width: 5.98481%; height: 46.1719px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 46.1719px;\">Expanded hand gesture options for meeting reactions</td><td style=\"width: 62.3071%; height: 46.1719px;\">Users can access a broader range of hand gesture recognition capabilities on Zoom Workplace desktop app. The expanded gesture set includes heart/love (forming a heart with both hands), celebrate (two thumbs up), ok, and thumbs down, in addition to the existing raise hand and thumbs up gestures.</td><td style=\"width: 6.1159%; height: 46.1719px;\">Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 153.906px;\"><td style=\"width: 5.98481%; height: 153.906px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 153.906px;\">Enhancements to watermark controls</td><td style=\"width: 62.3071%; height: 153.906px;\">Hosts can control watermark visibility separately for shared content and video feeds during meetings. The watermark setting can be enabled or disabled for screen sharing and video independently, regardless of the default user-level configuration. If there are signed-out users in a meeting, watermark controls remain unavailable. For meetings with only authenticated users, hosts can enable watermark settings while automatically restricting the meeting to authenticated users only.</td><td style=\"width: 6.1159%; height: 153.906px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Enhancements to post-meeting feedback pop-up</td><td style=\"width: 62.3071%; height: 138.516px;\">Users will experience a redesigned post-meeting interface with improved navigation to meeting resources. The enhanced pop-up features more intuitive entry points to access AI Companion, continuous meeting chat, and other meeting assets enabled for the participants.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 92.3438px;\"><td style=\"width: 5.98481%; height: 92.3438px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 92.3438px;\">Enhancement to voice recording speaker identification</td><td style=\"width: 62.3071%; height: 92.3438px;\">Users can manage speaker identification in real-time during voice-recorded meetings through manual tagging capabilities. The system displays generic speaker tags in the live transcript that you can update with actual participant names. For meetings with enrolled voice prints, the system automatically identifies and labels speakers who are listed as participants or hosts. Real-time speaker identification reduces post-meeting processing time and improves transcript accuracy in professional and collaborative environments.</td><td style=\"width: 6.1159%; height: 92.3438px;\">iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 61.5625px;\"><td style=\"width: 5.98481%; height: 61.5625px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 61.5625px;\">Enhancement to make microphone modes easily accessible</td><td style=\"width: 62.3071%; height: 61.5625px;\">Users can switch microphone modes from the audio flyout. They can switch between default noise removal, personalized audio isolation and original sound for music. The centralized audio controls help users to easily switch mode, from a noisy office environment that isolates their voice to a private music lesson where they need to hear every note.</td><td style=\"width: 6.1159%; height: 61.5625px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\" style=\"height: 92.3438px;\"><td style=\"width: 5.98481%; height: 92.3438px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 92.3438px;\">Dynamic Island support for managing meetings</td><td style=\"width: 62.3071%; height: 92.3438px;\">Users with supported iPhone models (iPhone 14 Pro and later) can access more meeting information through the iOS Dynamic Island and Lock Screen. The enhanced Live Activities integration displays additional meeting information including the meeting title, current speaker, number of participants, and audio/video status indicators. Users can tap on the Dynamic Island pill to return to the Zoom meeting or long press to view expanded meeting details. <br /><strong>Note</strong>: iOS Dynamic Island and iOS Picture in Picture do not work concurrently. To use this feature, a user must disable Picture in Picture in iOS settings (<strong>Settings</strong> &gt; <strong>General</strong> &gt; <strong>Picture in Picture</strong>) and restart the device.</td><td style=\"width: 6.1159%; height: 92.3438px;\">iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Allow alternative hosts to manually reclaim host status when rejoining</td><td style=\"width: 62.3071%; height: 138.516px;\">Alternative hosts can reclaim host status when rejoining meetings they were previously hosting. This feature ensures meeting continuity by preserving host assignments even when connection issues occur. When an alternative host who was acting as the meeting host disconnects and then rejoins, they must manually reclaim host status.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\" style=\"height: 76.9531px;\"><td style=\"width: 5.98481%; height: 76.9531px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 76.9531px;\">Support for adding external users without contact through email to shared spaces</td><td style=\"width: 62.3071%; height: 76.9531px;\">Users with appropriate permissions can invite external users to hared spaces by entering their email addresses, even if they are not existing contacts. The invited users receive an email notification with instructions to join the space and appear as pending members until they accept the invitation. For accounts with approval flows enabled, external invites follow the existing approval process for shared spaces. This feature enables teams to collaborate more efficiently with external partners by streamlining the invitation process.</td><td style=\"width: 6.1159%; height: 76.9531px;\">Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 206.688px;\"><td style=\"width: 5.98481%; height: 206.688px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 206.688px;\">Shared space admins automatically inherit channel admin permissions</td><td style=\"width: 62.3071%; height: 206.688px;\">Shared space admins now automatically inherit channel admin permissions when they are part of space channels created by other members or when they join public-to-member channels. These inherited permissions include the ability to:\r\n<ul><li>Edit the channel name and description</li><li>Manage tab settings</li><li>Control channel huddle options</li><li>Add mention groups</li><li>Configure instant meeting settings</li></ul>\r\nIn synced channels, space admins will appear in the channel admin list and cannot be removed as admins. In public-to-member channels, space admins gain admin permissions only when they are members of the channel. This enhancement ensures that space admins have consistent and streamlined management capabilities across all channels they are part of.</td><td style=\"width: 6.1159%; height: 206.688px;\">Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 61.5625px;\"><td style=\"width: 5.98481%; height: 61.5625px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 61.5625px;\">Reply directly from notifications</td><td style=\"width: 62.3071%; height: 61.5625px;\">Users can now reply to Zoom Team Chat messages directly from desktop notifications on the Zoom desktop app (Windows and macOS). By clicking <strong>Reply</strong> in the notification, users can open a text input field, type their response, and send it without opening the Zoom app. This feature enables faster communication, reduces context switching, and helps maintain productivity.</td><td style=\"width: 6.1159%; height: 61.5625px;\">Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Remove Zoom Phone call notifications from one-on-one chats</td><td style=\"width: 62.3071%; height: 138.516px;\">Users will no longer see notifications for accepted, missed, or declined Zoom Phone calls in their one-on-one Team Chat conversations. Voicemail notifications will continue to appear in one-on-one chats, allowing users to quickly access, play back, and read transcripts of important messages. This change helps reduce notification clutter and focuses conversations on direct messages and critical communications. The streamlined experience creates a cleaner chat interface and makes it easier for users to focus on relevant messages.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 92.3438px;\"><td style=\"width: 5.98481%; height: 92.3438px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 92.3438px;\">Redesigned group direct message icon on mobile app</td><td style=\"width: 62.3071%; height: 92.3438px;\">Users will see a redesigned icon for group direct messages on the mobile app, which includes profile pictures. This update makes group conversations feel more personal and helps users more easily distinguish between different types of chats.</td><td style=\"width: 6.1159%; height: 92.3438px;\">iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 76.9531px;\"><td style=\"width: 5.98481%; height: 76.9531px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 76.9531px;\">Notify post-meeting cards only when valuable</td><td style=\"width: 62.3071%; height: 76.9531px;\">Users receive post-meeting cards in Team Chat after each meeting concludes. These cards now display red badge notifications only when they contain valuable content, such as meeting recordings, AI Companion summaries, shared whiteboards, and shared documents or attachments. This targeted notification approach helps users quickly identify meetings with important content while reducing unnecessary alerts.</td><td style=\"width: 6.1159%; height: 76.9531px;\">Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\" style=\"height: 153.906px;\"><td style=\"width: 5.98481%; height: 153.906px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 153.906px;\">Notify hosts when summary or recording is successfully shared</td><td style=\"width: 62.3071%; height: 153.906px;\">Hosts will receive a notification when they successfully share a summary or recording on the post-meeting card. The notification confirms that content has been shared to the collaborative meeting card. When hosts manually share content, they will also be informed about existing web settings that can automatically handle sharing in the future. This notification system addresses the delay that occurs between clicking the share button and when the content actually appears, providing hosts with immediate confirmation that their action was successful.</td><td style=\"width: 6.1159%; height: 153.906px;\"><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">New channel meeting card user interface</td><td style=\"width: 62.3071%; height: 138.516px;\">Channel members will experience a new, consistent user interface for meeting cards in channels. The updated design aligns pre-meeting, during-meeting, and post-meeting cards with the Calendar interface, creating a unified visual experience. When AI Companion meeting summaries are available, they will be incorporated directly within the post-meeting card rather than appearing as a separate bot summary card. This visual consistency improves recognition of meeting-related content and makes interactions more intuitive across different areas of Zoom Team Chat.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Enhancements to meeting agenda sharing in continuous meeting chat</td><td style=\"width: 62.3071%; height: 138.516px;\">Meeting hosts can share meeting agenda documents with continuous meeting chat (CMC) upon completion of meeting scheduling. Previously, CMC would only appear when there was a human-sent message in the chat, creating an inconsistent experience during meeting preparation. Now, once a meeting agenda is created, it will be shared automatically to CMC with a message stating &#34;Here is the meeting agenda: [Doc link]&#34; from the meeting host. This ensures CMC is activated and accessible even when no human messages have been sent. This enhancement creates a more consistent user experience and improves the utility of CMC during meeting preparation.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Enhancements to document summary feature with self-enablement guidance</td><td style=\"width: 62.3071%; height: 138.516px;\">Users who attempt to use Doc Summary when it&#39;s unlocked but disabled will now see a helpful pop-up that guides them through the self-enablement process. The system displays the Doc Summary call-to-action button when Chat Summary is disabled but unlocked and visible for the account. When users click this button, they&#39;ll see guidance on how to configure the feature themselves or request admin enablement if needed. This enhancement streamlines the user experience by providing clear pathways to activate document summarization capabilities.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 123.125px;\"><td style=\"width: 5.98481%; height: 123.125px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 123.125px;\">Enhancement to shared space ownership transfer</td><td style=\"width: 62.3071%; height: 123.125px;\">Owners of shared spaces can now reassign ownership to another member by navigating to view members, selecting <strong>More actions</strong> from a member in the list, and selecting <strong>Assign as owner</strong>. This option appears below <strong>Assign as admin</strong> and is only available to current owners. The option will not appear for external users as ownership cannot be transferred to them. When ownership is transferred in a shared space, the previous owner is automatically made an admin, maintaining their privileges. This streamlined process makes it easier for teams to manage shared space ownership while preserving appropriate access levels.</td><td style=\"width: 6.1159%; height: 123.125px;\">Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 153.906px;\"><td style=\"width: 5.98481%; height: 153.906px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 153.906px;\">Continuous meeting chat support for PMI meetings</td><td style=\"width: 62.3071%; height: 153.906px;\">Users can now use continuous meeting chat (CMC) for PMI (Personal Meeting ID) meetings when the setting <strong>Participants can join before host</strong> is disabled. If this setting is enabled, the option to use CMC will be hidden from the meeting interface. For scheduled PMI meetings, CMC activates once the user or another participant sends at least one message. When enabled, existing chat history will be preloaded, and all new messages will be saved in the corresponding meeting chat thread. For instant PMI meetings, any messages sent in the <strong>Everyone</strong> chat will automatically trigger the creation of a new team chat, where the full meeting chat history will be stored. This update helps keep all meeting conversations organized and easily accessible, allowing users to maintain a continuous flow of communication before, during, and after meetings.</td><td style=\"width: 6.1159%; height: 153.906px;\"><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 76.9531px;\"><td style=\"width: 5.98481%; height: 76.9531px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 76.9531px;\">Archiving channels in shared spaces</td><td style=\"width: 62.3071%; height: 76.9531px;\">Shared space channel owners can now archive inactive synced and public-to-member channels to declutter their channel lists. Archived channels remain visible in the shared space list with a distinct visual indicator, making them easily identifiable. When a channel is unarchived, it maintains its original membership, and synced channel relationships are preserved. This feature helps teams maintain organized channel lists while preserving important content and conversation history.</td><td style=\"width: 6.1159%; height: 76.9531px;\">Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 123.125px;\"><td style=\"width: 5.98481%; height: 123.125px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 123.125px;\">Add Apps to chats and manage Apps, Workflows, and forwarding email through the Integrations tab (channels, group chats, and CMCs)</td><td style=\"width: 62.3071%; height: 123.125px;\">Users can now add and manage <strong>Apps</strong> directly in chats. By typing and &#64;mentioning an app in the compose box, the app can be added, after which it will respond with the available commands. <br />Additionally, users can access and manage <strong>Apps</strong>, <strong>Workflows</strong>, and forwarding email addresses from the new <strong>Integrations</strong> tab, available through the members list icon in any channel, group chat, or continuous meeting chat. Within the members list, tabs for <strong>Members</strong>, <strong>Member Groups</strong>, <strong>Integrations</strong>, and <strong>Channel Settings</strong> are displayed in a streamlined modal view. For chats without connected apps, workflows, or forwarding emails, clear empty states provide guidance and calls to action such as <strong>Create email address</strong>, <strong>Add Apps</strong>, or <strong>Add Workflows</strong>. This centralized access point enhances visibility, discoverability, and management in one convenient location.</td><td style=\"width: 6.1159%; height: 123.125px;\">Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\" style=\"height: 46.1719px;\"><td style=\"width: 5.98481%; height: 46.1719px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 46.1719px;\">Support mouse click highlighting during recording</td><td style=\"width: 62.3071%; height: 46.1719px;\">Users can enable click highlighting while recording Zoom Clips to provide a visual indicator for mouse clicks. When enabled, a halo effect appears around the cursor whenever the user clicks, making interactions more visible to viewers.</td><td style=\"width: 6.1159%; height: 46.1719px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\" style=\"height: 61.5625px;\"><td style=\"width: 5.98481%; height: 61.5625px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 61.5625px;\">Support higher resolution options (2K/4K)</td><td style=\"width: 62.3071%; height: 61.5625px;\">Users can select higher resolution options when recording Zoom Clips on Mac devices (Mac M series), including 2K and 4K. The recording interface displays clear indicators showing which resolution is currently selected. When choosing higher resolutions, users receive information about the increased storage requirements and bandwidth needs for sharing these larger files.</td><td style=\"width: 6.1159%; height: 61.5625px;\">macOS</td></tr><tr class=\"table-row\" style=\"height: 46.1719px;\"><td style=\"width: 5.98481%; height: 46.1719px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 46.1719px;\">Support clips streaming during a meeting or webinar</td><td style=\"width: 62.3071%; height: 46.1719px;\">Hosts and participants can select and share clips from their library and stream it during meetings or webinars, without leaving the live session.</td><td style=\"width: 6.1159%; height: 46.1719px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\" style=\"height: 76.9531px;\"><td style=\"width: 5.98481%; height: 76.9531px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 76.9531px;\">Audio quality detection indicator</td><td style=\"width: 62.3071%; height: 76.9531px;\">Users receive a real-time visual indicator when the audio quality during their recording falls below an acceptable threshold. The system monitors multiple factors including microphone input level, background noise, and echo to determine audio quality. This non-intrusive but clearly visible indicator allows users to identify audio issues while they are still recording, giving them the opportunity to make necessary adjustments immediately. Users can choose to continue recording despite the warning or take steps to improve the audio quality.</td><td style=\"width: 6.1159%; height: 76.9531px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\" style=\"height: 169.297px;\"><td style=\"width: 5.98481%; height: 169.297px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 169.297px;\">SMS admin controls for inbound attachments, group messaging, and character limits</td><td style=\"width: 62.3071%; height: 169.297px;\">Account owners and admins can manage key SMS security features to address compliance concerns in regulated industries. The new controls include the ability to block inbound attachments to prevent potential malware, disable group SMS functionality at the organization, site, or group level, and set custom character limits for messages. Users will see the maximum allowed character count while composing messages, and receive appropriate notifications when attempting actions restricted by policy. Recipients of group messages cannot respond to the group when this feature is disabled by administrators. These enhanced controls position Zoom Phone as a strong option for compliant SMS messaging, particularly in the financial services sector.</td><td style=\"width: 6.1159%; height: 169.297px;\">Windows<br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 153.906px;\"><td style=\"width: 5.98481%; height: 153.906px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 153.906px;\">Privacy controls and audio prompts enhancement for Zoom Phone AI Companion</td><td style=\"width: 62.3071%; height: 153.906px;\">When both Zoom Phone users are on the same call, a clear indicator shows which user has AI Companion enabled. Users can send requests to other participants to turn off AI Companion and delete conversation assets during a call. Users can also copy specific sections of call summaries individually, such as Key Points, Summary, and Next Steps under <strong>Call summary</strong>. These enhancements improve privacy controls and usability when using AI features during phone calls.</td><td style=\"width: 6.1159%; height: 153.906px;\">Windows<br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">Changed feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Online Fax tab moved under Zoom Phone</td><td style=\"width: 62.3071%; height: 138.516px;\">Users can access the Online Fax functionality as a tab under the Zoom Phone interface rather than as a separate top navigation item. On the Zoom Workplace desktop app, the <strong>Fax</strong> tab appears alongside <strong>Voicemail</strong>, <strong>History</strong>, and <strong>SMS</strong> options within the <strong>Phone</strong> tab. Mobile users can access the <strong>Fax</strong> tab through the <strong>Reorder</strong> menu, with visibility controlled by the Online Fax policy settings. Desktop users maintain the flexibility to move the <strong>Fax</strong> tab back to the top navigation bar if preferred. This reorganization helps reduce app sprawl in the top navigation while maintaining easy access to fax functionality.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Mute incoming calls without sending to voicemail</td><td style=\"width: 62.3071%; height: 138.516px;\">Users can silence incoming call ringers on all their devices simultaneously without sending the caller to voicemail. The feature allows reusing the existing silence notification button with an added option to select whether silencing applies to the current device only or all devices. This functionality works with calls from regular sources and call queues, with existing <strong>Skip</strong> and <strong>Accept</strong> behaviors remaining unchanged. The silencing option extends to certified desk phones when activated from the Zoom Workplace app. This enhancement is particularly valuable for legal professionals and high-profile users who need to discreetly manage incoming calls without giving callers the impression they&#39;ve been sent directly to voicemail.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows<br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Customizable navigation bar</td><td style=\"width: 62.3071%; height: 138.516px;\">Users can customize their navigation bar in the Zoom Workplace app to show or hide items based on their needs. With this enhancement, the SMS tab can appear as a standalone item alongside Phone, Meetings, and Team Chat tabs instead of being nested under the Phone tab. Users can also rearrange the location of tabs on the navigation bar. The SMS tab displays a notification badge that updates in real-time, showing the same count it displayed when located under the phone tab. This customization provides a more flexible Zoom experience that can be tailored to specific workflow needs. This feature must be enabled by Zoom.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows<br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 138.516px;\"><td style=\"width: 5.98481%; height: 138.516px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 138.516px;\">Create Zoom Docs with AI-generated call summaries</td><td style=\"width: 62.3071%; height: 138.516px;\">Users who complete a phone call with AI Companion enabled can create a Zoom Doc containing their call summary after the call ends. After completing a call with AI Companion enabled, users have the option to manually create a Zoom Doc that includes an automatically generated call summary, next steps, and other sections based on selected templates. The document automatically includes the call summary and next steps generated by AI Companion, eliminating the need to manually summarize the conversation. The newly created document is titled &#34;Call Summary with User&#34; or &#34;Call Summary with (Number)&#34; for unknown contacts. A dedicated &#34;My Calls&#34; section appears in the Zoom Docs navigation bar, making it easy to locate all call-related documents in one place. This integration between Zoom Phone and Zoom Docs enhances productivity by preserving important call information in a structured, shareable format. This feature must be enabled by Zoom.</td><td style=\"width: 6.1159%; height: 138.516px;\">Windows<br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\" style=\"height: 92.3438px;\"><td style=\"width: 5.98481%; height: 92.3438px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 92.3438px;\">Call queue management on mobile devices</td><td style=\"width: 62.3071%; height: 92.3438px;\">Call queue admins can manage their call queues directly from mobile devices. The mobile interface allows account owners and admins to monitor real-time team member status and manage queue participation for specific members. In addition, admins can configure the number of waiting calls under <strong>Alerts &amp; Notifications</strong> to receive mobile alerts when calls are overloaded and waiting for an agent to answer. This enables admins to take action quickly—such as adding more members to the queue—supporting more efficient queue management for field workers and healthcare managers while away from their desks. This feature must be enabled by Zoom.</td><td style=\"width: 6.1159%; height: 92.3438px;\">iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\" style=\"height: 92.3438px;\"><td style=\"width: 5.98481%; height: 92.3438px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 92.3438px;\">Timezone field for address book contacts</td><td style=\"width: 62.3071%; height: 92.3438px;\">Account owners and admins can create and update address book contacts with timezone as an optional standard field. This field can be added through manual entry in the web admin portal, Open APIs, or CSV import. Agents can also create or update it from the client. Contact fields, including timezone, are visible when viewed in the desktop app, web admin portal, and CSV export.</td><td style=\"width: 6.1159%; height: 92.3438px;\">Windows<br />macOS <br />CTI connector</td></tr><tr class=\"table-row\" style=\"height: 61.5625px;\"><td style=\"width: 5.98481%; height: 61.5625px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 61.5625px;\">Release engagement action for outbound messaging</td><td style=\"width: 62.3071%; height: 61.5625px;\">Agents can release outbound SMS/WhatsApp engagements back to the queue using the <strong>Release</strong> button. This aligns the outbound messaging workflow with the existing inbound engagement process, providing a more consistent experience. With this functionality, agents no longer need to perform manual transfers to specific queues when handling outbound communications.</td><td style=\"width: 6.1159%; height: 61.5625px;\"><br />Windows <br />macOS</td></tr><tr class=\"table-row\" style=\"height: 76.9531px;\"><td style=\"width: 5.98481%; height: 76.9531px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 76.9531px;\">Cobrowse support during video engagements</td><td style=\"width: 62.3071%; height: 76.9531px;\">Agents can initiate cobrowse sessions during video engagements to assist customers with website navigation or form completion. Cobrowse displays only the relevant webpage to help agents focus on the issue while protecting customer privacy. Built-in privacy measures help ensure that sensitive personal information remains hidden. Agents can also use annotation tools to guide customers in real time, enabling faster and more effective support. This feature must be enabled by Zoom.</td><td style=\"width: 6.1159%; height: 76.9531px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\" style=\"height: 123.125px;\"><td style=\"width: 5.98481%; height: 123.125px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 123.125px;\">Allow agent to set next status while Occupied</td><td style=\"width: 62.3071%; height: 123.125px;\">Agents can specify their next status while their agent status is set to an <strong>Occupied</strong> state. When an agent is <strong>Occupied</strong>, they can set their status to <strong>Ready</strong> or <strong>Not Ready</strong>, which will take effect once they are no longer <strong>Occupied</strong> with current engagements. This feature provides smoother agent transitions between their work statuses during the day. Supervisors can view and modify an agent&#39;s next status from the <strong>Teams</strong> page. This enhancement ensures accurate status tracking and reporting while giving agents more control over their availability. This feature must be enabled by Zoom.</td><td style=\"width: 6.1159%; height: 123.125px;\"><br />Windows <br />macOS <br />Linux <br />iOS <br />Android <br />CTI connector</td></tr><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080489\" rel=\"nofollow\"> Hub features </a> </span></th></tr><tr class=\"table-row\" style=\"height: 61.5625px;\"><td style=\"width: 5.98481%; height: 61.5625px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 61.5625px;\">Enhancements to Zoom Hub file path breadcrumb with folder action menu</td><td style=\"width: 62.3071%; height: 61.5625px;\">Users can now right-click on any folder within the Zoom Hub file path breadcrumb to access the folder action menu. This menu provides the same options available when right-clicking folders in the file list, including Copy Link and other commonly used actions. The enhancement maintains consistency across the Zoom Hub interface and eliminates the need to navigate back to the file list to perform these operations.</td><td style=\"width: 6.1159%; height: 61.5625px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\" style=\"height: 76.9531px;\"><td style=\"width: 5.98481%; height: 76.9531px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 76.9531px;\">Calendar integration with Zoom Hub</td><td style=\"width: 62.3071%; height: 76.9531px;\">Users can now access Zoom Hub directly from Zoom Calendar to manage meeting files. With this integration, users can easily find meetings, access related files, and share resources with teammates without leaving the Zoom ecosystem. The new entrance on Calendar provides a seamless connection to Hub, allowing users to manage all meeting-related assets in one place. This integration creates a closed loop for post-meeting experiences, improving workflow efficiency for collaborative teams.</td><td style=\"width: 6.1159%; height: 76.9531px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\" style=\"height: 92.3438px;\"><td style=\"width: 5.98481%; height: 92.3438px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 92.3438px;\">Ask questions about your Hub files with AIC</td><td style=\"width: 62.3071%; height: 92.3438px;\">Users can select files from the Zoom Hub file list and ask Zoom AI Companion (AIC) questions about them without having to open and manually search through documents. This functionality supports various file types including Data Tables, Docs, Meetings, Summary Docs, Meeting Agendas, Whiteboards, Clips, and Recordings. Users can also reference Zoom Hub files directly from the AIC side panel using slashes to access file content. This feature significantly improves efficiency by allowing users to extract specific information from their documents without manually reviewing entire files.</td><td style=\"width: 6.1159%; height: 92.3438px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0081420\" rel=\"nofollow\">Video Management features</a> </span></th></tr><tr class=\"table-row\" style=\"height: 107.734px;\"><td style=\"width: 5.98481%; height: 107.734px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 107.734px;\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0081430\" rel=\"nofollow\">Introducing Zoom Video Management</a></td><td style=\"width: 62.3071%; height: 107.734px;\">Zoom Video Management is a Zoom add-on that provides a centralized platform for creating, viewing, and managing organization-wide video content, which includes Zoom recordings (Meeting, Webinar, and Event) and Clips, and also 3rd-party videos. As a viewer, you can search for content within the entire organization, start or continue watching videos, check out the most recent content updates, and conveniently access your favorite channels. As a creator, you can record/upload videos, organize videos by creating channels and playlists, and get an overview of your content&#39;s performance metrics, recent activities, and popularity. As an instructor, you can make lectures and class recordings in LMS available for offline viewing.<br />Additionally, you can refer to the <a href=\"https://www.zoom.com/en/products/video-management/\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Zoom Video Management product page</a>.</td><td style=\"width: 6.1159%; height: 107.734px;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\" style=\"height: 15.3906px;\"><th style=\"width: 94.5878%; height: 15.3906px;\" colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\" style=\"height: 46.1719px;\"><td style=\"width: 5.98481%; height: 46.1719px;\">New or enhanced feature</td><td style=\"width: 20.1799%; height: 46.1719px;\">Enable iOS mobile app logout via Universal Link Callback - EnableAutoLogoutWithULC</td><td style=\"width: 62.3071%; height: 46.1719px;\">Disabled by default, admins can enable this policy to log out of the Zoom Workplace iOS mobile app via <a href=\"https://www.groundctl.com/kb/8130\" rel=\"nofollow\"> <u>Universal Link Callback</u></a> (ULC). A ULC requests the app to log out from current devices, reset all settings, and remove configuration data.</td><td style=\"width: 6.1159%; height: 46.1719px;\">iOS <br />iOS (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Security enhancements</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where participants were unable to start computer recording using the keyboard shortcut <strong>ALT &#43; R</strong> when another participant was already computer recording</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the time zone displayed for Astana and Dhaka was incorrect</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which setting a specific version for the <strong>Require users to update the client</strong> setting in the web portal caused the Zoom mobile app to become unusable since that version was not yet available on the Google Play store</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with gallery view where the bottom video tiles kept switching back and forth when users were accessing meetings from iPad devices</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the Zoom Workplace app froze during webinars once users began interacting with chat and Q&amp;A</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the video positions during custom immersive views were not retained after screen sharing</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue that resulted in an SSO authentication loop when joining concurrent meetings</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where users were unable to close the system keyboard using the swipe gesture in Zoom Docs</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which PowerPoint presentations with Slido polls became unresponsive during webinars when slide control was used by someone other than the host</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which adding emojis to text on classic whiteboards caused the entire text to disappear</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the <strong>Contacts</strong> tab appeared to be blank due to having contacts without names or other available data</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the &#39; <strong>&#64;</strong> &#39; key could not be used with virtual French (FR) keyboard layouts</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue when joining meetings with personal links</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the <strong>When a cloud recording is available</strong> email notification still appeared on mobile even after being disabled</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which attendees experienced a brief echo when joining a webinar from backstage</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which a subset of users experienced immediate app crashes when starting the app</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Assistant for Zoom Phone did not pop up when receiving an incoming call, preventing the user from answering the call</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue with a delay in displaying the transfer cancelation option when requesting a transfer in the Zoom Workplace mobile app while using Zoom Phone</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which webinar waiting room images did not appear</td><td>Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The following features have been pulled from release due to issues with deployment and will be available in another upcoming release:</p>\r\n<ul><li style=\"font-weight: bold;\"><strong>File shortcuts in Zoom Hub</strong></li><li style=\"font-weight: bold;\"><strong>Support for Zoom Contact Center mobile app</strong></li><li><strong>Incoming engagement handling on multiple platforms</strong></li></ul>\r\n<h3 id=\"mcetoc_1j3pbabh25\">September 1, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\" style=\"width: 77.6448%;\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" style=\"width: 12.5927%;\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" style=\"width: 12.4693%;\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" style=\"width: 5.92598%;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" style=\"width: 14.6912%;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" style=\"width: 16.6671%;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" style=\"width: 12.4693%;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" style=\"width: 12.8396%;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" style=\"width: 12.5927%;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td style=\"width: 12.5927%;\">6.5.12 (14128)</td><td style=\"width: 12.4693%;\">6.5.12 (63499)</td><td style=\"width: 5.92598%;\">--</td><td style=\"width: 14.6912%;\">6.5.12 (33008)</td><td style=\"width: 16.6671%;\">6.5.12 (33009)</td><td style=\"width: 12.4693%;\">6.5.12 (27794)</td><td style=\"width: 12.8396%;\">6.5.12 (27795)</td><td style=\"width: 12.5927%;\">6.5.12 (27796)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>\r\n<p>Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)<br />visionOS</p>\r\n</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j3447dnt5\">August 21, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.5.11 (13227)</td><td>6.5.11 (62892)</td><td>6.5.11 (4015)</td><td>6.5.11 (32752)</td><td>6.5.11 (32753)</td><td>6.5.11 (27567)</td><td>6.5.11 (27568)</td><td>6.5.11 (27569)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue for a subset of users in which meetings unexpectedly timed out at 40 minutes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which users could only schedule a meeting or offline event in their primary calendar instead of in a shared calendar</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j2l51gri5i\">August 18, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.5.10 (12704)</td><td>6.5.10 (62715)</td><td>6.5.10 (3973)</td><td>6.5.10 (32613)</td><td>6.5.10 (32614)</td><td>6.5.10 (27510)</td><td>6.5.10 (27511)</td><td>6.5.10 (27512)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Upcoming end of support for iOS 13 and iOS 14</td><td>\r\n<p>This is the last planned release to support iOS versions 13 and 14. With next month&#39;s planned release, iOS users will need to upgrade to iOS 15 or higher to continue to receive additional Zoom app updates.</p>\r\n<p><strong>Note</strong>: This description previously stated that iOS (Intune) was also impacted, however, Zoom for iOS (Intune) had end of support for iOS versions below iOS 16 beginning with version 6.4.0, released in March 2025.</p>\r\n</td><td>iOS</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Upcoming end of support for Android 8.0 and Android 8.1</td><td>This is the last planned release to support Android versions 8.0 and 8.1. With next month&#39;s planned release, Android users will need to upgrade to Android 9.0 or higher to continue to receive additional Zoom app updates.</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to settings discovery with new search and navigation tools</td><td>Users can search for specific settings within the Zoom Workplace app&#39;s Settings dialog using a search bar at the top of the window. The search functionality matches user queries against setting names and descriptions, displaying instant results that include the setting name, description, and category location. Each search result can be selected via mouse or keyboard, directing users to the exact setting location with temporary highlighting for easy identification.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meeting features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support 5G network slicing for meetings</td><td>Users connecting to Zoom Meetings on Android devices can leverage 5G network slicing technology for superior video performance. The feature helps maintain sustained connectivity in both light and dense environments, from cell tower proximity to edge coverage areas. This implementation matches existing iOS capabilities that use mobile device management for high-priority applications. The feature operates transparently with cellular rate plans and requires no user intervention. <br /><strong>Notes</strong>:\r\n<ul><li>Network slicing is a way for operators to slice network resources to provide optimum traffic routes between source and destination.</li><li>A cellular service provider subscription is required.</li></ul>\r\n</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Meeting scheduling conflict resolution with AI Companion</td><td>When scheduling a meeting, AI Companion can assist the host with resolving time and date conflicts before sending the meeting invite. AI Companion will actively monitor participant availability, identifies optimal meeting times, and coordinates with conflicting invitees via email or team chat to find suitable alternatives. Hosts receive notifications when their input is needed and can track coordination progress through the AI Companion panel.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to joining personal meeting rooms</td><td>Users can join personal meeting rooms more efficiently when multiple users share the same personal link name. When there is no overlap in personal link names, users directly join the personal meeting ID (PMI). If an overlap exists with a user in the same account, they can choose to join that specific PMI or enter a full URL/meeting ID for a different one. For overlapping personal link names outside their account, users can enter either the full URL or meeting ID to join the correct meeting. This improvement helps users avoid joining incorrect meetings while protecting privacy and account information.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to camera anchor in Vision Pro</td><td>Users joining meetings through Vision Pro can maintain consistent eye contact with meeting participants through an improved camera anchor system. The camera anchor remains fixed to the main meeting window that displays participant views, even when switching between mul

ting users to the meeting details page. Here, they can access available meeting assets such as meeting recording, summary, continuous chat log, as well as any content shared during the session, such as whiteboards, links, and notes.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Mail and Calendar features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to calendar usability</td><td>Users can experience improved functionality across various calendar features in the Zoom Workplace app. The updates address common interaction points including event creation, calendar navigation, and view preferences. These improvements streamline daily calendar management tasks and provide more intuitive controls for managing schedules. The enhancements focus on resolving existing usability issues to create a more efficient calendar experience.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced meeting cards with expanded participant visibility and management</td><td>Users can view a complete list of meeting participants directly within the primary meeting card interface. The participant list appears in the full meeting page, providing clear visibility of all attendees.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improvements to forwarded messages in Team Chat</td><td>The forwarded message feature in Team Chat now retains the original rich text formatting and includes attribution details such as the original channel, author name, and timestamp. Users can also add a note with rich text formatting in the forward modal before forwarding the message. Additionally, the forwarded message contains a deep link to the original message, allowing users to access the conversation context. This enhancement ensures that forwarded messages maintain their original formatting and context, improving the overall communication experience. <strong>Note</strong>: Message attributes from private chats and channels are hidden. <br /><br /></td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Zoom Workflow Automation now generally available</td><td>Zoom Workflow Automation is now generally available to paid Zoom users at no additional cost during the trial period. This powerful tool allows users to create and configure automated workflows across Zoom Workplace, including Zoom Meetings, Zoom Team Chat, Zoom Docs, and third-party apps, enhancing productivity and streamlining processes.With Workflow Automation, users can trigger actions, integrate with external tools, and automate responses based on user interactions, such as emoji reactions. This seamless automation improves efficiency for both group admins and individual users. Key updates and benefits include:\r\n<ul><li><strong>Multi-step workflows</strong>: Automate tasks using tools like conditional logic, switches, loops, and delays across Zoom and connected apps.</li><li><strong>No-code drag-and-drop builder</strong>: Build workflows easily, without any coding knowledge.</li><li><strong>Triggers</strong>: Automate actions based on activities in Team Chat, Meetings, and AI Companion. Examples include:\r\n<ul><li>Schedule a workflow</li><li>Incoming Webhook</li><li><strong>Team Chat</strong>: Emoji reactions, &#64;mentions, Channel Member Joins</li><li><strong>Meeting</strong>: Starts, ends, participant joins</li><li><strong>AI Companion</strong>: Meeting summary available</li></ul>\r\n</li><li><strong>Actions</strong>: Automate processes across Team Chat, Meetings, Zoom Docs, Zoom Phone, and third-party apps like Gmail, Google Drive, JIRA, Microsoft OneDrive, Microsoft Outlook, and many more. Examples include:\r\n<ul><li><strong>Team Chat</strong>: Get/send/reply messages, collect information, send an approval request, star/create/archive channels, add members, and more</li><li><strong>Meeting</strong>: Schedule, update, add participants, and more</li><li><strong>Zoom Docs</strong>: Create, update, share, and more</li><li><strong>AI Companion</strong>: Summarize with AI Companion for Team Chat</li><li><strong>Apps</strong>: Integrate with Google Mail, Google Docs, Jira issues, Office 365 Docs, and Outlook Calendar events</li></ul>\r\n</li><li><strong>Predefined workflow templates</strong>: Use ready-made templates to streamline tasks such as introduce new members, recurring project updates, collect team feedback, time-off requests, reply using emojis, create a Zoom Doc from a meeting summary, daily chat summary, incident response, and more.</li><li><strong>Activity log and admin dashboard</strong>: Track workflow activity with a detailed log for users and an overview of workflow usage for admins.</li><li><strong>AI Companion summaries</strong>: Automatically add AI Companion meeting summaries to Zoom Docs and share them in a dedicated team channel, while also updating Team Chat thread summaries in a designated channel or Zoom Doc to keep teams aligned and informed on ongoing projects.</li><li><strong>Set reminders</strong>: Automatically set recurring reminders for project status updates in a Team Chat channel, or use custom emoji reactions to quickly answer common questions</li><li><strong>Track approvals</strong>: Create automated notifications and approval workflows in chat to track team member responses</li></ul>\r\n<p>Zoom Workflow Automation makes it easier to automate everyday tasks, integrate with external tools, and enhance the flexibility and efficiency of your Zoom experience.Learn more about <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0076048\" rel=\"nofollow\"> enabling </a> and <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0076049\" rel=\"nofollow\"> using </a> Zoom Workflow Automation.</p>\r\n<p><strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend release, currently scheduled for February 19, 2025.</p>\r\n</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Clips avatars with AI Companion</td><td>Users can generate a Clip by simply selecting from a library of avatars and adding a transcript, removing the need to schedule unnecessary meetings and helping users communicate effectively even when in different time zones. Users can also change the virtual background of their avatar video before finalizing it, so that the video fits the visual style or context they need. Additionally, users can view a detailed breakdown of their avatar generation usage, showing how many minutes were used per video. <strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend release, currently scheduled for February 28, 2025.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Option to hide Zoom Phone calls from device call history on iOS/iPadOS</td><td>Account owners and admins can enable a policy to hide Zoom Phone calls from appearing in the iOS and iPadOS device call history. The policy sets the default value of <strong>Hide phone calls in device call history</strong> to on, preventing Zoom Phone calls from being added to the device&#39;s <strong>Recents</strong> list. This setting applies only to devices with CallKit enabled, and admins can lock the setting to prevent users from making changes. Users can hide Zoom Phone calls from appearing in the call history of their iOS/iPadOS devices. This setting can be enabled under the <strong>Phone</strong> settings in the Zoom Workplace app. This allows them to maintain separation between personal and professional calls on their mobile devices.</td><td>iOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to outbound caller ID selection with 100-number limit</td><td>Account owners and admins can select up to 100 outbound caller IDs for their organization on the Zoom web portal. This feature limits the number of outbound caller IDs shown. When enabled, users will only see the selected outbound caller IDs in their Zoom app interface. Any extensions with more than 100 outbound caller IDs will not be displayed on the app. The system processes caller ID lists with display indicators to control visibility in the user interface. This enhancement improves caller ID organization and makes it easier for users to select the appropriate numbers for outbound calls.</td><td>Windows <br />macOS <br />Linux <br />iOS <br /><br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatically join a push to talk channel</td><td>Account owners and admins can configure one push to talk channel as the default option for each site in their organization. Users who belong to multiple sites with default channels must manually select their channel, and admins receive notifications about potential member conflicts. The system supports channel management across mobile platforms and provides insights through telemetry tracking of account enablement, channel counts, and user distribution. This automated channel connection feature simplifies the push to talk experience for organizations with front-line workers using Zebra devices and other mobile platforms.</td><td>iOS <br /><br />Android</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Use of Zoom Phone for emergency calls in Zoom Contact Center</td><td>Zoom Contact Center now supports emergency calling for agents and supervisors, enabling them to dial 911, 112, and other emergency service numbers directly through the Zoom Contact Center dialpad. When an emergency number is dialed, the Zoom Phone dialer will automatically open and connect the call using the Zoom Phone emergency services configuration. This integration ensures that agents and supervisors can quickly reach emergency services without needing a separate phone. <br /><strong>Note</strong>: This feature requires a minimum client version of 6.3.10 for Windows and 6.4.0 for Mac. This feature must be enabled by Zoom.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Supervisor email controls</td><td>Supervisors can take over email engagements from agents they manage within Zoom Contact Center. When taking over an engagement, supervisors can view the complete email thread and any draft replies before assuming control. The system notifies agents when their email engagement is reassigned to a supervisor. This enhancement enables supervisors to provide direct assistance for complex customer interactions through the email channel.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Integration with PCI Pal (digit-based) for secure payment processing</td><td>Account owners and admins can enable media redirection to <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0075513\" rel=\"nofollow\"> PCI Pal for secure payment processing </a> during voice engagements. During an active call, the agent enters a unique code automatically generated by the payment application, redirecting media to PCI Pal for secure handling. This integration supports native, PWA, and CTI clients, allowing businesses to process payments securely while maintaining PCI compliance within their existing CRM workflows. This feature must be enabled by Zoom.</td><td><br /><br />Windows <br />macOS <br />CTI connector</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Consumer name display during video engagement</td><td>Agents can now see consumers&#39; actual name instead of the generic <strong>Consumer</strong> label in the Zoom Contact Center interface during video engagement. The system displays names based on available information, prioritizing the preferred name, then the first and last name combination, first name only, or last name only. These names appear in agent ringing notifications, profile tabs, the active sections of the left navigation, and engagement headers. This update enables agents to deliver more personalized service by clearly identifying the consumers they are assisting.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to opt in or out of all queues within a specific channel</td><td>Agents and supervisors can opt in or out of all queues at once in Zoom Contact Center. This feature allows agents who are part of multiple queues across different channels to manage their participation more efficiently, saving time for both agents and supervisors when handling queue assignments.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0065270\" rel=\"nofollow\">Revenue Accelerator features</a> </span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Support for the Conversations tab in the Zoom mobile app</td><td>Users can access and review conversation recordings on their mobile devices through the Zoom Revenue Accelerator (ZRA) <strong>Conversations</strong> tab in the Zoom mobile app. The mobile app allows key activities and call playback, providing sales leaders and customer relationship owners (CROs) with the ability to review crucial customer interactions from their mobile devices. Users can see and reply to existing comments, as well as enter new comments. Users can share recordings and update sharing permission settings. <br />They also have the ability to add calls to playlists, access playlists, and share playlists. This feature enhances mobility and productivity for sales teams, enabling them to stay up-to-date with critical conversations and make informed decisions regardless of their location. <strong>Note</strong>: This feature will be rolled out to accounts over time and will be generally available on February 28, 2025.</td><td>iOS</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The <strong>Ability to spotlight a specific shared item for participants in meetings</strong> and <strong>Enhancements to meeting agenda and real-time summary</strong> features have been pulled from release due to issues with deployment and will be available in another upcoming release.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Security enhancements</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app 6.1.5 would crash unexpectedly</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where clicking a Zoom App link in a browser did not open the app properly if Zoom was already running</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom app would close unexpectedly when adding an additional account</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app would auto-update during a call, causing the call to drop</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Calendar displayed events that did not exist</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where clicking the <strong>Refresh</strong> button in calendar view resulted in error <strong>100000401</strong></td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where updated Team Chat chatbot messages did not automatically scroll into view, requiring users to scroll manually</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where in-meeting chats were not being automatically saved locally</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where users on the allow list could not send messages in the announcement channel</td><td>iOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where users could not manually type an external member&#39;s email address to add them to a Team Chat channel, but copying and pasting worked</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue affecting a subset of users where using AI Companion 2.0 hero prompts, such as <strong>Summarize this meeting</strong>, from the Workplace App <strong>Home</strong> tab resulted in a null output</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r327\">January 27, 2025</h3>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI Companion 2.0 for Zoom-hosted Models Only (ZMO) users</td><td>\r\n<p>AI Companion 2.0 is available for Zoom-hosted Models Only (ZMO) users. AI Companion provides users with a personal assistant that helps them stay up-to-date on important conversations and synthesize information to make faster, more informed decisions. Users can ask AI Companion 2.0 questions and receive tailored responses using information across Zoom Workplace, uploaded documents, and, if connected, Microsoft O365 and Google email and documents. The Meeting summary, Smart recordings, Meeting questions, Chat compose, Thread summary, Call summary, Voicemail tasks, SMS thread summary, Clips title and description generation, and Workspace recommendations are available for ZMO users.AI Companion 2.0 is available with ZMO for customers hosted in the US and to those hosted in select regional locations which include: Europe, Canada, and India.</p>\r\n<p><strong>Note</strong>: There is no new Zoom Workplace App version associated with this release.</p>\r\n</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r328\">January 15, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.3.6 (56144)</td><td>6.3.6 (47101)</td><td>6.3.6 (6315)</td><td>6.3.6 (27137)</td><td>6.3.6 (27138)</td><td>6.3.6 (21566)</td><td>6.3.6 (21567)</td><td>6.3.6 (21568)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Introducing the new and improved sidebar experience in Team Chat</td><td>Team Chat introduces a new sidebar to organize and streamline chat communication, featuring a more intuitive, two-tiered navigation structure. Here&#39;s what&#39;s new:\r\n<ul><li><strong>A more intuitive layout</strong>: With the new default tabs for direct messages, channels, apps, folders, starred, shared spaces, and more, users can easily drag and reorder tabs for better organization.</li><li><strong>Badging control</strong>: Users have the ability to customize badging at each tab level with three options: <strong>All messages</strong>, <strong>Mentions only</strong>, and <strong>Off</strong>.</li><li><strong>Starred chats and Folders as tabs</strong>: Users can access their important starred chats and folders as tabs, which can be added and reordered from the <strong>More</strong> tab.</li><li><strong>Chat tools in the More tab</strong>: Users can find advanced chat tools like drafts, bookmarks, and external requests in the <strong>More</strong> tab by default, with the option to reorder them using drag and drop.</li><li><strong>Enhancements to the All tab</strong>: Users can sort chats by recent or section views in the <strong>All</strong> tab to see a flat view or sectional view of their listed chats. This helps reduce toggle tax and scrolling fatigue.</li><li><strong>Sent tab</strong>: A dedicated tab for users&#39; sent messages, making it easier to track sent messages, shared files, and more.</li><li><strong>Meeting chat badging</strong>: Users can customize how individual meeting chat notifications are managed with a new setting to control unread count for each meeting chat.</li><li><strong>Sorting and filters</strong>: Quickly find relevant chats with advanced sorting and filtering options, such as a <strong>Today</strong> filter on the <strong>Meeting chats</strong> tab.</li><li><strong>External connections</strong>: <strong>External requests</strong> has been renamed to <strong>External connections</strong>, which now includes a list of all external contacts for quicker access.</li></ul>\r\nLearn more about the <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0078812\" rel=\"nofollow\">new Zoom Team Chat sidebar experience</a>.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Integration features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to Zoom for Microsoft Teams</td><td>Zoom for Microsoft Teams has been enhanced for a better user experience. The <strong>Meeting</strong> and <strong>Phone</strong> tabs have been combined into a single <strong>Zoom Workplace</strong> tab. The user interface of the Meeting function, as well as the Notification to Chat, has been updated.</td><td>Windows <br />macOS<br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>Resolved an issue where the auto-update failed, causing the installer to repeatedly relaunch without completing the installation</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where non-existent events were displayed in Calendar for Zoom Workplace App</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r329\">January 6, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.3.5 (54827)</td><td>6.3.5 (46181)</td><td>6.3.5 (6065)</td><td>6.3.5 (26830)</td><td>6.3.5 (26831)</td><td>6.3.5 (21266)</td><td>6.3.5 (21267)</td><td>6.3.5 (21268)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> General features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to global navigation menu to reduce interface complexity</td><td>The Help icon (?) has been removed from the global navigation bar to reduce visual clutter while maintaining Help functionality through alternate access points. Users can still access Help features through the native operating system toolbars or the profile menu.</td><td>Windows <br />macOS<br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Meeting features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to contact requests during meetings</td><td>Users can send contact requests with a prefilled message during Zoom meetings through the Profile Card. When sending a contact request, the message field automatically includes contextual information about the current meeting, including the meeting name and date. This prefilled message helps recipients understand the context of the connection request, making it easier to identify and accept contact requests from meeting participants.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Webinar features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Simulive webinars with automatic transition to live</td><td>Hosts can schedule webinars to start with a pre-recorded video and automatically roll over to a live session after the recording completes. Hosts have the option to end the simulive portion early and transition to live manually. Attendees experience a seamless transition from the pre-recorded content to the live segment. Hosts and panelists are notified before the rollover to prepare for the live portion. This feature ensures webinars start on time with engaging content while enabling live interaction with the audience. Users must be on Zoom Workplace App version 6.3.5 or later to use this feature.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> Mail and Calendar features </span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Redesign email cards shared to Team Chat</td><td>Users can view the updated email card design when sharing an email to Team chat. The new design improves the visual consistency and user experience across the Zoom Workplace app.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to decline and remove meetings from the Meeting tab</td><td>Users can decline and remove meetings they were invited to directly from the <strong>Meeting</strong> tab in the Zoom Workplace App. When selecting the <strong>Decline and Remove</strong> option for an invited meeting, users receive a confirmation modal before the meeting is removed from their meeting list.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to report issues for Zoom Clips</td><td>Users can report issues related to Zoom Clips directly from the <strong>Report Problem</strong> list of the Zoom Workplace App. The sub-list for Clips includes options such as <strong>Recorder</strong>, <strong>Library in web browser</strong>, <strong>Library in Zoom app</strong>, and <strong>Others</strong>. This feature allows users to provide feedback and report problems specific to the Zoom Clips, enabling better support and improvements.</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Resolved an issue in the Zoom Workplace App where the <strong>All History</strong> and <strong>Caller ID</strong> sections displayed incorrect names</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue causing error code 105035 to appear when users attempted to share their screen</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the update prompt failed to initiate the update process after exiting a meeting</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where stopping screen sharing caused Zoom windows to consolidate onto one monitor and incorrectly resize the second window</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in the Outlook plugin where users encountered <strong>Error 5026</strong> when scheduling or managing meetings</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the incorrect user profile picture was displayed during incoming calls</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Team Chat window did not auto-scroll to display new messages in a thread</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the scroll bar in the <strong>Background &amp; Effects</strong> window became unresponsive during live meetings</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where recurring meetings with registration lost their recurrence and registrant data after starting the first instance of the meeting</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app window would freeze when closing the application</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue preventing users from viewing scheduled events on the calendar</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\n"}</script><link cus

<!DOCTYPE html><html lang="en" dir="ltr" ng-app="sn.$sp" ng-init="portal_id = '89275a53cb13020000f8d856634c9c51'" style="height: 100%" class="page-{{page.sys_id}} v{{page.sys_id}} ltr sn-sp-page" data-page-id="{{page.sys_id}}"><head sp-metatags=""><base href="/hc"></base><link rel="preload" href="/styles/fonts/glyphicons-halflings-regular.woff2" as="font" crossorigin="anonymous"></link><link rel="preload" href="/scripts/icon-fonts/font-awesome/fonts/fontawesome-webfont.woff2?v=4.7.0" as="font" crossorigin="anonymous"></link><title>Release notes for the Zoom Workplace app</title><meta http-equiv="X-UA-Compatible" content="IE=edge; IE=10"></meta><meta name="viewport" content="width=device-width, initial-scale=1.0"></meta><meta name="mobile-web-app-capable" content="yes"></meta><meta http-equiv="cache-control" content="public"></meta><meta http-equiv="cache-control" content="no-cache"></meta><meta http-equiv="cache-control" content="max-age=0"></meta><meta http-equiv="pragma" content="no-cache"></meta><link custom-tag="" rel="alternate" hreflang="en" href="https://support.zoom.com/hc/en/article?id=zm_kb&amp;sysparm_article=KB0061222"></link><meta custom-tag="" name="description" content="Zoom provides up-to-date release notes for the Zoom Workplace app on all supported platforms: Windows,"><script custom-tag="" type="application/ld+json">{"@context":"https://schema.org","@type":"TechArticle","headline":"Release notes for the Zoom Workplace app","publisher":"Zoom","url":"https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0061222","articleSection":"Zoom Releases by Product","dateModified":"2026-07-31 23:15:36","articleBody":"<p class=\"p1\">Zoom provides up-to-date release notes for the Zoom Workplace app on all supported platforms: Windows, macOS, Linux, Android, iOS, Android (Intune), iOS (Intune), and visionOS. This article contains information about recent changes, including new and enhanced features, updates to existing features, and bug fixes.</p>\r\n<p class=\"p1\">You can download the latest version of the Zoom Workplace app from the <a href=\"https://zoom.us/download\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Download Center</a>.</p>\r\n<p>Other platform updates: <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0063542\" rel=\"nofollow\">Zoom Rooms</a> and <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0060437\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Web</a></p>\n\n\n<div class=\"mce-toc\">\r\n<h2>Table of Contents</h2>\r\n<ul><li><a href=\"#01H84VG9B43F398FME6V8WHK0R\" rel=\"nofollow\">Upcoming release</a></li><li><a href=\"#01H84VG9B4H8QAGJMHPNHHDZ74\" rel=\"nofollow\">Released</a>\r\n<ul><li><a href=\"#mcetoc_1juac9fir6u\" rel=\"nofollow\">July 24, 2026</a></li><li><a href=\"#mcetoc_1juac9fir6v\" rel=\"nofollow\">July 22, 2026</a></li><li><a href=\"#mcetoc_1jtok65aca\" rel=\"nofollow\">July 20, 2026</a></li><li><a href=\"#mcetoc_1jredaefq5o\" rel=\"nofollow\">June 22, 2026</a></li><li><a href=\"#mcetoc_1jo23mae78r\" rel=\"nofollow\">May 18, 2026</a></li><li><a href=\"#mcetoc_1jncvlid75\" rel=\"nofollow\">Previous dates</a></li></ul>\r\n</li></ul>\r\n</div>\r\n<h2 id=\"01H84VG9B43F398FME6V8WHK0R\">Upcoming release</h2>\r\n<p>Details about upcoming releases will be posted as they become available.</p>\r\n<hr />\r\n<h2 id=\"01H84VG9B4H8QAGJMHPNHHDZ74\">Released</h2>\r\n<p><strong>Note</strong>: The information in past release notes may have been superseded by subsequent release notes. Please review all current release notes carefully.</p>\r\n<h3 id=\"mcetoc_1juac9fir6u\">July 24, 2026</h3>\r\n<p><strong>Note</strong>: Version <strong>7.0.6</strong> includes a security enhancement for the desktop app. This fix is also included in desktop app version <strong>7.1.5</strong> and later.</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th

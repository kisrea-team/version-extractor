"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Resolved an issue with the Zoom Workplace app version 6.7.5 freezing and causing high CPU usage for users on macOS 15 (Sequoia) and macOS 26 (Tahoe)</td><td>macOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jg5o285hg0\">February 10, 2026</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.7.5 (30439)</td><td>6.7.5 (75246)</td><td>6.7.5 (6891)</td><td>6.7.5 (37428)</td><td>6.7.5 (37429)</td><td>6.7.5 (32502)</td><td>6.7.5 (32503)</td><td>6.7.5 (32504)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\" style=\"width: 100%;\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" style=\"width: 6.59755%;\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" style=\"width: 18.2846%;\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" style=\"width: 67.9548%;\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" style=\"width: 7.2573%;\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th style=\"width: 190.49%;\" colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">Changed feature</td><td style=\"width: 18.2846%;\">Updated public key for signature verification</td><td style=\"width: 67.9548%;\">With this release, Zoom is rotating the key pair used to sign the Zoom desktop app for Linux packages. Users who use signature validation to verify Zoom packages will need to <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0063726\" rel=\"nofollow\">import the new public key</a> to continue validating future releases. Prior versions (before 6.7.5) will not be impacted.</td><td style=\"width: 7.2573%;\">Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Upcoming end of support for macOS 10.13 and 10.14</td><td style=\"width: 67.9548%;\">This is the last planned release to support macOS versions 10.13 and 10.14. With next month&#39;s planned release, macOS users will need to upgrade to macOS 10.15 or higher to continue to receive additional Zoom app updates.</td><td style=\"width: 7.2573%;\">macOS</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">Changed feature</td><td style=\"width: 18.2846%;\">Upcoming end of support for legacy Linux distributions</td><td style=\"width: 67.9548%;\">This is the last planned release to support the following legacy Linux distributions: CentOS 8, Oracle Linux 8, Red Hat 8, Ubuntu 18.04, Fedora 27-31, Debian 10, and OpenSuSE 15. The installer will block installation attempts on unsupported systems and displays an error message identifying the incompatible distribution. Users on these distributions can continue using version 6.7.5 (or any additional patches in the 6.7.X branch), but will not receive further updates. With next month&#39;s planned release, the minimum supported distributions will be Ubuntu 20.04&#43;, Fedora 32&#43;, RHEL 9&#43;/CentOS Stream 9&#43;, Debian 11&#43;, and OpenSuSE 16&#43; with GCC 9.4 or later.</td><td style=\"width: 7.2573%;\">Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Improved macOS status bar icon accessibility and system integration</td><td style=\"width: 67.9548%;\">The Zoom Workplace app status bar icon follows Apple&#39;s Human Interface Guidelines to provide enhanced accessibility support and seamless system integration. The icon supports increased contrast mode, remains visible when transparency reduction is enabled, and works properly with VoiceOver screen reader functionality. Users with accessibility needs or visual impairments can more easily identify and interact with the Zoom status bar icon regardless of their macOS accessibility settings. The icon maintains proper proportions and clarity across different display scale settings while automatically inverting colors when the system setting is enabled.</td><td style=\"width: 7.2573%;\">macOS</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Updated Home tab for mobile app</td><td style=\"width: 67.9548%;\">Users can access a redesigned Home tab that replaces the previous Meetings tab and displays daily meeting information through enhanced event cards. The tab shows upcoming and recurring meetings for a selected day, with visual indicators for meeting status including concluded, in-progress, and future meetings. Meeting cards display essential details such as meeting name, host, start time, duration, location, and participant count for active meetings. Users can navigate between different days to view past or future meetings, access meeting details by tapping cards, and perform secondary actions like joining from a room or copying invitation links. This streamlined interface helps users quickly join their next scheduled meeting or access recurring meetings.<br /><strong>Note</strong>: This feature is available on version 6.6.0 and higher, and will be rolled out to accounts over time.</td><td style=\"width: 7.2573%;\">iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Enhancements to the Contacts tab</td><td style=\"width: 67.9548%;\">\r\n<p>The redesigned <strong>Contacts</strong> tab transforms how you view and manage your contacts, with a simplified navigation and interface, new features, and improved terminology. You can search for contacts and select multiple contacts to initiate engagements like group chats or meetings. When you click a contact, their profile card will open in a right panel, showing their contact information and organization chart. In the left navigation menu, options include <strong>All contacts</strong>, <strong>Starred</strong>, <strong>Contact requests</strong>, and <strong>Groups</strong>. Within the <strong>Groups</strong> section, you may have groupings such as your external contacts, your company directory, Zoom Rooms, and more. For more organization, you can create your own groups of contacts and sync contacts from a connected Google, Exchange, or Office 365 account on Zoom. The new interface provides enhanced functionality while maintaining familiar contact management workflows for improved productivity.</p>\r\n<p><strong>Notes</strong>:</p>\r\n<ul><li>There are no admin settings or toggles to enable or disable this new experience.</li><li>This enhancement was previously released to free customers in December 2025. For paid customers, this enhancement will be available starting with the 6.7.5 release, and will gradually roll out to all remaining paid customers over time, with expected completion in March 2026.</li><li>At this time, users with Zoom Phone Power Pack will retain the current native interface to preserve specialized telephony features and grid view capabilities.</li></ul>\r\n</td><td style=\"width: 7.2573%;\">Windows<br />macOS</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Automatic navigation customization for standalone product subscriptions</td><td style=\"width: 67.9548%;\">Users with standalone product licenses receive an automatic prompt to optimize their navigation tab layout when signing in to the Zoom desktop app. The system presents a one-time dialog asking users to optimize their navigation to highlight key tools available with their plan. In this release, standalone AI Companion paid subscription is supported. The AI Companion profile promotes <strong>Home</strong>, <strong>Calendar</strong>, <strong>Docs</strong>, <strong>Hub</strong>, and <strong>Team Chat</strong> as the primary visible tabs, with others accessible under <strong>More</strong>. Users retain full control to decline optimization or manually adjust tabs later, while admins can suppress optimization prompts at the account or group level.</td><td style=\"width: 7.2573%;\">Windows<br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th style=\"width: 190.49%;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meetings features </a> </span></th></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Support pinning participant&#39;s video in meetings with 1000 or more participants</td><td style=\"width: 67.9548%;\">All meeting participants can pin users when fewer than 1,000 participants are present. When the meeting participant count reaches 1,000 or more, only hosts, co-hosts, and original hosts can pin a participant&#39;s video. When multi-pin is enabled, all meeting participants can multi-pin users when fewer than 500 participants are present, with a maximum of 9 users in total. When the meeting participant count reaches 500 or more, only the host can multi-pin. Previously, pinning a video was not supported in meetings with 1000 or more participants and multi-pinning videos was not supported in meetings with 500 or more participants.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Introducing My notes</td><td style=\"width: 67.9548%;\">\r\n<p><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0083849\" rel=\"nofollow\">My notes</a> is a new feature that replaces the previous Notes functionality with AI-powered capabilities. My notes enables users to take manual notes while AI Companion transcribes Zoom Meetings, in-person meetings, or meetings on other platforms, then expands on and helps organize key takeaways. My notes includes automatic voice activity detection when a potential meeting audio event is accessing the device microphone to deliver a notification to remind the user to start a new note, managed in the Zoom desktop app settings. All notes created with My notes can be accessed in Zoom Hub and Zoom Docs.</p>\r\n<p><strong>Note</strong>: While this feature is generally available, it may not be accessible to all users right away, as it is being rolled out gradually.</p>\r\n</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Introducing the Enhanced Media add-on</td><td style=\"width: 67.9548%;\">\r\n<p>With the <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0084387\" rel=\"nofollow\">Enhanced Media add-on</a>, customers can experience high quality media enhancements ideal for professional collaboration and production environment. In this release, the Enhanced Media add-on includes:</p>\r\n<p>Meetings:</p>\r\n<ul><li>60fps high frame rate participant video streams, valuable for activities that involve smooth movement or requiring a higher degree of visual realism</li><li>Higher bit rate participant video streams for sharper details and improved color reproduction</li><li>1080p content sharing at 60fps, enables a smoother sharing experience while maintaining finer details for professional media review work</li><li>High Bandwidth Mode for multiple simultaneous HD participant video streams in supported applications</li><li>Higher quality participant video streams in gallery view on 4K displays</li></ul>\r\n<p>Zoom Rooms</p>\r\n<ul><li>High Bandwidth Mode for multiple simultaneous HD participant video streams in supported applications</li><li>Higher quality participant video streams in gallery view on 4K displays</li></ul>\r\n<p>Zoom Events</p>\r\n<ul><li>Enhanced media features available for Meetings within Zoom Events</li></ul>\r\n<p><strong>Note</strong>: 60fps high frame rate video, 60fps content sharing, and higher bit rate streams will be available on Zoom Rooms in another upcoming release.</p>\r\n</td><td style=\"width: 7.2573%;\"><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Instantly start a meeting using zoom.new</td><td style=\"width: 67.9548%;\">Users can start a new meeting when they type <strong>zoom.new</strong> in their browser&#39;s address bar. The system detects user sign-in status and redirects unauthenticated users to sign in first. Once signed in, users are then taken to the new meeting instance, either the Workplace app when detected, or via the Web App. After joining, the host will be prompted to invite contacts into the meeting or share the invite link with others.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Full enablement of enhanced join flow for overlapping personal link names</td><td style=\"width: 67.9548%;\">The enhancement to join flow for overlapping personal link names, initially launched last August 2025, is generally available for all customers and regions after being available only by request. <br />With the enhanced join flow, users can join personal meeting rooms more efficiently when multiple users share the same personal link name. When there is no overlap in personal link names, users directly join the personal meeting ID (PMI). If an overlap exists with a user in the same account, they can choose to join that specific PMI or enter a full URL/meeting ID for a different one. For overlapping personal link names outside their account, users can enter either the full URL or meeting ID to join the correct meeting. This improvement helps users avoid joining incorrect meetings while protecting privacy and account information.</td><td style=\"width: 7.2573%;\">Windows <br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Enhancements to post-meeting prompts with AI Companion integration</td><td style=\"width: 67.9548%;\">Meeting participants can access enhanced post-meeting prompts that integrate with AI Companion functionality for improved note management. When users create or edit notes during a meeting, they receive automatic AI Companion responses through compelling call-to-action prompts after the meeting concludes. The feature enables continued note usage directly within the Zoom Workplace app post-meeting.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Enhancements to meeting coach with participant engagement metrics</td><td style=\"width: 67.9548%;\">The enhanced Meeting coach feature provides meeting hosts with participant engagement analytics alongside personal meeting performance metrics. The feature is accessible through a new <strong>Meeting coach</strong> tab on the post-meeting calendar card for improved discoverability, replacing the previous location under Smart recording. Hosts can view participant metrics such as talk time % for all attendees while individual meeting participants can only access their own participation metrics. The feature works with all meetings that have a compatible AI Companion meetings feature activated, such as meeting summary, in-meeting questions, or smart recordings.</td><td style=\"width: 7.2573%;\"><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Dynamic gallery video layout</td><td style=\"width: 67.9548%;\"><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0063672#mcetoc_1jh6bfvke1c\" rel=\"nofollow\"><strong>Dynamic gallery</strong></a> is a user-selectable video layout that automatically crops video tiles to focus on faces and best utilize available screen space.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Copy meeting link option added to new meeting flyout menu</td><td style=\"width: 67.9548%;\">When creating a new meeting from the Zoom desktop app&#39;s <strong>Home</strong> tab, users can click <strong>Copy meeting link</strong>, allowing them to reference meeting URLs immediately after creating a meeting. Previously, the only options were <strong>Copy ID</strong> and <strong>Copy invitation</strong>.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">AI Companion in-meeting user interface enhancements</td><td style=\"width: 67.9548%;\">AI Companion in-meeting interface is redesigned to simplify how features are accessed and managed, improving feature discoverability and usability. The enhancement includes:\r\n<ul><li>AI Companion, My notes, and Transcription are accessible from the top-right corner of the meeting window. Hovering over the icons opens feature status and menus.</li><li>The AI Companion sparkle icon provides role-based experiences, with hosts seeing checkbox controls for meeting summary and questions, with option to start, open, and stop AI Companion. While participants can request features to be enabled.</li><li>The My notes (previously known as Notes) menus for host and participants are unified and accessible when user hovers on the icon. Users can either select <strong>Start taking notes</strong> or <strong>Continue taking notes</strong>, depending on the current status.</li><li>Using the Transcription icon from the top-right corner of the meeting window, host can stop and delete transcripts. Using the same icon, participants can request the host to stop the transcription.</li></ul>\r\n</td><td style=\"width: 7.2573%;\"><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Ability to bookmark in-meeting chat messages</td><td style=\"width: 67.9548%;\">Meeting participants can bookmark in-meeting chat messages. The bookmarked meeting chat messages are accessible in the <strong>Bookmarks</strong> tab of Team Chat alongside other saved messages for centralized reference. Previously, users could only bookmark Team Chat messages.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th style=\"width: 190.49%;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Enhancements to sidebar tab placement and interactions</td><td style=\"width: 67.9548%;\">Several improvements have been made to sidebar tab placement and interactions, giving users more control, improved visibility, and faster ways to manage unread messages.\r\n<ul><li><strong>Enhanced tab reordering</strong>: The <strong>More</strong> menu bottleneck has been removed. Pinned tabs can now be dragged and dropped into any position, allowing for fully customized ordering.</li><li><strong>Multi-row sidebar wrapping</strong>: Pinned items now support multi-row wrapping. Narrowing the sidebar causes pinned tabs to wrap to a new row rather than being hidden in the overflow menu.</li><li><strong>Instant read states</strong>: A <strong>Mark all as read</strong> option has been added to the right-click context menu for all Team Chat sub-tabs, allowing users to clear unread badges instantly.</li><li><strong>Windows contrast optimization</strong>: For Windows users in Dark Mode, bolded chat font colors have been updated to provide higher contrast and improved readability for unread messages.</li></ul>\r\n</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th style=\"width: 190.49%;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Enhancement to viewing private embedded clips</td><td style=\"width: 67.9548%;\">Users can view a private clip directly within an embed without being redirected or leaving the host page. Clip owners will continue to be able to embed private content while allowing only authorized users to view them based on configured sharing permissions. Previously, if a clip is private or requires authentication to view, users must leave the embed and open the full Clips page to view.</td><td style=\"width: 7.2573%;\"><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Enhanced PIN recognition accuracy for avatar creation</td><td style=\"width: 67.9548%;\">Creators can complete PIN verification for custom avatar creation with greater reliability. Creators receive immediate, actionable feedback when verification fails and can retry with one-tap convenience. This enhancement helps creators successfully complete the security verification step for avatar creation by minimizing repeated attempts.</td><td style=\"width: 7.2573%;\"><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Create a clip button in clips picker</td><td style=\"width: 67.9548%;\">Users can record new clips directly from the Clips picker interface through a <strong>Create a Clip</strong> button. This functionality is available in Zoom Team Chat. The <strong>Create a Clip</strong> button opens the standard Clip recorder pop-up. After recording is completed, users return to the picker. Users can create contextually relevant video content without switching between different interfaces.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th style=\"width: 190.49%;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Variable display for transferred calls from Zoom Virtual Assistant</td><td style=\"width: 67.9548%;\">Zoom Phone Power Pack users receive comprehensive variable data when calls are transferred from Zoom Virtual Assistant (ZVA) to improve call efficiency. Users can access conversation summaries and collected variables through incoming call notifications, view the information during live calls for real-time reference, and review the data in their call history after calls conclude. Admins have control over which specific variables and data points are transmitted from ZVA to Zoom Phone users. This feature significantly reduces call handling time by providing immediate access to caller information and authentication details gathered during the automated interaction phase.</td><td style=\"width: 7.2573%;\"><br />Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune) </td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">AI Companion call questions for mobile devices</td><td style=\"width: 67.9548%;\">Users can access AI Companion call questions through a pop-up window on mobile devices when <strong>Call Summary with AI Companion</strong> is enabled. The call question pop-up appears on iOS, iPadOS, and Android clients, matching the existing desktop experience. Users see both the call summary and call questions functionality together in a consistent interface across all platforms. This enhancement ensures mobile users have the same comprehensive AI-powered call features available on desktop clients.</td><td style=\"width: 7.2573%;\">iOS<br />iOS (Intune)<br />Android<br />Android (Intune) </td></tr><tr class=\"table-divider-row\"><th style=\"width: 190.49%;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080489\" rel=\"nofollow\"> Hub features </a> </span></th></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">File shortcuts in Zoom Hub</td><td style=\"width: 67.9548%;\">Users can organize their work by creating file shortcuts in Zoom Hub. The original file remains in its location while the shortcut provides quick access from a centralized place. This feature allows users to build collections of related materials without duplicating content or disrupting existing folder structures.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th style=\"width: 190.49%;\" colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0081420\" rel=\"nofollow\">Video Management features</a> </span></th></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Video embedding for third-party websites</td><td style=\"width: 67.9548%;\">Embedding for individual videos or channels in third-party websites is available using iframe-based embed codes. The sharing options include additional settings for embedding channels, which display as a carousel allowing viewers to watch multiple videos. Embed options support both responsive and fixed sizing with inline or popover display modes. Channel-level player properties determine the available options in the embedded player, and private video settings are enforced within the embed player. This feature enables users to extend their video content reach across multiple websites while maintaining control over player functionality.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Recording embedding in third-party websites with sharing controls</td><td style=\"width: 67.9548%;\">Embedding recordings for individual videos or channels into third-party websites is available using iframe-based embed codes. The sharing modal includes embed options with responsive or fixed sizing, inline or popover display modes, and applies channel-level player properties to embedded content. When channels are embedded, viewers see a carousel interface to watch multiple videos within the embedded player. Private video access controls are enforced within the embedded player to maintain content security. This feature enables broader content distribution while preserving established sharing permissions and player configurations.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Quiz and survey integration for video content creation</td><td style=\"width: 67.9548%;\">Creators can insert existing quizzes, polls, and surveys at specific timestamps within their videos to assess viewer knowledge and engagement. The system allows insertion of interactive elements at various playback times, with videos automatically pausing to display the quiz or survey before continuing. Creators can configure these elements as mandatory or optional, control retake permissions, and insert multiple quizzes throughout a single video with only one allowed per timestamp. Survey placement options include quick selections for common positions like video beginning or end. This integration enables creators to transform passive video content into interactive learning experiences.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Enhancements to playlist management and video organization</td><td style=\"width: 67.9548%;\">Creators and collaborators can edit playlist properties including titles, descriptions, and thumbnails through an enhanced interface. The system provides role-based navigation where playlist cards link creators to management pages and direct viewers to the player. Users can modify individual video properties within playlists, adjusting titles, descriptions, and thumbnails as needed. Drag-and-drop functionality enables quick video organization between channels and playlists. These enhancements provide comprehensive playlist customization tools for improved content management workflows.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th style=\"width: 190.49%;\" colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Start My notes automatically when joining a meeting - AutoStartMyNotes</td><td style=\"width: 67.9548%;\">Disabled by default. When enabled, the Zoom Workplace app will automatically start the My notes feature when a user joins a meeting. If this policy is not set, the app will use the default setting.</td><td style=\"width: 7.2573%;\">Windows <br />macOS</td></tr><tr class=\"table-row\"><td style=\"width: 6.59755%;\">New or enhanced feature</td><td style=\"width: 18.2846%;\">Prevent users from signing in with a magic code - DisableLoginWithMagicCode</td><td style=\"width: 67.9548%;\">Disabled by default. When enabled, users are prevented from signing in to their Zoom account with the one-time magic code option. If this policy is not set, the app will use the default setting.</td><td style=\"width: 7.2573%;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Security enhancements</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved a formatting issue in custom disclaimers for users signing in to the desktop app</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which changing the Active Directory password logged a user out of Zoom for Intune</td><td>Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users were unable to send private chat messages to the meeting host and received an error message</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with Zoom Phone where a monitored agent&#39;s status was showing as <strong>Offline</strong> in the <strong>Monitoring</strong> view while displaying as <strong>Available</strong> in the <strong>Call Queue</strong> view</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where meetings synced from Microsoft Outlook to the mobile app were displaying incorrect dates and times, showing 1970 instead of the actual meeting date</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app would not launch when clicking on a meeting link in the Google Chrome app if the <strong>Desktop site</strong> viewing mode was enabled in the Google Chrome app</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where certain keyboard keys were not working properly during remote support sessions and the <strong>Stop remote support</strong> option was not functioning</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue causing the Zoom Workplace app to crash unexpectedly</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where email messages were not properly updating their read status, remaining marked as unread even after being opened</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved a compatibility issue where Jabra Speak2 75 microphones were not being detected by Zoom after updating to version 6.6.5</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the <strong>Meetings</strong> tab would randomly stop displaying scheduled meetings and required restarting the desktop app to restore functionality</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where meetings were appearing as duplicates in the Zoom Calendar when synced from Outlook, despite only having one entry in the original calendar</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users were experiencing calendar synchronization failures and Active Directory lockouts after updating to Zoom app version 6.4.12</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where keyboard character input was displaying incorrectly during remote screen sharing on Ubuntu when using non-English keyboard layouts</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where stylus cursor movements and hover effects were not being captured in Zoom recordings even though they were visible during the meeting</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where users with CallKit were able to join meetings with device audio despite their settings to use telephony audio only</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the upcoming meeting list was missing meetings for users with scheduling privileges</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue that prevented users from sending emails with large attachments through Zoom Mail</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where removing a single instance of a canceled meeting from the user&#39;s calendar removed the entire meeting series</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where the <strong>Apps</strong> sidebar in the Zoom Workplace (Zoom Phone client) disappeared when resizing the main application window</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The <strong>Enhancements to webinar Q&amp;A</strong> and <strong>Enhancements to the onboarding workflow for AI Companion</strong> were pulled from release due to issues with deployment and will be available in an upcoming release.</p>\r\n<h3 id=\"mcetoc_1jfeq0q905\">January 20, 2026</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>6.7.3 (31676)</td><td>6.7.3 (31677)</td><td>6.7.3 (31678)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</ "width: 45.0209%; height: 15.3993px;\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\" style=\"height: 123.194px;\"><td style=\"width: 41.0177%; height: 123.194px;\">Minor bug fixes</td><td style=\"width: 45.0209%; height: 123.194px;\">Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jcmfrptr5\">December 17, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>6.7.1 (30672)</td><td>6.7.1 (30673)</td><td>6.7.1 (30674)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Resolved an issue where users on version 6.7.0 were being disconnected from meetings shortly after joining, with a &#34;Cannot connect to our service&#34; error message</td><td>iOS <br />iOS (Intune) <br />visionOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jc7e8q8oa\">December 15, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.7.0 (24657)</td><td>6.7.0 (71075)</td><td>6.7.0 (6313)</td><td>6.7.0 (35747)</td><td>6.7.0 (35748)</td><td>6.7.0 (30597)</td><td>6.7.0 (30598)</td><td>6.7.0 (30599)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Passkey authentication for passwordless sign-in</td><td>Users can sign in to Zoom using passkeys, a passwordless authentication method that replaces traditional passwords with cryptographic key pairs. The system prompts users for Face ID, fingerprint, or PIN to create and use passkeys, and supports cloud-based storage through iCloud Keychain, Google Password Manager, Windows Hello, or third-party solutions like 1Password. When devices lack biometric readers but accounts have phone-based passkeys, users can scan a QR code to authenticate using their mobile device. Users can manage multiple passkeys through the web portal, including the ability to rename, remove, and distinguish between different passkeys. This authentication method provides enhanced security and resistance to phishing attacks while eliminating common login issues like forgotten passwords.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Global search icon added to navigation bar across all mobile app tabs</td><td>Users can access global search through the search icon in the navigation bar on all primary tabs of the Zoom Workplace mobile app. The icon replaces the previous pull-down search bar implementation in the Team Chat and Contacts tabs, eliminating the need for users to scroll to the top or perform a pull-down gesture to access search functionality. Global search allows users to search across contacts, messages, chats and channels, meetings, SMS messages, files, docs, and whiteboards from one unified experience. The icon remains visible regardless of scroll position and opens the Global Search screen when tapped. This creates a consistent and discoverable entry point for search across all tabs, improving accessibility and reducing the space previously occupied by persistent search bars.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to the Contacts tab</td><td>\r\n<p>The redesigned <strong>Contacts</strong> experience transforms how you view and manage your contacts, with a simplified navigation and interface, new features, and improved terminology. You can search for contacts and select multiple contacts to initiate engagements like group chats or meetings. When you click a contact, their profile card will open in a right panel, showing their contact information and organization chart. In the left navigation menu, options include <strong>All contacts</strong>, <strong>Starred</strong>, <strong>Contact requests</strong>, and <strong>Groups</strong> . Within the <strong>Groups</strong> section, you may have groupings such as your external contacts, your company directory, Zoom Rooms, and more. For more organization, you can create your own groups of contacts and sync contacts from a connected Google, Exchange, or Office 365 account on Zoom. The new interface provides enhanced functionality while maintaining familiar contact management workflows for improved productivity.</p>\r\n<p><strong>Notes</strong>:</p>\r\n<ul><li>There are no admin settings or toggles to enable or disable this new experience.</li><li>This enhancement will be enabled for free users on Zoom Workplace desktop app version <strong>6.7.0</strong> or higher starting December 21, 2025. This feature will be available to paid customers in a future release.</li><li>At this time, users with Zoom Phone Power Pack will retain the current native interface to preserve specialized telephony features and grid view capabilities.</li></ul>\r\n</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced navigation framework for iPad and Android tablets</td><td>The Zoom Workplace app for iPad and Android tablets has a redesigned navigation experience. The new profile menu, accessible from any tab, consolidates presence information, profile settings, account management, and QR code scanning in one location. The app includes a consistent navigation bar design across all tabs, with easy access to AI Companion and product-specific actions. Users can customize which tabs appear in the main tab bar and <strong>More</strong> menu, with the ability to show up to several tabs simultaneously. These improvements help users navigate more efficiently between different products and features within the app.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Update Zoom legal name in Zoom Workplace certificates </td><td>In November 2024, Zoom announced its legal name change from <strong>Zoom Video Communications, Inc.</strong> to <strong>Zoom Communications, Inc</strong>. and indicated that this change would be reflected in Zoom app code-signing certificates. This update is being rolled out gradually across Zoom Workplace app certificates and began with Linux in version 6.3.10 and iOS in version 6.6.0. With the 6.7.0 release, the updated certificate is enforced for Windows, with macOS planned for a future release. The certificate update ensures compliance with Zoom&#39;s new legal entity name while maintaining security standards across all platforms. </td><td> Windows</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Enhanced navigation framework for desktop app</td><td>The <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064516\" rel=\"nofollow\">Zoom Workplace desktop app navigation menu</a> has moved to a left panel, replacing the horizontal navigation bar at the top of the app. Enhancements include a simpler default state with five visible tabs and eliminates the previous auto-pinning behavior. Users can toggle between collapsed and expanded panel views, customize tab order through an intuitive reorder interface, and access overflow items in the redesigned grid-style <strong>More</strong> tab. Next to the global search bar at the top of the app, a centralized creation option was added that provides one-click access to start meetings, create documents, send messages, make calls, and perform other common tasks without navigating into specific product tabs first. The enhanced interface supports improved cross-product engagement and provides a more intuitive experience for Zoom&#39;s expanding workplace solution portfolio.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>End of support for Zoom Workplace app for Windows 32-bit</td><td>Starting with version 6.7.0, the Zoom Workplace app will <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0079569\" rel=\"nofollow\">no longer support devices running Windows 32-bit</a>. Zoom recommends upgrading all PCs running Windows 32-bit to Windows 64-bit. As this upgrade may take longer than a standard application update, customers are advised to prioritize operating system upgrades ahead of time.</td><td>Windows</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meetings features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support proximity-based room detection</td><td>Users can wirelessly discover and connect nearby Zoom Rooms to their meetings directly from their Zoom Workplace desktop app.The feature uses proximity-based wireless technologies including Bluetooth, ultrasonic signals, and Wi-Fi to detect available rooms in the vicinity. Once detected, users can nudge or invite the room to join their scheduled or ongoing meeting with a simple tap. Account owners and admins can configure which wireless technologies are enabled based on organizational security policies and environmental needs.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Simplified mobile in-meeting experience with redesigned toolbar and visual improvements</td><td>\r\n<p>Users on the Zoom Workplace mobile app can access meeting controls more efficiently through a streamlined interface that addresses previous navigation challenges.</p>\r\n<p>This enhancement includes:</p>\r\n<ul><li>A fixed toolbar with 5 controls visible at the bottom of the meeting window that eliminates the need to horizontally scroll through multiple controls</li><li>A new <strong>More</strong> menu experience for items that are not part of the toolbar <br /><strong>Note</strong>: Several controls have moved to the <strong>More</strong> menu, including Raise hand, Reactions, Record, Share, and Participants.</li><li><strong>End</strong> / <strong>Leave</strong> option moved to meeting controls toolbar for consistency with the desktop and web apps</li><li>Top section of the meeting window displays meeting name and additional icons, such as AI Companion, when enabled</li><li>Simpler way to invite additional participants to the meeting</li><li>Consolidated all real-time status indicators into a single bar to show features enabled for a meeting, such as recording, encryption, and AI Companion</li></ul>\r\n</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Simplified desktop in-meeting experience with enhanced meeting toolbar and controls</td><td>\r\n<p>The meeting toolbar has been simplified to provide a cleaner, consistent, and easier to navigate in-meeting experience.</p>\r\n<p>This enhancement includes:</p>\r\n<ul><li>Simplified default in-meeting toolbar layout with essential features shown</li><li>Improved consistency of toolbar button behaviors and expandable menus</li><li>Consolidated host tools and meeting feature settings into the right panel</li><li>A new <strong>More</strong> experience for features that are not shown on the default toolbar</li><li>Support pin/unpin functionality. Users can pin an item from the <strong>More</strong> menu to the primary toolbar and unpin items from the primary toolbar. <br /><strong>Note</strong>: The most recent Feature used will be automatically pinned to the toolbar</li><li>Updated meeting window left header to show meeting name and a drop-down that provides quick access to meeting information</li><li>The in-meeting chat panel color will match the in-meeting experience, and light mode users can revert to a light in-meeting chat panel from in-meeting <strong>Settings</strong> &gt; <strong>Display &amp; controls</strong> &gt; <strong>Display</strong> &gt; <strong>Dark right panel</strong> (toggle off).</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Pin messages in continuous meeting chats</td><td>Hosts, co-hosts, and meeting invitees can pin important messages in the continuous meeting chat for all participants to view. Pinned messages remain visible throughout the meeting and are automatically shown to participants who join late.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced guidance for QR codes and room codes in Zoom Rooms</td><td>Users see clear contextual messages when prompted to scan QR codes or enter room codes in Zoom Rooms. Account owners and admins can enable or disable this guidance through a toggle switch in the Web portal and customize the contextual wording. This enhancement reduces user confusion and provides a more intuitive meeting room connection experience.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Audio-only fallback for web and Linux users with screen capture protection</td><td>When hosts disable screen capture capabilities for meetings, web and Linux users will automatically transition to an audio-only experience. This transition occurs because web browsers and Linux systems cannot support blocking of shared meeting content from screen capture tools and processes running on the device. The audio-only experience allows these users hear audio from protected meetings while maintaining the security requirements set by the meeting host. Audio only participants are identified in the meeting participant list. This feature must be enabled by Zoom.</td><td>Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080361\" rel=\"nofollow\"> Webinar features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to Simulive attendee experience</td><td>Attendees in Simulive sessions no longer see the &#34;This webinar is live&#34; notification during their viewing experience. The system automatically suppresses this notification across all supported app platforms, including desktop, mobile, and web. All other standard in-session notifications such as chat messages and poll prompts remain unaffected. This enhancement creates a more seamless and consistent experience that aligns with the Simulive premium capability.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Simplified desktop in-webinar experience with enhanced webinar toolbar and controls</td><td>\r\n<p>The webinar toolbar has been simplified to provide a cleaner, consistent, and easier to navigate in-webinar experience.</p>\r\n<p>This enhancement includes:</p>\r\n<ul><li>Simplified default in-webinar toolbar layout with essential features shown</li><li>Improved consistency of toolbar button behaviors and expandable menus</li><li>Addition of <strong>Host tools</strong> which contain the settings that control the in-webinar experience for panelist video and audio defaults, as well as other feature controls.</li><li>A new <strong>More</strong> experience for features that are not shown on the default toolbar</li><li>Support pin/unpin functionality. Users can pin an item from the <strong>More</strong> menu to the primary toolbar and unpin items from the primary tool bar. <br /><strong>Note</strong>: The most recent features used will be automatically pinned to the toolbar</li><li>Updated webinar window left header to show webinar name and a drop-down that provides quick access to webinar information</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Simplified sidebar navigation design for Team Chat on desktop app</td><td>The Zoom desktop app <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0059918\" rel=\"nofollow\">Team Chat tab</a> is receiving an updated sidebar experience designed to reduce visual clutter, improve consistency, and make it easier for users to access key tabs and conversations across platforms.\r\n<ul><li><strong>Chats tab renamed</strong>: The <strong>DMs</strong> tab has been renamed to <strong>Chats</strong> for clearer and more consistent navigation.</li><li><strong>Expanded tab layout</strong>: The sidebar supports up to two rows of tabs, removing the previous five-tab limit and allowing more tools to remain visible.</li><li><strong>Files tab removed</strong>: The <strong>Files</strong> tab has been retired to streamline the interface and emphasize the most frequently used areas.</li><li><strong>Meetings tab improvements</strong>: The <strong>Meetings</strong> tab displays meeting chat names in bold by default instead of showing message counts, with an option to enable message indicators if desired.</li><li><strong>Hot Seat interaction update</strong>: Users can open or close the <strong>Hot Seat</strong> view with a single click, supported by a dedicated <strong>X</strong> control for quick dismissal.</li><li><strong>Color themes retained</strong>: Existing color theme options remain available for users who prefer a personalized interface.</li><li><strong>Updated section icons and spacing</strong>: Section icons for folders have been replaced with chevrons, and vertical spacing between channels and chats has been adjusted to reduce visual noise and improve separation between items.</li></ul>\r\nThis update provides a cleaner, more intuitive navigation experience and improves feature discoverability across the app.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Show meeting card in Resources tab for DMs and continuous meeting chats</td><td>Users can access meeting cards through the Resources tab in both direct messages (DMs) and continuous meeting chats (CMCs). The meeting cards display all meeting-related content sent within the respective conversation using the existing card interface design. This enhancement ensures consistent access to meeting information across all Zoom Team Chat conversation types, providing the same experience already available in channels and group chats.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Redesigned Activity Center interface with improved user experience</td><td>Users can access an updated Activity Center on desktop that offers a clearer, more organized view of their notifications. The redesigned layout helps users to cut through the noise by leveraging a <strong>Focus</strong> view with the most important notifications and <strong>Others</strong> for lower priority notifications. The design is more intuitive with features to sort by notification type or product in Workplace. In addition, the system has redefined the way it groups notifications related to the same chat conversation.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Recognize Zoom-native product links in pinned chat tabs</td><td>Users can pin Zoom native links, such as chats, channels, clips, recordings, and surveys to chat tabs, and these links display with the correct icons and titles. When opened, the pinned tab takes users directly to the native product experience instead of showing a generic link view. This update improves clarity, reduces confusion, and creates a more consistent experience across Zoom native content.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Global search includes Zoom Phone call logs</td><td>Users can search for Zoom Phone call logs through the global search functionality. This enhancement allows users to search for specific phone calls by date, contact name, phone number, or partial number such as area code. Users no longer need to manually browse through their phone history to locate past calls. The integration provides users with a unified search experience across all communication channels.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Expanded support for saving one-on-one side chats</td><td>One-on-one side chats that occur within a larger meeting are saved to a direct message (DM), even if the meeting is not using continuous meeting chat (CMC). Previously, this was only supported in CMC-enabled meetings. The system checks whether both participants in the side chat have CMC enabled, rather than relying on the host&#39;s settings, ensuring consistent saving of one-on-one side chats across all meeting types.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Disable Advanced Chat Encryption for free accounts</td><td>\r\n<p>Accounts with Advanced Chat Encryption (ACE) enabled that downgrade from a paid plan to a free plan will automatically have ACE disabled. This change applies to existing free accounts that previously retained ACE after downgrading, as well as future downgrades. Messages previously sent with ACE will remain encrypted using that method, while newly sent messages will use Zoom&#39;s default encryption.</p>\r\n<p><strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend release, currently scheduled for December 21, 2025.</p>\r\n</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Consistent display of meeting details in continuous meeting chat channels</td><td>Users in continuous meeting chat (CMC) channels can consistently view meeting details through a permanently visible hyperlink. Previously, this hyperlink would disappear when meetings became outdated, creating an inconsistent chat experience. The meeting details hyperlink activates a calendar detail page that accommodates various meeting scenarios including one-time meetings, recurring meetings in different phases, and expired meetings. This consistent interface design removes hidden logic and provides predictable access to meeting information across all meeting states.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Comprehensive email search capabilities in global search</td><td>Users can search emails through global search on the mobile app, bringing feature parity with the desktop experience. The update adds full email search capabilities with the same filters for sender, recipients, dates, and attachments. This closes the gap between desktop and mobile search, offering a unified experience across platforms.</td><td>macOS <br />iOS<br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Align group chats with direct messages</td><td>Group chats will function more like direct messages than channels. Group chats no longer have owners, cannot be deleted, allow any internal user to remove participants, and do not include settings. This change streamlines the chat experience by making group chats simpler and more intuitive for direct communication.</td><td>Windows <br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Add external users to continuous meeting chat through post-meeting approval card</td><td>When settings permit, external attendees of CMC-enabled meetings are included in the post-meeting approval card sent to the CMC owner, providing one-click addition functionality. Previously, continuous meeting chat (CMC) owners received a post-meeting approval card that allowed them to add only internal meeting attendees to the CMC. This update transforms the previously manual process into a seamless, one-click workflow.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Add actions/settings to CMCs to align with channels</td><td>Users can benefit from improved continuous meeting chat (CMC) functionality, making CMCs more consistent with channels. The enhancements include:\r\n<ul><li>Initiate instant meetings directly from CMCs</li><li>Assign CMC admins</li><li>Customize CMCs with editable description field</li><li>Join CMC through invite link and QR code</li><li>Create mention groups</li><li>Create email address for CMC</li><li>Add CMCs to Shared Spaces</li><li>Configure the following settings:\r\n<ul><li>Who can add members</li><li>Who can use &#64; all</li></ul>\r\n</li></ul>\r\nThese updates give users more control over permissions, memberships, and content, providing a smoother and more efficient collaboration experience.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support filters while recording clips on mobile devices</td><td>Users on mobile devices can apply filters when recording clips. The filters provide the same functionality available on desktop applications, enabling users to enhance their video quality during recording. Users can select from various filter options helping them maintain a professional look regardless of their recording environment.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support cartoon avatar on mobile devices</td><td>Mobile users can record Zoom Clips using cartoon avatars. They can select from the same avatar presets available on desktop and preview their chosen avatar before recording begins. Recorded clips save and play back with the selected cartoon avatar, maintaining visual consistency across playback sessions.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Persistent clip recorder window positioning</td><td>Users can reposition the Zoom Clips recorder window during recording sessions, and the system automatically remembers this position for future recordings. The system stores the current window position and restores it when users initiate subsequent recordings. Users can freely adjust the recorder window placement during active recording sessions without losing their preferred positioning. This feature reduces repetitive manual adjustments and offers a more efficient multi-recording workflow experience.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Mobile playlist sharing support for clips</td><td>Users can access Zoom Clips playlists on mobile devices. When mobile users open a playlist link, they automatically jump to the first playable clip. The playlist viewer offers mobile-optimized playback controls and navigation features, allowing users to automatically play the next available clip in the playlist sequence. This feature extends playlist functionality to users who were previously unable to access shared playlists on mobile devices.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Manual pause insertion for avatar scripts</td><td>To give control over avatar speech timing and pacing, users can insert manual pauses ranging from 1 to 5 seconds at specific points within their avatar scripts. The feature allows pause placement after periods or at the beginning of scripts, with the user interface providing duration selection controls. During video playback, avatars remain idle during pause periods, while the script editor displays visual indicators showing where pauses are positioned.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Speech-to-text captions for Push to Talk</td><td>Users can enable speech-to-text captions on their mobile clients to read Push to Talk (PTT) audio messages as translated text, providing accessibility support for users with hearing challenges or in noisy environments. Account owners and admins control the availability of this feature through admin settings, with the option disabled by default for all channel members, including users and Common Area devices. English-only captioning is available at this time. This feature ensures inclusive communication across PTT channels and enhances productivity for all team members regardless of audio limitations.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>SMS forwarding to email notifications</td><td>Users can receive email notifications when someone sends them an SMS message through Zoom Phone. SMS email notifications include the message content and digest emails with all SMS content after a specified number of hours, complete with deeplinks to the <strong>SMS</strong> tab in the Zoom Workplace app. Users also receive individual email notifications for each unread SMS after a configured number of minutes, with deeplinks to the specific SMS conversation. Additionally, admins can apply policies to <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0069635#mcetoc_1idnmf5av134\" rel=\"nofollow\">redact personal and sensitive data</a> and <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0069635#mcetoc_1jchfutk87\" rel=\"nofollow\">disable hyperlinks</a> in forwarded emails. This enhancement enables better SMS tracking and helps users maintain visibility into their text communications even when away from the Zoom Phone interface.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Remote call merging capabilities for Poly Edge-E IP phones via desktop client</td><td>Users can merge multiple call legs into a single multi-party call when using remote control for their assigned Poly Edge-E IP phones through the Zoom Workplace desktop app. When two individual calls have been established, users can select the <strong>Call Merge</strong> button to combine them into one conference call. The roster of participants in the multi-party call displays directly in the desktop app interface, allowing users to monitor all connected parties. This enhancement eliminates the need to manually perform the join function on the physical IP phone, providing seamless call management from the desktop.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improved auto receptionist management and call routing flexibility</td><td>Account owners and admins can access comprehensive auto receptionist improvements that enhance call routing capabilities and system usability. The feature provides consistent configuration options across all DTMF key presses (0-9, *, #) with new menu navigation choices including message playback with disconnect, menu repetition, and multi-level menu navigation controls. Admins gain the ability to route calls to external contacts during timeout scenarios and can disable extension dialing to maintain tighter call control. Voice-enabled Interactive Voice Response (IVR) systems support extended audio prompt repetition up to 5 times, while new description fields help organize and identify auto receptionist configurations. These improvements significantly enhance customer satisfaction by simplifying the onboarding process for main number deployments.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Expanded language support across multiple features</td><td>Admins and users can access expanded language options for Zoom Phone&#39;s transcription and voice processing features, supporting global communication needs more effectively. The update adds support for 13 new languages across key functionalities, including voicemail transcription, live transcription during calls, AI-powered voicemail intent recognition and task extraction, and TTS services throughout the platform. Users can configure these language preferences to match their specific regional requirements and customer demographics. The new languages include Chinese (Cantonese), Czech, Estonian, Finnish, Hebrew, Catalan, Greek, Hungarian, Malay, Persian, Tagalog, Thai, and Ukrainian. This enhancement enables more accurate transcriptions and better user experiences for international Zoom Phone deployments.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Enhancements to Zoom Phone AI Companion features</td><td>The call questions and call summary features have been merged into a single toggle for easier management. Users will receive active in-call prompts that support catch-up summaries, decision tracking, and action item identification. When features are not enabled, clear call-to-action buttons allow users to request that an admin enable AI Companion call summaries and voicemail prioritization. These updates streamline AI feature management and enhance engagement with the intelligent phone workflow.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to in-screen call controls for CRM disposition workflow</td><td>Users of CRM integrations with Zoom Phone can access essential call controls directly within the notes and disposition screens. The enhanced interface embeds call controls seamlessly within the notes and disposition screens, eliminating the need to switch between different screens during active calls. The unified design implements a consistent control panel across all Zoom-built phone integrations, featuring essential functions such as mute, record, hold, and end call capabilities.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced transmission reporting and workflow improvements for Online Fax</td><td>The system provides detailed transmission reports that clearly document any retry attempts and page-specific delivery status. Users can add follow-up notes to faxes, with sharing permissions that vary based on whether the fax is shared between users or sent individually. Additional improvements include consolidated upload and confirmation dialogs, and enhanced country-based outbound restrictions for native numbers. These enhancements streamline the fax workflow and reduce transmission failures.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Andro

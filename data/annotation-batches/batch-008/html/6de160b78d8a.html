tiple windows. When users look at other participants, their Persona maintains proper eye contact alignment, creating a more natural interaction experience. This enhancement leverages Apple&#39;s latest cameraAnchor API for visionOS to deliver more engaging and realistic virtual interactions.</td><td>visionOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Preview Microsoft Office files directly in Team Chat</td><td>Users can preview Microsoft Office 365 files (Word, PowerPoint, and Excel), directly within Zoom Team Chat. Instead of downloading files to view them, simply click on the shared document to open a preview right in the chat window. This makes it faster and easier to review content without leaving the conversation. Supported file types:\r\n<ul><li>Word (.doc,.docx)</li><li>PowerPoint (.ppt,.pptx)</li><li>Excel (.xls,.xlsx)</li></ul>\r\nThis feature helps users stay focused and collaborate more efficiently, all within Team Chat.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to global search navigation on desktop app</td><td>Users can navigate back and forth between search results and other pages within Team Chat using browser-style navigation buttons. The search activity is included in the user&#39;s browsing history, allowing users to return to previous search results without initiating a new search. When reviewing search results, users can click through to specific messages, channels, or meetings, and easily return to the search results page to continue exploring other matches. This improved navigation helps users maintain their workflow while searching through content across Team Chat.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to feedback features in AI Companion</td><td>Users can provide feedback on AI-generated content through an integrated thumbs up/down system across various Zoom AI Companion features. The feedback system is available for chat thread summaries, unread channel summaries, document summaries, and compose features. Users can indicate their satisfaction with the AI-generated content using consistent feedback controls that align with the AI Companion side panel experience. This unified feedback system helps improve the quality and relevance of AI-generated content.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to document summaries in chat</td><td>Team Chat has expanded its summarization capabilities to include shared Zoom Docs links. When a Zoom Docs link is shared, it unfurls into a file card. Users can click the summary icon on the card to generate a quick overview of the document. This enhancement makes it easier to understand the document at a glance without leaving the conversation or opening the full file, helping users save time and stay in the flow of the conversation.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Create direct message, group chat or channel from the &#34;New Message&#34; button</td><td>The message creation experience has been improved. Users can create a direct message, group chat, or channel directly from the <strong>New Message</strong> (plus) button (Command &#43; N), streamlining the process and making it more flexible. This update also introduces a clearer distinction between group chats and channels, as group chats will no longer have topics. If you want to name the conversation, simply create a channel. With this update, the channel creation process has also been simplified, requiring fewer steps to set up.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Audio messaging enhancements in the mobile app</td><td>Users can more easily record and send voice messages using streamlined touch controls. By pressing and holding, they can quickly capture a message, which is sent automatically upon release. Sliding up cancels the recording, and users also have the option to preview messages before sending. The updated interface includes playback controls allowing users to review the audio message. These enhancements simplify the voice messaging process by minimizing steps and improving usability.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>&#34;Customize sidebar look&#34; setting relocated to General settings in desktop app</td><td>The <strong>Customize sidebar look</strong> setting is located in the General section of the Zoom desktop app, instead of the Team Chat settings. This setting lets users switch the sidebar appearance between light and dark contrast modes. It complements the overall theme selection and is specifically effective when using light mode. Relocating the setting to the General tab provides a more intuitive experience, allowing users to manage all visual preferences in one convenient location.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Auto-play toggle for playlist continuous playback</td><td>Users can enable or disable the <strong>Autoplay next clip</strong> toggle from the Web portal or the Zoom Workplace app. If enabled, the next clip in a playlist automatically plays when the current clip ends without any manual user intervention.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to track guest user access to clips</td><td>Users sharing Zoom Clips can track who accesses their content by requiring email information from guest viewers. When enabled, guest users are prompted to enter their email address before they can watch a clip. Admins can configure the <strong> Require guests must register their email before they can view the clip </strong> setting at the account and group level, under the <strong>Clips</strong> tab &gt; <strong>Sharing</strong> section. If allowed within the account and not locked under the account or group levels, users can control this setting for their personal use under <strong>Settings</strong> &gt; <strong>Clips</strong> tab &gt; <strong>Sharing</strong> section or per individual clips.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support for additional Push to Talk devices</td><td>Users can utilize Push to Talk functionality on Zebra, Grandstream WP856, Samsung Galaxy XCover6 Pro, and Kyocera E7110t devices. The feature maps dedicated hardware buttons on these devices to activate the Push to Talk function. Users can access Push to Talk channels through these physical buttons, just as they can with other supported devices. This expansion of hardware support provides more device options for organizations implementing push-to-talk solutions.</td><td>iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Shared device management with role-based profile selection</td><td>Account owners and admins can enable role-based profiles for frontline workers using shared devices. Admins can configure common area profiles per site, with each profile representing specific job roles, such as bakery, produce, or flooring departments, using the Department field. The profiles can be equipped with different features and licenses, including calling plans, push-to-talk, and call queues. Users can quickly select their assigned job department from available options on the shared device without requiring personal login credentials. The solution leverages and builds upon the common area profiles for smartphone features.</td><td>iOS<br />Android</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>SMS failure tracking and retry option</td><td>Agents and supervisors can view SMS delivery failure statuses and reasons directly within the Zoom Workplace desktop app, Zoom Web App, and CTI interfaces. When an SMS fails to deliver, the system displays the failure status along with the specific reason, and logs the event in transcripts and engagement logs. A new engagement event also tracks SMS delivery failures. To help ensure important messages reach consumers, agents and supervisors can retry sending failed SMS messages. The original failed message remains visible for reference, and a retry option allows agents to resend the exact same message content.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Seamless video escalation for Zoom Phone users in Zoom Contact Center</td><td>Consumers on a Zoom Phone call with a Zoom Contact Center agent can switch to a video call instantly. There is no need for email links or extra downloads. Joining is as simple as clicking the upgrade-to-video invite from the Zoom Contact Center agent. Once connected, consumers have access to all standard Zoom Contact Center video features, including mute, video controls, chat, screen sharing, and remote control, enabling faster collaboration and support. This feature must be enabled by Zoom.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>File sharing in Zoom Team Chat</td><td>Users engaging with IT helpdesks through Zoom Team Chat can transfer local files to support agents. The file sharing icon becomes visible once a live agent takes over the engagement, allowing users to upload files directly within the chat window. File size and type restrictions follow the same guidelines as web chat channel, and admins can configure additional file type restrictions in Zoom Contact Center preferences. This feature enables faster issue resolution by allowing direct file sharing between users and support agents.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to knowledge base search with AI-generated answers</td><td>Agents using the AI Expert Assist feature can see AI-generated answers displayed as the first result when searching the knowledge base. This enhancement helps agents find relevant information more quickly and efficiently when assisting customers.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />Android <br />Zoom Phone Appliances</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Engagement status for virtual agent interactions</td><td>Supervisors can view when engagements are actively being handled by virtual agents in the <strong>Open Engagements</strong> tab and CX Analytics engagement list. The system displays <strong>Virtual Agent</strong> status for these engagements, distinguishing them from regular flow engagements. The engagement status timer resets when an engagement transitions to or from a virtual agent. This enhancement helps supervisors better monitor and understand the consumer journey during virtual agent interactions.</td><td><br /><br />Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">Custom AI Companion features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to debugging interface with agent chain of thought (CoT) summaries</td><td>Agent developers can access a summary of the agent&#39;s chain of thought (CoT) reasoning in the debugging panel, allowing developers to quickly understand the agent&#39;s decision-making process. The system automatically generates a 2-3 sentence overview that captures the key points of the agent&#39;s output. Additionally, developers can view a step-by-step summary of each step the agent took during the decision-making process, allowing agent behavior to be analyzed at different levels of detail. Agent developers and admins can leverage this tool to help them debug the agent more effectively before deploying to end users.</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where a URL in the custom disclaimer on the Zoom desktop app was shown but could not be clicked</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue with the emoji selection failing to display when clicked from the text box in Team Chat</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue with navigation and <strong>Settings</strong> formatting in the Zoom desktop app</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue with the calendar and contacts integration in which users saw a &#34;calendar isn&#39;t connected&#34; message on the <strong>Home</strong> tab even though their events still appeared in the <strong>Calendar</strong> tab</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue on Fedora 42 with Xorg in which double-clicking shared content did not switch to full screen during screen sharing</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue for a subset of users in which meetings disappeared from the <strong>Meetings</strong> tab after several refreshes</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which some users attending external meetings were directed to an external SSO sign-in that blocked them from using their organization credentials to join the meeting or sign in to the desktop app</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue for a subset of users receiving meeting start notifications for declined meetings</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which instant meetings and no fixed time meetings incorrectly showed meeting duration in the <strong>Meeting info</strong> tab during a live meeting</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the audio in Zoom meetings occasionally became distorted when other participants were speaking</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which Team Chat sidebar folders like Starred, Chats, and Channels did not remain open after restarting the app, even when <strong>Open multiple sections simultaneously</strong> was enabled</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue in which adding a personal contact on the Zoom mobile app showed a &#34;network error&#34; message and created a duplicate contact</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the Zoom mobile app crashed when dialing a number starting with &#34;0&#34;</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which specific Zoom desktop app versions could not run on Windows Server 2016 and showed an &#34;Entry Point Not Found&#34; error</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the red dot notification on the <strong>Phone</strong> tab was unexpectedly appearing</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which Zoom for Intune on Android using EnforceMicrosoftLogin failed to work as expected</td><td>Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which enabling the Android policy flag mandatory:choice:DisableLoginWithMicrosoft caused an error when logging in</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which meeting hosts received an inaccurate meeting capacity pop-up due to the account they were signed in to</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue on the Avaya integration regarding continuous ringing after a user accepts the call on another device or the caller cancels the call</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The following features have been pulled from release due to issues with deployment and will be available in an upcoming release.</p>\r\n<ul><li><strong>Support for blur in screenshot and annotation tool</strong> (Team Chat)</li><li><strong>Web-based scheduling experience on mobile Home tab</strong> (Meetings)</li><li><strong>Enhancements to agent status management</strong> (Contact Center)</li><li><strong>Global search enhancements on mobile app</strong> (General)</li></ul>\r\n<h3 id=\"mcetoc_1j24vqc8v5\">August 11, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.5.9 (11873)</td><td>6.5.9 (61929)</td><td>6.5.9 (3723)</td><td>6.5.9 (32398)</td><td>6.5.9 (32399)</td><td>6.5.9 (27161)</td><td>6.5.9 (27162)</td><td>6.5.9 (27163)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Security enhancements</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an in issue where the Activity Center does not load successfully</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j238fgr829\">August 5, 2025</h3>\r\n<p><strong>Note</strong>: There is no new Zoom Workplace App version associated with this release.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080737\" rel=\"nofollow\">Introducing Zoom Hub</a></td><td>\r\n<p>Zoom Hub provides a centralized file management feature to access and manage your Zoom assets—including recordings, meeting summaries, docs, whiteboards, and clips. With an intuitive interface, you can easily find and organize meeting assets, and create docs, data tables, whiteboards, and clips with help from AI Companion. Use shared folders to collaborate on docs creation, editing, and sharing across teams. Zoom Hub is available on Zoom Workplace desktop app version 6.5.5 or higher.</p>\r\n<p>Additionally, you can refer to the <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080489\" rel=\"nofollow\">Release notes for Zoom Hub</a>.</p>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j1bjagci5\">August 4, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>6.5.8 (3527)</td><td>6.5.8 (32194)</td><td>6.5.8 (32195)</td><td>6.5.8 (26968)</td><td>6.5.8 (26969)</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take ive app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom Workplace app incorrectly recognized an organization&#39;s external join meeting link as a Zoom meeting</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j0mp8nv65\">July 17, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.5.6 (9328)</td><td>6.5.6 (60177)</td><td>6.5.6 (3161)</td><td>6.5.6 (31751)</td><td>6.5.6 (31752)</td><td>6.5.6 (26537)</td><td>6.5.6 (26538)</td><td>6.5.6 (26539)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j04oukfd3v\">July 14, 2025</h3>\r\n<p><strong>Note</strong>: The Zoom Workplace app release for Android and Android (Intune) has been delayed 1 day.</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.5.5 (8927)</td><td>6.5.5 (59968)</td><td>6.5.5 (3045)</td><td>6.5.5 (31672)</td><td>6.5.5 (31673)</td><td>6.5.5 (26472)</td><td>6.5.5 (26473)</td><td>6.5.5 (26474)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support keyboard shortcuts for AI Companion and Calendar side panel</td><td>\r\n<p>New keyboard shortcuts will be added to the Zoom Workplace desktop app to improve navigation and usage for AI Companion and Calendar side panel. New keyboard shortcut scope for this release are as follows:</p>\r\n<p>Show/hide AI Companion side panel:</p>\r\n<ul><li>Mac: Command(⌘)&#43;Shift&#43;O</li><li>Win: CTRL&#43;SHIFT&#43;O</li><li>Linux: CTRL&#43;SHIFT&#43;O</li></ul>\r\n<p><strong>Note</strong>: This applies to whichever window is currently active, whether it is the Zoom Workplace app&#39;s main window or the in-meeting window.</p>\r\n<p>Show/hide Calendar side panel:</p>\r\n<ul><li>Mac: Command(⌘)&#43;Shift&#43;J</li><li>Win: CTRL&#43;SHIFT&#43;J</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support Calendar panel when on half-panel display mode</td><td>The half-panel display mode in the Zoom desktop app is enhanced to also support the Calendar panel. Users can access AI Companion and Calendar simultaneously when not in a meeting.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Initial release of Zoom Workplace for Meta Quest devices</td><td>Users can install and access Zoom Workplace from the Meta Horizon Store on Meta Quest AR/VR headsets. The app supports multiple sign-in methods, including username and password, social login options, and SSO. It allows users to start, join, and schedule meetings, manage Team Chat conversations, and use available AI Companion features within a virtual reality interface. The meeting experience includes options to view shared content, share screens, and participate using Meta avatars, while retaining key Zoom meeting controls. This platform provides Meta Quest users with access to Zoom features in a virtual and mixed reality setting.</td><td>Meta Horizon OS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to app update experience with auto-update enrollment</td><td>Users can manage their Zoom Workplace app updates more effectively through an improved update interface. The system displays prominent notifications highlighting required updates. Users can choose to enroll in automatic updates to ensure their app stays current without manual intervention. A simplified update process helps ensure users have access to the latest features and security improvements while minimizing disruption to their workflow.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improved contact search results with AI Companion</td><td>Users can access additional identifying information when searching for contacts using &#64; mentions or &#34;/&#34; filters in the AI Companion panel. The search results display profile pictures, full names, and job titles for each contact. A contact card appears when hovering over search results, providing more detailed information about the contact. The enhanced search functionality is available for Online, Pro, and Enterprise license types on the Zoom desktop app and Zoom web app.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to &#64;mention in AI Companion panel for mobile</td><td>Users can now &#64;mention team members directly within the AI Companion panel on the mobile app. When typing &#34;&#64;&#34; in the panel, a searchable drop-down list appears, showing available contacts with their display names and email addresses. The list updates in real-time as users type. The feature follows the same familiar behavior found in Team Chat and Docs, making it easier to reference and notify team members while using AI features.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meeting features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support for personalized audio isolation on iPads</td><td>Personalized audio isolation mode is available on iPad devices. Personalized audio isolation enhances the meeting experience by enabling clear conversations even in loud environments with background talkers. Users can enable or disable this mode from the <strong>Audio</strong> section in their Zoom mobile app settings. Users need to record a voice print to use personalized audio isolation on mobile including iPad.</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Host controls for managing participant speaking languages and translations</td><td>Meeting hosts can adjust the speaking language settings for any individual participant when any participant in the meeting has <strong>Translations</strong> enabled. When <strong>Translations</strong> is active, participants retain their own speaking language settings, which can sometimes conflict with default caption language updates. The host can access this control through the participant list drop-down menu, allowing them to modify language settings in main meeting rooms. This feature helps hosts resolve situations where transcriptions become inaccurate due to mismatched language settings, improving the overall translation and captioning experience for all participants.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Expanded language support for voice recorder with multi-language detection and transcription</td><td>Users can access voice recorder functionality across different languages. The feature automatically detects the speaking language during recording and allows users to switch languages if the detected language differs from the configured setting. Transcripts and summaries are generated in the primarily spoken language, even if initially configured differently. Supported languages for this release include English, French, Italian, Chinese, Arabic, Spanish and Indonesian.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to screen share presenter layouts</td><td>Users can access screen share presenter layouts through an improved interface in the Share modal. The updated Share modal features clearer layout options to help users apply a presenter layout to any type of screen share. The presenter toolbar has a new layout button and modal to help presenters adjust or add a presenter layout to an existing screen share. The three-dot menu for each share tab in the meeting window provides an additional way to manage layouts during active sharing sessions. These improvements make it easier for users to enhance their presentations with professional-looking layouts when they start a screen share or while presenting. <br /><strong>Note</strong>: The ability to adjust the presenter layout from the screen share preview image on the presenter toolbar has been removed, and the updated presenter layout feature in the Share modal cannot be hidden.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to custom AI Companion consent notices on mobile devices</td><td>Participants on the mobile app can view and respond to AI Companion consent notices during meetings. When a host requires consent, participants must acknowledge the notice before they can use their microphone and camera. Participants who do not provide consent can remain in the meeting with their audio muted and camera off. The notice includes a dismiss option that allows users to dismiss the consent notice and remain in the meeting with their audio and camera off. This enhancement provides a consistent consent experience across desktop and mobile platforms.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to Smart Recording with AI Companion transcript availability for playback</td><td>Users can access Smart Recording with AI Companion features including highlights, summary, smart chapters, next steps, and meeting coach without requiring a meeting transcript to be displayed with the cloud recording on the playback page. The AI features remain functional and accessible independently of the transcript availability, improving the flexibility and usability of AI-powered meeting features.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to audio settings in meetings</td><td>Users can access and modify microphone modes more efficiently before or during a meeting through an improved audio menu. The redesigned interface provides quick access to microphone modes: Noise removal, Personalized audio isolation, and Original sound for musicians. This streamlined approach helps ensure optimal audio quality throughout meetings.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to meeting summary sharing with link access permissions</td><td>Users can share meeting summaries using link access permissions, similar to how recordings and Zoom Docs are shared. The unified sharing system ensures that permission changes made through any entry point, such as Calendar, web portal, or meeting summaries, are automatically synced. Link access for meeting summaries enables users to share content more efficiently with a wider audience while maintaining control over access permissions.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to gallery view for 3-5 person meetings on mobile</td><td>Meeting participants on the mobile app can experience an improved gallery view layout that better utilizes available screen space in meetings with 3-5 participants. The new design displays equally-sized video tiles that are larger compared to the previous layout, moving away from the traditional speaker view format where one participant appears larger than others. The toolbar&#39;s behavior adapts based on display settings, maintaining separation from video tiles in always-on mode or allowing overlay in fade mode. This enhancement delivers a more balanced and visually appealing gallery view.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Allow in-meeting questions with AI Companion to be archived</td><td>For accounts with <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068489\" rel=\"nofollow\"> Meeting Archiving </a> and <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0057749\" rel=\"nofollow\"> meeting questions with AI Companion </a> enabled, account owners and admins can include in-meeting questions with AI Companion to be archived. Archiving includes hero prompts, user queries, responses, and interaction feedback like thumbs up/down generated by internal regulated users. An archival notification disclaimer appears to inform users when their conversations are being archived.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Unread filter on the Mentions page</td><td>Users can filter their mentions page to show only unread messages on desktop app. The unread filter toggle helps users quickly identify and respond to new mentions without scrolling through previously read messages. Unread mentions remain visible in the filtered view until they are marked as read. This feature helps users prioritize and manage their communication more effectively.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Search deactivated users in global search</td><td>Deactivated users are now included in global search results under <strong>Contacts</strong>, making it easier to retrieve past conversations. Previously, users couldn&#39;t find deactivated contacts or their 1:1 chats since these entries would disappear from the sidebar after a period of inactivity. This update enhances the search experience by allowing users to quickly locate deactivated contacts and access their chat history directly through global search.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Restrict specific users from chatting with external participants in group chats and channels</td><td>Account owners and admins can prevent specific users from participating in group chats and channels that include external users. By creating a designated user group, admins can define which users should be restricted from chat collaboration with external participants. When this restriction is enabled, affected users cannot be added to group chats or channels that include external participants, nor can external participants be added to group chats or channels the restricted users are already part of. Restricted users also cannot create group chats or channels with external users. The system displays warning messages when attempting to add restricted users to chats with external participants. This feature helps organizations meet compliance requirements while still allowing selective external collaboration.</td><td><br /><br />Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Redesigned group direct message icon on desktop app</td><td>Users will see a redesigned icon for group direct messages on the desktop app, which includes profile pictures. This update makes group conversations feel more personal and helps users more easily distinguish between different types of chats.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Pop-up guide to self-enabling chat summary features</td><td>Some users have always had the ability to turn on chat summaries but didn&#39;t know where or how. Team Chat now highlights entry points where chat summaries can be helpful, such as in documents or new channel messages. These entry points appear only if the chat summary feature is turned off but has been unlocked by your admin. When clicked, a quick pop-up explains the feature, allowing users to enable it with one click or hide the entry points. This empowers users to take control of the features available to them with less friction.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Pin a Zoom Doc shared folder to chat tabs</td><td>Users can now pin shared Zoom Doc folders directly to chat tabs, providing quick access to multiple files in one centralized location. The pinned folder appears as its own tab, showing all documents inside and updating in real time as files are added or removed. When a folder is pinned, appropriate access permissions are automatically granted to all chat members for the folder&#39;s contents. System messages inform participants whenever folders are pinned or unpinned from chat tabs. This feature helps teams efficiently organize and access related documents without leaving the chat, eliminating the need to search for or pin individual files.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Personalize channel names with emoji icons on desktop app</td><td>Channel owners and admins can customize channel icons by adding an emoji, either during channel creation or later by editing the channel settings. Channels without an emoji will default to the # icon and will be labeled as &#34;public&#34; or &#34;private&#34; on all relevant screens. Public channels will also be marked accordingly in the channel header. This enhancement helps users quickly identify and navigate to the right channel, simplifies icon visuals, improves overall workspace organization, and adds a touch of personalization and fun!</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Links section in Team Chat Resources tab</td><td>A new <strong>Links</strong> section is now available in the <strong>Resources</strong> tab, providing users with a centralized place to view and manage all links shared in Zoom Team Chat conversations. This section automatically collects shared links and organizes them with key metadata, including the title, URL, and description, for easy reference. Each link entry includes quick actions such as copy, bookmark, or pin. Users can also jump directly to the original chat message where the link was shared. The Links section streamlines access to important resources, helping teams stay organized and collaborate more efficiently. <strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend release, currently scheduled for August 3, 2025.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Global search enhancements on mobile app (Android only)</td><td>Users can access global search functionality on the mobile app (Android only), with support for all existing desktop search tabs, including top results, messages, meetings, files, and more. The updated search interface allows users to sort results by most recent and most relevant, while maintaining all desktop filtering capabilities. Users can toggle between new and legacy search experiences, with the new search enabled by default. This enhancement improves the search experience by bringing desktop search capabilities to mobile users.</td><td>Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>External contacts support for Zoom Phone calls and voice mail notifications</td><td>Users can now view Zoom Phone call and voicemail notifications directly within their 1:1 chats with external contacts. When receiving or making voice calls, the system displays call notifications showing whether calls were accepted, declined, missed, or outgoing. Users can play back voicemails, read transcripts, and copy transcript content as needed. The synchronized notification badges between Zoom Team Chat and Zoom Phone ensure users don&#39;t need to clear notifications in multiple places. This centralized communication history helps users avoid missing important calls and messages from external contacts.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to mobile Team Chat interface with desktop parity features</td><td>The updated mobile interface now aligns with recent desktop improvements to Team Chat, delivering a more consistent and intuitive experience across platforms. Users can now easily access chat preferences, channels, and newly introduced tabs for <strong>Apps</strong>, <strong>Sent</strong>, <strong>Meeting Chats</strong>, <strong>Channels</strong>, and <strong>Direct Messages</strong>. With synchronized settings and a unified layout, switching between desktop and mobile is seamless. <br /><br />Additional enhancements: <br />\r\n<ul><li><strong>Mentions tab</strong>: Messages are now sorted with the newest at the top, and date markers have been added for better readability.</li><li><strong>Customizable tabs</strong>: Reorder tabs via drag-and-drop in the <strong>More</strong> menu. Choose from <strong>Match my desktop sidebar</strong> or <strong>Reset to default</strong> to personalize your layout.</li><li><strong>Visual refresh</strong>: Tab badge color has been updated from red to blue, improving visual clarity and reducing distraction.</li><li><strong>Unified controls</strong>: Sort and filter options now match those available on desktop, making navigation more familiar.</li><li><strong>Quick search</strong>: Instantly access the search bar by pulling down from the top of the screen.</li></ul>\r\n</td><td>iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to creating and pinning a Doc as a tab within a chat or channel</td><td>Users can more easily create and pin a Doc as a tab within a chat or channel, providing a collaborative space directly integrated into their conversation. With just one click, a shared document with a preloaded template can be generated and instantly linked to the chat, making it easy for teams to collaborate in real time.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to call and voicemail notifications</td><td>Users now experience streamlined notification management for Zoom Phone events in Team Chat. Red badge notifications will appear only for voicemail messages, while accepted, missed, or declined calls will no longer trigger red badges in one-on-one direct messages. Users can clear the voicemail red badge from either the <strong>Chat</strong> or <strong>Phone</strong> tabs. Account owners and admins can manage this feature through admin settings, with the option to disable it for accounts that haven&#39;t upgraded to version 6.3.0.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to AI Companion in mobile app</td><td>Users can now access an enhanced Zoom AI Companion experience on their mobile apps, with capabilities that match those of the desktop app. The mobile interface has been redesigned to offer a more intuitive and seamless interaction with AI-powered features. This enhancement allows users to maintain consistent, AI-powered productivity whether they&#39;re working from their desktop or on the go.</td><td>iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to Zoom AI Companion settings with guided enablement for compose</td><td>Users who encounter the disabled Zoom AI Companion compose feature are presented with an intuitive pop-up interface that guides them through the enablement process. The system determines if the feature is unlocked, displaying appropriate guidance for self-enablement in settings, or locked, maintaining the admin request workflow. This user-centric approach reduces unnecessary admin requests and accelerates feature adoption.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancement to scheduled meetings with unused continuous meeting chats</td><td>Users accessing continuous meeting chat (CMC) will notice changes in how the chats appear in their sidebar. When a meeting is scheduled with CMC enabled, the chat remains hidden until the first user message is sent. Clicking the chat icon without sending a message no longer displays the CMC channel in other users&#39; sidebars. If no messages were sent before or during the meeting, but is activated after by a user-sent message, all system notifications and bot messages, such as post-meeting cards, become visible with their original timestamps. This enhancement helps prevent cluttered sidebars and improves the overall chat experience by displaying only actively used meeting chats.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to disable direct message while maintaining access to continuous meeting chat</td><td>Account owners and admins can configure new account and group-level settings to control direct messaging capabilities across their organization. The settings include options to disable one-to-one messaging, and prevent users from creating new group chats. When these restrictions are enabled, users can still access and participate in channels they&#39;re invited to, as well as communicate in continuous meeting chats, if allowed. Channel and CMC creation are controlled by separate settings. Contact search, new message creation, and message forwarding functions automatically adapt to these restrictions to direct messaging. These settings help organizations control what type of communication they want to unlock for certain user groups.</td><td><br /><br />Windows <br />macOS <br />Linux <br />iOS<br />Android</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Select Online Fax file service</td><td>Users can access files from third-party cloud providers using Zoom&#39;s file picker service, providing users with cloud file picking capabilities for improved document management. This feature streamlines fax operations while providing flexible delivery options and an enhanced user experience across desktop and mobile platforms.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to Zoom PSI client for Mitel call forwarding settings</td><td>The Zoom PSI client for Mitel has been updated with enhancements, including call forwarding capabilities and VDI support. This release also introduces support for presence state, coming from hardware devices assigned to PSI users, and resolving to a common presence state.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to videomail display and voicemail prioritization</td><td>Zoom Phone users can view updated videomail interface elements including a revised title, description, and information icon. The enhanced interface includes clearer labeling and contextual information accessed through a redesigned info icon. The improvements are available across the Zoom desktop and mobile platforms. These user interface refinements help users better understand and interact with the videomail feature while managing their voicemail messages.</td><td>Windows <br />macOS <br />iOS <br /><br />Android</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Display original caller identification for transferred calls in call history</td><td>Users can view comprehensive call transfer information when receiving calls transferred from Zoom Contact Center to Zoom Phone. When accessing the new call history interface, users can see the original caller ID in the <strong>Consumer</strong> field, while the <strong>From</strong> field displays the Zoom Contact Center information. The call history includes additional details such as the transfer initiator, contact center queue name, and agent information. The improved call history interface provides summary data for each transferred call. This feature requires users to have the latest Zoom Workplace app version. Enhanced call transfer visibility helps users better track and manage transferred calls from Zoom Contact Center. <strong>Note</strong>: For variables and sentiment data from ZCC, users must have the Power Pack license to see the data.</td><td><br />Windows <br />macOS <br />Linux <br />iOS<br />Android <br />Appliances</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Avaya PSI device support and call management</td><td>Account owners and admins can implement advanced telephony features in Avaya environments, including call park/unpark buttons, normal and extended call pickup, and send all calls functionality. The system supports team button bridging for both normal and MADN configurations, along with visual voicemail integration. VDI capabilities are available for PSI implementations with Avaya and Mitel Aura 8.X systems. Contact management is enabled through PPM and LDAP integration, while presence features extend to non-Zoom users in Avaya and Mitel environments. This comprehensive feature set enables seamless integration between Zoom Phone and existing Avaya infrastructure, improving workflow efficiency and user experience.</td><td>Windows <br />macOS <br />iOS <br />Android</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Use biometric authentication to unlock access to Zoom - RequireBiometricAuthentication</td><td>Default policy is disabled. If enabled, this policy requires users to use biometric authentication to unlock access to the Zoom app.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Set the delay time for proxy requests in PK requests - ProxyPKRequestDelay</td><td>Default policy is 500. This policy depends on TryPKRequestDirectFirst being enabled. This policy sets the delay for proxy requests in PK requests to increase the likelihood of direct connections winning, and helps reduce the load on proxy servers.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Prevent screenshots of the Zoom app - DisableScreenshot</td><td>Default policy is disabled. If enabled, this policy blocks screenshots of the Zoom app, and users will not be able to share the Zoom app during a screen share.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enable Hardware Acceleration for Annotations under Share Screen &gt; Advanced - AnnotateHardwareAcceleration</td><td>Default policy is enabled. If this setting is true, the Zoom Workplace app will use hardware acceleration to optimize annotations on the shared screen.</td><td>Windows</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Disable WinINet Proxy resolver use curl to download PAC - DisablePacCurlDownload</td><td>Enabled by default. When enabled, this policy prevents the WinINet proxy resolver to try to download PAC by curl. Previously, this policy was disabled by default.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Disable global update option in client - AU2_DisableGlobalUpdateButton</td><td>Default policy is disabled. If this policy is enabled, the global update option at the top of the Zoom Workplace app will be disabled.</td><td>macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Determine where non-PK proxy requests should go - TryPKRequestDirectFirst</td><td>Disabled by default. If this policy is enabled, and the PK request results in the proxy winning, it will not affect subsequent requests. However, if the PK request results in direct connection winning, all subsequent non-PK requests will use direct connections.</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Security enhancements</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue with screen sharing not working</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue that caused incorrect video layout in immersive view after screen sharing ended</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue for a subset of users regarding inconsistent mute and unmute options when joining a meeting with an AI Companion disclaimer</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where rapidly selecting a suggested name while adding users to a channel or group chat could result in the wrong user being added</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with the Zoom Workplace app not adhering to spell check settings on macOS</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with paste functionality, preventing users from correctly pasting information by pressing <strong>Shift</strong> &#43; <strong>Insert</strong></td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where users were unable to preview Zoom Scheduler reminder emails when attempting to update them through the Zoom Workplace app</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue regarding inaccurate watermark transparency</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the <strong>Minimize Zoom to notification area when closed</strong> setting was not working</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue with duplicate voicemails appearing in Zoom Phone</td><td>macOS</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The following features have been pulled from release and will be available in an upcoming release:</p>\r\n<ul><li style=\"font-weight: bold;\"><strong>Enhancements to AI Companion accessibility from website links</strong></li><li style=\"font-weight: bold;\"><strong>Enhancements to document summaries in chat</strong></li><li style=\"font-weight: bold;\"><strong>Enhancements to joining personal meeting rooms</strong></li><li style=\"font-weight: bold;\"><strong>Meeting scheduling conflict resolution with AI Companion</strong></li><li style=\"font-weight: bold;\"><strong>Enhancements to knowledge base search with AI-generated answers</strong></li></ul>\r\n<h3 id=\"mcetoc_1iv3ajrmg5\">July 1, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>6.4.14 (2785)</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Resolved an issue in the desktop app <strong>Settings</strong> window where text was not displayed correctly, resulting in blank areas instead of visible content</td><td>Linux</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iv0a62tbn\">June 30, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.5.3 (7509)</td><td>6.5.3 (58803)</td><td>6.5.3 (2773)</td><td>6.5.3 (31278)</td><td>6.5.3 (31279)</td><td>6.5.3 (26026)</td><td>6.5.3 (26027)</td><td>6.5.3 (26028)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> General features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Onboarding workflow for AI Companion</td><td>\r\n<p>With the AI Companion onboarding workflow, users have the option to use the help wizard to set up AI Companion for their meetings. This onboarding workflow is designed to simplify how users can enable new and existing AI Companion features, by choosing when AI Companion is started in their meetings, who can ask meeting questions with AI Companion, who the meeting summary is sent to, and more. After the set up, users can edit their choices anytime in the Zoom web portal.</p>\r\n<p><strong>Notes</strong>:</p>\r\n<ul><li>The onboarding workflow will only appear for users that have the ability to modify the appropriate AI settings in their profile. If the settings are locked by an admin at the account or group level, the widget will not be presented to the end user.</li><li>This feature will not be immediately available, as it is dependent on a Web release currently scheduled for July 6, 2025. </li></ul>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>\r\n<p>Windows<br />macOS<br />Linux<br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)<br />visionOS</p>\r\n</td></tr><tr class=\"table-row\"><td>Resolved an issue where the <strong>Launch an external app or a URL for incoming calls</strong> stopped working after updating to Zoom Workplace app version 6.5.0.</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r31n\">June 23, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.5.1 (6476)</td><td>6.5.1 (58208)</td><td>6.5.1 (2550)</td><td>6.5.1 (31022)</td><td>6.5.1 (31023)</td><td>6.5.1 (25747)</td><td>6.5.1 (25748)</td><td>6.5.1 (25749)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1iuf0lu2r31o\">June 17, 2025</h3>\r\n<p><strong>Note</strong>: This release was originally scheduled for June 16, but was delayed by one day.</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.5.0 (6118)</td><td>6.5.0 (57940)</td><td>6.5.0 (2465)</td><td>6.5.0 (30913)</td><td>6.5.0 (30914)</td><td>6.5.0 (25622)</td><td>6.5.0 (25623)</td><td>6.5.0 (25624)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Uninstall process with safety confirmation dialog</td><td>When attempting to uninstall the Zoom Workplace through the <strong>Recommended apps</strong> section, users will see a confirmation dialog before the uninstallation begins. This additional step prevents accidental uninstallation and aligns with the existing macOS experience. The confirmation dialog includes <strong>Cancel</strong> and <strong>Uninstall</strong> options, allowing users to proceed with or cancel the uninstallation process.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Update Zoom legal name in Zoom Workplace certificates</td><td>Zoom has officially changed its legal name from <strong>Zoom Video Communications, Inc.</strong> to <strong>Zoom Communications, Inc.</strong>, effective November 25, 2024. This change will be gradually reflected in Zoom Workplace app certificates in upcoming releases. This update affects signature verification during automatic upgrades across desktop, mobile, and web applications. For Android devices running versions below Android 9, users need to uninstall and reinstall the app. The certificate update ensures compliance with Zoom&#39;s new legal entity name while maintaining security standards across all platforms.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Multiple device sign-in settings with device type limits</td><td>\r\n<p>Account owners and admins can configure the number of multiple device sign-ins through the Zoom web portal under <strong>Advanced Security</strong> settings. The default limit is two devices per device type, allowing new users to stay signed in across multiple computers, tablets, and phones simultaneously.</p>\r\n<p><strong>Notes</strong>:</p>\r\n<ul><li>This setting is available for all paid accounts (including Zoom Phone-only plans).</li><li>This setting is <em>not </em>available to free accounts.</li></ul>\r\n</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Bi-directional Zoom and Microsoft presence synchronization</td><td>Account owners and admins can allow users within their account to synchronize their Zoom and Microsoft presence. They can authorize the integration on behalf of users within their account or let users consent to calendar integration by themselves. Previously, users were only able to have their Zoom presence reflected in Microsoft 365.</td><td>Web portal</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Apply custom managed key encryption to additional Zoom data types</td><td>Account owners and admins can leverage Customer Managed Key (CMK) encryption across additional types of Zoom-managed data. This includes content from meeting summary templates, custom avatars, custom dictionaries, and uploaded files in knowledge collections. It also extends to assets originating from Microsoft Teams and Google Meet sessions that are accessed through Zoom. CMK encryption helps ensure sensitive content is encrypted using organization-controlled keys and aligns with Advanced In-meeting Content (AIC) 2.0 standards where applicable. Admins can manage key settings through their existing key management service (KMS) interface.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to view navigation on iPad</td><td>Users can now swipe between different meeting views on their iPad, including the new Multi-speaker view. When using Speaker view, users can swipe right-to-left to access Gallery view. From Gallery view, users can swipe in either direction to access Speaker view or Multi-speaker view. When in Multi-speaker view, users can swipe left-to-right to return to Gallery view. Three indicator dots at the bottom of the screen show the current view position. This enhancement provides a more intuitive and fluid way to switch between meeting views on iPad.</td><td>iOS<br />iOS (Intune)<br />iPad</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>\r\n<p>Redesigned mobile app navigation and menus</p>\r\n</td><td>Users can now access a redesigned navigation experience in the Zoom Workplace mobile app. The new profile menu, accessible from any tab, consolidates presence information, profile settings, account management, and QR code scanning in one location. The app includes a consistent navigation bar design across all tabs, with easy access to search, AI Companion, and product-specific actions. Users can customize which tabs appear in the main tab bar and More menu, with the ability to show up to 5 tabs simultaneously. These improvements help users navigate more efficiently between di

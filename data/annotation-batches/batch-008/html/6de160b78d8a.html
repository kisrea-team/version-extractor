iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in meetings where profile pictures were duplicated after breakout rooms were opened</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jkvoqa7n5u\">March 30, 2026</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>7.0.1 (34140)</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue for users connected to their desk phones getting disconnected after clicking the <strong>Chat</strong> tab in the navigation bar</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1jk3p0297b2\">March 24, 2026</h3>\r\n<p><strong>Note</strong>: This release was originally scheduled for March 23, but was delayed by one day.</p>\r\n<article class=\"article-notes\">\r\n<div class=\"article-notes-icon\"><img src=\"https://assets.zoom.us/generic-images/common-buttons-and-icons/outline/note-element-icon.png\" alt=\"note icon\" /></div>\r\n<div class=\"article-notes-text\">\r\n<p><strong>Update</strong>: As of April 3, 2026, the Zoom Workplace app version 7.0.0 for macOS and Linux has been restored on the <a href=\"https://zoom.us/download?\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Download Center</a>. The Zoom Workplace app <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0061222#mcetoc_1jl89adcf22\" rel=\"nofollow\">version 7.0.2</a> for Windows, iOS, iOS (Intune), Android, and Android (Intune) is available on April 3, 2026. <strong>Note</strong>: The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<br />As of April 2, 2026, the Zoom Workplace app version 7.0.0 for Windows, macOS, Linux, and Android is unavailable for download due to an <a href=\"https://www.zoomstatus.com/incidents/bpjv2mznm75b\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">issue impacting a subset of users in the North America region</a>. This change is to prevent further users from being impacted. Users who are already on version 7.0.0 will not be rolled back to an older version, but they can <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0065146\" rel=\"nofollow\">uninstall Zoom and reinstall</a> the older version from the <a href=\"https://zoom.us/download?\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Download Center</a>. Zoom engineering is actively addressing the issue and is planning to deploy a hotfix soon.</div>\r\n</article>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>7.0.0 (33767)</td><td>7.0.0 (77593)</td><td>7.0.0 (1666)</td><td>7.0.0 (38489)</td><td>7.0.0 (38490)</td><td>7.0.0 (33632)</td><td>7.0.0 (33633)</td><td>7.0.0 (33634)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Memory optimization setting for inactive navigation tabs</td><td>Users can enable a memory optimization setting that automatically manages inactive navigation tabs to improve system performance. This feature includes three customizable optimization levels that control how aggressively the Zoom Workplace app deactivates unused tabs: users can prioritize shorter tab load times, choose a balanced approach, or optimize for faster system performance. When memory optimization is enabled, inactive tabs enter sleep mode to conserve memory, and the setting preferences are retained across sessions. <strong>Note</strong>: This feature will gradually roll out to customers, with expected completion in May 2026.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Linux support for enhancements to the Contacts tab</td><td>\r\n<p>The redesigned <strong>Contacts</strong> experience transforms how you view and manage your contacts, with a simplified navigation and interface, new features, and improved terminology. You can search for contacts and select multiple contacts to initiate engagements like group chats or meetings. When you click a contact, their profile card will open in a right panel, showing their contact information and organization chart. In the left navigation menu, options include <strong>All contacts</strong>, <strong>Starred</strong>, <strong>Contact requests</strong>, and <strong>Groups</strong>. Within the <strong>Groups</strong> section, you may have groupings such as your external contacts, your company directory, Zoom Rooms, and more. For more organization, you can create your own groups of contacts and sync contacts from a connected Google, Exchange, or Office 365 account on Zoom. The new interface provides enhanced functionality while maintaining familiar contact management workflows for improved productivity.</p>\r\n<p><strong>Notes</strong>:</p>\r\n<ul><li>There are no admin settings or toggles to enable or disable this new experience.</li><li>At this time, users with Zoom Phone Power Pack will retain the current native interface to preserve specialized telephony features and grid view capabilities.</li></ul>\r\n</td><td>Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to the onboarding workflow for AI Companion</td><td>Workplace Pro users receive an improved AI Companion onboarding experience through a redesigned widget with updated logic and user interface. The system removes previous limitations where admin-locked settings would prevent the entire widget from displaying to users. The onboarding process guides users through setting up AI Companion for hosted meetings, connecting third-party calendars when needed, and configuring summary delivery to external applications. Users retain the ability to maintain existing settings, save selections progressively, or defer setup with reminder notifications. The enhanced onboarding widget provides better accessibility and clearer guidance for optimizing AI Companion functionality across meeting workflows.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Changed feature</td><td><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0060748\" rel=\"nofollow\">End of support for macOS 10.13 and 10.14</a></td><td>With this release, macOS users will need to be on macOS 10.15 or higher to continue to receive additional Zoom app updates. Devices still using macOS 10.13 or 10.14 will no longer be supported and will have 6.7.7 (or any additional patches in the 6.7.X branch) as the last version available.</td><td>macOS</td></tr><tr class=\"table-row\"><td>Changed feature</td><td><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0060748\" rel=\"nofollow\">End of support for legacy Linux distributions</a></td><td>With this release, the minimum supported Linux distributions are Ubuntu 20.04&#43;, Fedora 32&#43;, RHEL 9&#43;/CentOS Stream 9&#43;, Debian 11&#43;, and OpenSuSE 16&#43; with GCC 9.4 or later. Users on unsupported legacy distributions can continue using version 6.7.5 (or any additional patches in the 6.7.X branch), but will not receive further updates.</td><td>Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Create custom banner in Zoom Workplace for organizational messaging</td><td>Account owners and admins can create custom banners that display organizational announcements to users on the Zoom Workplace app <strong>Home</strong> tab. Admins can target specific user groups or the entire organization, include hyperlinks within banner content, and control display frequency with options ranging from every sign in to annually. The banners include dismiss options and follow the same methodology as custom disclaimers, with a maximum of two banners displayed simultaneously alongside service banners such as &#34;on a Zoom Phone call&#34;. When an admin creates a custom banner, users on desktop app version 7.0.0 and higher will see the custom banner. Users on versions below 7.0.0 will not see custom banners set by their admin.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Apple Watch app compliance update for watchOS 26</td><td>Users can continue accessing Zoom Workplace app features on their Apple Watch devices through updated app architecture that supports all required 64-bit configurations. The app builds using the watchOS 26 SDK with compatibility testing across Apple Watch Series 9, 10, and 11, plus Apple Watch Ultra 2 and 3 models. Build settings remove legacy architecture configurations in favor of Standard Architectures to produce optimized binaries for each device. While the technical changes may increase overall binary size, users experience no larger downloads since only one architecture slice delivers to each device. These improvements maintain seamless Apple Watch functionality ahead of Apple&#39;s April 2026 enforcement requirements.</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Admin-configured tab ordering for Zoom Workplace desktop app</td><td>Account owners and admins can establish organization-wide default tab ordering for the Zoom Workplace desktop app navigation bar. The App tab configuration settings allow admins to specify which tabs appear on the left navigation bar versus under the <strong>More</strong> menu. Admins can choose to apply configurations to new users only or push changes to all existing users, with appropriate user notifications when overriding personal customizations. The system displays the complete set of tabs available, automatically adapting to individual user licensing and permissions. This functionality streamlines the user experience by surfacing the most business-critical Zoom features while preserving individual customization capabilities.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meetings features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Zoom Huddles Beta Ending</td><td>Starting with Zoom Workplace app version 7.0.0, users will no longer have access to Zoom Huddles as the feature reaches end of life. Users on earlier versions will retain access to Huddles for a three-month transition period, ending with the upcoming 7.1.0 release. During this transition, web portal settings will remain available for accounts that currently have Huddles enabled. All existing Huddles channels will transition to Zoom Chat channels, preserving content and conversations for users with Zoom Chat access.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support Voice translator during meetings</td><td>Account owners and admins with eligible accounts can enable Voice translator capabilities that convert translated captions into spoken audio for meeting participants. The feature integrates with existing AI-powered translated captions technology and provides automated text-to-speech services in multiple languages. This feature uses artificial intelligence to process spoken language, translate content, and generate synthetic speech in real-time. Translation quality may vary and evolve depending on language pair, audio quality, and speaking clarity. Users can customize their translation experience by selecting interpreter personas and preferred spoken languages. <br /><strong>Note</strong>: Implementation will be done in phases, with beta access given to eligible accounts with limitations. </td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support custom emojis in meeting</td><td>Meeting participants can access custom emojis in chat messages and video reactions.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Smart recognition - Simplified enrollment flow for uploading image or voice recording</td><td>If enabled by admins, users can upload a single voice recording or image from the Smart Recognition section in the Zoom Workplace mobile app to activate multiple features across Zoom Workplace app and Zoom Rooms. These features include Smart Name Tags for voice and video, as well as personalized audio isolation. Users can also update or delete their image from the same location.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Share video files at up to 60fps</td><td>Users with the Enhanced Media license can share video files at up to 60 fps, making it ideal for presenting a specific video instead of sharing the entire screen. Users can select the resolution and frame rate in the share modal before choosing a file, and Zoom automatically adjusts these settings based on the source video and network conditions.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to post-meeting assets email routing</td><td>Users can access a unified meeting management experience through an updated post-meeting assets email that routes them directly to AI Companion 3.0. The enhanced email provides a single access point where users can view all meeting assets, ask follow-up questions about their meetings, complete action items, and generate additional content using AI capabilities. Routing logic automatically directs users to AI Companion 3.0 when the web setting is enabled, or falls back to Hub or individual asset pages based on their configuration. Individual summary and recording emails are no longer sent when the consolidated assets email is delivered, though they remain supported for individual sharing scenarios. This integration creates a more efficient post-meeting workflow by centralizing asset management and enabling AI-powered meeting follow-up. <strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend server update currently scheduled for March 28, 2026.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced in-meeting participant list status icons and better visibility of available actions</td><td>Users can access detailed information about participant statuses through enhanced tooltip functionality in the participants list. The previous hover behavior that displayed large mute and more buttons has been replaced with a persistent layout where status icons remain visible and action buttons stay consistently displayed. Each status icon shows descriptive tooltips when hovered, indicating the current state or available action such as <strong>Muted</strong> or <strong>Video on</strong>.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Dynamic gallery view support for up to 49 participants</td><td>Users can display up to 49 participants in dynamic gallery view, matching their <strong>Maximum participants per screen</strong> setting (25 or 49) in <strong>Settings</strong> &gt; <strong>Meetings &amp; webinars</strong> &gt; <strong>Participant video</strong>. Previously, dynamic gallery view was limited to 9 participants regardless of this setting.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Browser tab sharing</td><td>Users can share an individual Chrome or Edge browser tab during meetings without revealing their other open tabs. Presenters can select any tab from the sharing menu and only that tab is visible to participants, even if they switch away during the presentation. This feature provides presenters with greater privacy control and helps participants focus on relevant content without distractions from unrelated browser tabs.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Blocking copy and download of files in meeting chat</td><td>Account owners and admins can enable or disable a setting that prevents all meeting participants from copying or downloading content uploaded to meeting chat through Zoom&#39;s interface. The restriction covers files, images, and screenshots shared by any attendee during the meeting session. This setting controls Zoom application features but cannot prevent participants from using external screen capture tools, taking photos of screens, or utilizing other methods of content capture outside the Zoom application. This feature must be enabled by Zoom.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automated local recording start upon host approval</td><td>During a meeting, when participants request to start a computer recording, they see a notification explaining that computer recording will start automatically once the host approves their request. Upon host approval, the system immediately begins local recording and displays a confirmation message to the requesting participant.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Appearance section added to mobile video settings</td><td>Users can access a dedicated Appearance section under video settings in the mobile app, available both in-meeting (<strong>More</strong> &gt; <strong>Settings</strong> &gt; <strong>Video &amp; effects</strong>) and out-of-meeting (Profile &gt; <strong>Settings</strong> &gt; <strong>Video &amp; effects</strong> &gt; <strong>Appearance</strong> &gt; <strong>Video &amp; effects</strong>). In the <strong>Appearance</strong> section of the <strong>Video &amp; effects</strong> menu, users can manage video appearance settings, including <strong>Touch up my appearance</strong>, <strong>Portrait lighting</strong>, <strong>Adjust for low light</strong>, and <strong>iOS Center Stage</strong>. The new <strong>Adjust for low light</strong> setting improves video brightness in darker environments and is off by default. The new <strong>iOS Center Stage</strong> setting automatically keeps users centered in the video frame, and only appears on supported iOS devices and versions.</td><td>iOS <br />iOS (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td><a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0059415\" rel=\"nofollow\">AI avatars in meetings</a></td><td>Zoom introduces AI avatars that move and react like the user, offering both Realistic and Stylized options generated from a photo and animated in real time using the camera feed. The feature processes facial data to create a photorealistic digital representation. Users can create and customize their avatar from the Zoom Workplace app <strong>Settings</strong> &gt; <strong>Video &amp; effects</strong> &gt; <strong>Avatars</strong> tab. Users must provide explicit consent before avatar creation. Users can switch between avatar and live video during meetings, and delete the avatar and associated data at any time.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to bypass waiting room for organization accounts</td><td>Meeting participants can bypass the waiting room when joining meetings hosted by someone within their organization. The meeting host can opt to automatically admit participants from any account connected within their organization while external participants remain subject to waiting room controls. The setting to enable waiting room bypass can be managed by the account owners and admins.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>3-minute caption scroll back</td><td>Users can scroll back through captions for up to 3 minutes when captions are displayed. This enhancement allows participants to revisit earlier meeting content making it easier for users to catch up on missed content or review important information shared earlier in the conversation.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080361\" rel=\"nofollow\"> Webinar features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Computer sound sharing in webinars during simultaneous screen share</td><td>Panelists can share computer sound when multiple people are allowed to screen share simultaneously in webinars. Previously, the ability to share computer sound was disabled when multiple screen sharing was enabled to prevent audio conflicts. This update improves the webinar hosting experience by providing consistent audio sharing capabilities during multiple screen sharing sessions across Zoom Meetings and Zoom Webinars.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Product name update from Team Chat to Chat</td><td><strong>Team Chat</strong> will now be called <strong>Chat</strong>. Users will see <strong>Chat</strong> branding across all interfaces, replacing previous <strong>Team Chat</strong> references in sidebar headers, settings menus, tooltips, and system notifications. The chat icon and core functionality remain unchanged. Only display names and labels have been updated to reflect the new branding. This update provides clearer product identification within the Zoom ecosystem and ensures consistent naming across all user interfaces.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Global search now includes Zoom Phone call logs in mobile app</td><td>Users can find Zoom Phone call logs directly through the global search feature, eliminating the need to manually scroll through phone history. The enhanced search allows filtering by specific dates, contact names, and full or partial phone numbers. Available on the mobile app, this update makes locating call details faster and more convenient. By simplifying access to communication records, it helps boost efficiency and productivity.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Forward in-meeting chat messages to other conversations</td><td>Users can forward messages from in-meeting chat to other conversations, bringing feature parity with Zoom Chat functionality. When forwarding a message, users click the forward option to open a forward message panel and select their desired destination. After successfully forwarding, a toast notification appears with a clickable link that allows users to jump directly to the forwarded message. This enhancement eliminates the previous feature gap and provides a consistent user experience across all chat environments.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to in-meeting chat system messages</td><td>\r\n<p>Meeting hosts and participants can experience a cleaner, more streamlined in-meeting chat interface when continuous meeting chat (CMC) is enabled. Redundant system messages have been removed, eliminating duplicate information that previously appeared in both system notifications and the compose box banner, such as chat visibility, storage location, and member permissions.</p>\r\n<p>Users can still easily see whether CMC is enabled, understand who can view their messages, and know where chats are saved through a clearer, unified messaging approach. This update reduces on-screen clutter and minimizes confusion during meetings.</p>\r\n</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Web setting for &#34;Enable Continuous Meeting Chat&#34; has been renamed to &#34;Allow users to access meeting chats before and after the meeting&#34;</td><td>\r\n<p>In the Zoom web portal, the <strong>Enable Continuous Meeting Chat</strong> setting is now called <strong>Allow users to access meeting chats before and after the meeting</strong> to better reflect its functionality.</p>\r\n<p>With this setting enabled, all invitees and users who join via link or Meeting ID (based on the selected meeting option) have consistent access to meeting chat before, during, and after the meeting. Previously, only invited participants retained ongoing access, while users who joined through shared links, Meeting ID with passcode, or who were added during a live session could lose access once the meeting ended unless manually approved by the host.</p>\r\n<p>With this update, eligible participants are automatically granted access to the meeting chat throughout the entire meeting lifecycle. This ensures more predictable chat availability, allows participants to review past messages and shared content, and removes the need for post-meeting access approvals.</p>\r\n<p><strong>Notes</strong>:</p>\r\n<ul><li>The <strong>Only host and invitees</strong> option is still available.</li><li>This setting applies to both scheduled and instant meetings.</li></ul>\r\n</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Advance notice of end of support for Quick Schedule with AI Companion</td><td>The Quick Schedule with AI Companion feature will be fully removed on April 4, 2026. This feature detected situations in group chats, direct messages, and channels where a meeting would likely be created, and streamlined the scheduling process to enhance productivity. On the specified date, Zoom customers will no longer be able to use this feature.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Time-lapse recording mode on mobile</td><td>Users can record clips in time-lapse mode directly from their mobile device. The time-lapse feature captures longer moments in a condensed, visually appealing format. Users can easily switch between standard and time-lapse modes from the recorder interface.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support creation of custom cartoon avatar on mobile devices</td><td>Users can create a custom cartoon avatar in addition to using the preset avatars. The cartoon avatar feature mirrors the desktop experience by providing the same avatar options across both platforms.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Real-time visual filters for mobile recording</td><td>Users can apply brightness, saturation, and contrast adjustments during mobile video recording. The filters provide real-time preview capabilities, allowing users to see how their adjustments affect the final recording. Visual changes are applied directly to the captured video with minimal additional processing steps. This feature aims to minimize the need for post-recording editing to correct lighting and color balance issues.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Pre-submission quality feedback for custom avatar videos</td><td>Users can access detailed quality assessment and improvement recommendations for their seed videos during the custom avatar creation process. The feature provides specific guidance on how to correct identified audio and video issues, along with clear explanations of quality requirements. Users receive targeted suggestions for addressing problems such as audio levels, lighting conditions, and video clarity.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Loading confirmation for clip readiness</td><td>Users see a loading popup after completing a recording before being redirected to the playback page. The system displays this loading screen to verify clip processing is complete before redirecting users to the playback page. This feature helps reduce the likelihood of users encountering playback issues by confirming clips are fully prepared for viewing.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to Clips custom avatar regional availability</td><td>Users of accounts that have predefined Data &amp; Storage location for certain data set to Japan, Australia, or Canada can now access the Clips custom avatars feature. Previously, the custom avatars feature was limited to accounts with a US data storage location. This expansion reduces geographical restrictions and provides customers who use certain regional data storage locations with broader access to Avatar functionality.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Camera toggle button in Clips recorder</td><td>Users can toggle their camera on or off directly from the camera preview frame in the Clips recorder. The visible button appears on the preview interface, reducing the need to access recorder settings to control camera functionality. Users who previously enabled their camera will see it turn on by default when opening the recorder.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to turn presentation slides into a video using custom avatar</td><td>Users can compose clips by combining Avatar-generated scenes with their own video recordings through the new Avatar Scene Editor. Each scene within a clip can feature either Avatar content or real video segments, allowing for integration of different video types. The editor supports multi-scene clip creation where users can structure their content by mixing AI-generated Avatar videos with personal recordings.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Tab shortcuts for mobile devices</td><td>Users can configure shortcuts within the Zoom Phone mobile app to quickly access specific functions like Phone, History, Lines, Voicemail, Fax, Keypad, and New SMS. iOS users can set up Quick actions similar to the existing Android functionality, while admins can deploy shortcuts across their organization using Mobile Device Management with deeplink URLs and web clips for iOS or pinned shortcuts for Android. The feature supports managed app configurations and allows MDM admins to use web clips, managed shortcuts, and Android intent URIs for deployment. This enhancement streamlines navigation and enables organizations to replace native SMS applications with Zoom Phone&#39;s SMS functionality.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Site admin management improvements</td><td>Admins can access enhanced site management capabilities designed to streamline Zoom Phone administration and improve operational efficiency. The improvements include updated administrative controls and interface enhancements that simplify common management tasks. These enhancements are specifically tailored to support enterprise deployment requirements and facilitate smoother adoption processes. The improvements provide admins with more intuitive tools for managing their Zoom Phone environment effectively.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced fax functionality with improved transmission reporting and sending options</td><td>Admins can enable customer-managed key encryption for faxes similar to recordings and voicemails, with automatic fallback protection to ensure transmission reliability. Users benefit from consolidated upload and confirmation dialogs, multi-language support for transmission reports, and the ability to cancel active fax transmissions with detailed progress feedback. The platform supports cover-page-only transmissions, and enforces a 50-fax concurrent sending limit across all channels.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Comprehensive Turkish audio prompt integration for all Zoom Phone features</td><td>Users can access Turkish language audio prompts throughout the Zoom Phone platform, complementing the existing Turkish language support in the Zoom app and web interfaces. Account owners and admins can select Turkish as the audio prompt language across user profiles and all system features, including Auto Receptionist, Call Queue, Shared Line Group, and Call Answering services. The feature provides complete Turkish prompt sets that work seamlessly across desktop applications, mobile devices, Zoom Phone Appliances, progressive web applications, and certified desk phones. This comprehensive language support helps organizations serve Turkish-speaking customers and markets more effectively while maintaining consistent multilingual communication experiences.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Video call support for mobile app</td><td>Agents can join, host, and manage video engagements directly from the Zoom Contact Center mobile app on iOS and Android devices. The feature includes camera and microphone controls with reliable audio and video quality for customer interactions. Low-bandwidth handling and fallback capabilities help maintain call quality in varying network conditions. This capability extends the full video channel functionality to mobile devices, giving agents greater flexibility in supporting customer needs that require visual or face-to-face interaction. This feature must be enabled by Zoom. </td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune) </td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Live transcript translation for voice engagements</td><td>Agents can manually enable live transcript translation during voice engagements to communicate more effectively with consumers who speak different languages. Agents can select their speaking language and choose their preferred language for reading transcripts from all supported Zoom Contact Center languages. The feature displays both original and translated captions during the conversation. This feature must be enabled by Zoom.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Live AI interpreter for voice engagements</td><td>Agents can use AI-powered real-time voice translation when speaking with consumers who use different languages during voice engagements. The feature leverages existing caption and translation technologies with added speech capabilities to eliminate language barriers. When enabled, the system provides live interpretation between participants, removing the need for manual interpreters or ad-hoc translation assistance. This enhancement allows agents to better serve multilingual customer bases without communication delays. This feature must be enabled by Zoom.</td><td><br />Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Gallery view recording for video engagements</td><td>Account owners and admins can configure video engagement recording policies to capture gallery view alongside shared screen content. This setting allows recording of both consumer and agent video feeds simultaneously, rather than only the active speaker. Admins can select between recording active speaker with shared screen or recording gallery view with shared screen at both account and queue levels. Users with recording permissions can view the complete engagement experience through an enhanced player that displays all participants and shared content. This feature must be enabled by Zoom.</td><td><br /><br />Windows <br />macOS <br />Linux<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Email engagement search</td><td>Agents can search for open and closed email engagements directly within Zoom Contact Center using multiple search criteria including contact name, email address, time range, and keywords in subject or body content. The search functionality includes filters for reply type and disposition name. Search results display subject lines, sender and recipient information, status, timestamps, and preview snippets for quick identification. This feature must be enabled by Zoom.</td><td><br />Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Agentic AI Expert Assist</td><td>\r\n<p>The Zoom Contact Center is launching its next generation of AI Expert Assist, powered by Agentic AI technology. The new Agentic AI Expert Assist introduces the following new capabilities in addition to those available in the current classic AI Expert Assist:</p>\r\n<p>For agents:</p>\r\n<ul><li><strong>Orchestrated Real-time suggestion</strong>: Orchestrates complex guidance into a single, unified action path for agents with sequential prioritization.</li><li><strong>Agentic actions and task completion</strong>: Executes real-time actions in third-party systems through AI Expert Assist, streamlining agent workflows and improving productivity while keeping agents in control, requiring human approval or initiation before any actions are executed.</li><li><strong>Smarter response assistant</strong> : Generates real-time, context-aware replies using full conversation context and improves the agent&#39;s writing when they choose to draft response first. Agents can accept, edit, regenerate (up to 3 times), or adjust tone and length.</li><li><strong>AI-powered checklists</strong> : Supports up to 5 customizable checklists with required or optional steps. Once a relevant checklist is automatically activated by the system or manually selected by the agent, AI detects completed steps in live conversations and prompts agents if mandatory items are missed.</li><li><strong> On-demand knowledge assistance with multi-round AI chat </strong> : Enables agents to query connected knowledge bases on demand, receive summarized answers with top relevant sources, and ask follow-up questions directly in their workspace.</li><li><strong>Engagement handover preparation</strong>: Prepares the next agent with an admin-customized AI generated summary capturing the most critical information of prior conversation. Avoids unnecessary repeat by auto-checking off relevant checklist items based on previous interaction</li></ul>\r\nFor admins:\r\n<ul><li><strong>Prompt driven agent builder</strong>: A guided step-by-step generative prompt driven builder enables rapid configuration of AI Expert Assist. It enables admin to define goals, connect knowledge base sources, and add skills tailored to business needs.</li><li><strong>Configuration version control</strong> : Automatically saves published configurations with <strong>Draft</strong> , <strong>Published</strong> , and <strong>Archived</strong> statuses. Admins can review history, compare changes, and restore previous versions.</li></ul>\r\nThese enhancements help agents respond faster, maintain consistency, and access more relevant information more efficiently across all supported channels.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080489\" rel=\"nofollow\"> Hub features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Notification badge on Zoom Hub</td><td>To stay informed about file updates, users receive notifications directly on their Zoom Hub tab in the Zoom Workplace app. The notification badge reflects the precise number of unread notifications, automatically updates as users read or mark notifications as read, and disappears once all notifications are marked as read. This enhancement provides immediate awareness of important file-related updates while users work across different browser tabs or applications.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0081420\" rel=\"nofollow\"> Video Management features</a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Zoom Chat notifications for collaborator invitations</td><td>Users invited as collaborators for video channels receive notifications through both video management channel detail pages and Zoom Chat. This feature allows users to review invitation details and join as collaborators through a streamlined process. This enhanced notification approach improves collaborator onboarding by providing multiple points of entry and reducing barriers to channel participation.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Multi-segment recording support for clips creation</td><td>Recordings with multiple segments can be imported into Zoom Video Management. When selected, these recordings display their segments as separate entries, allowing users to choose which segments to import as independent clips. The system applies existing recording-to-clips conversion settings and generates transcripts and smart chapters for each imported segment. Storage usage counts toward account limits with appropriate warnings displayed when necessary. This feature expands content import capabilities to support all recording types regardless of how they were captured.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature </td><td>Home page content filtering with preference controls</td><td>Users can customize their video management Home page experience by selecting &#34;Not Interested&#34; next to any video channel in the Home page, which removes that channel from their feed across all devices and viewing contexts. The Continue Watching section also features removal controls that allow users to eliminate specific videos they no longer wish to see. Channel preference in the Home page is accessible in the user&#39;s profile settings, where they can restore previously excluded content.</td><td>Windows<br />macOS<br />Linux </td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Specify browser for SSO authentication flows - SetSSOBrowser</td><td>Disabled by default (empty), admins can use this policy to specify the browser option required for all single sign-on (SSO) authentication flows in the Zoom Workplace app for iOS. If this policy is a valid string, the Zoom Workplace app for iOS must initiate all SSO authentication flows using the specified browser option instead of Safari or Safari WebView.</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Prevent installation of standard Zoom Workplace app installation in VDI environments - DisableInstallStandardClientInVDI</td><td>Disabled by default. When enabled, the <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0085004\" rel=\"nofollow\">installation of the standard Zoom Workplace app in a VDI environment will be blocked</a>. If this policy is disabled or not set, the standard Zoom Workplace app can be installed normally in a VDI environment.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Generate event log for Zoom Workplace app crashes - EnableCrashEventLog</td><td>Disabled by default. When enabled, the Zoom Workplace app generates an event in the Windows Event Log (Event Viewer &gt; Windows Logs &gt; Application) when it crashes. If this policy is disabled or not set, an event will not be generated in the Windows Event Log when the Zoom Workplace app crashes.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Distinguish devices by generating device IDs based on MAC addresses - GenerateDIDUsingMacAddress</td><td>Disabled by default. When enabled, the Zoom Workplace app will generate the device ID based on MAC addresses to distinguish devices. This policy helps prevent multiple devices from sharing the same device ID. If this policy is disabled or not set, the app will continue to use the default device ID generation method.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Apply Memory Saver behavior - MemorySaverEnabled</td><td>Enabled by default, the Zoom Workplace app will apply Memory Saver for WebView recycle behavior. The recycle behavior can be controlled by the MemorySaverOptimization policy.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Set Memory Saver optimization level - MemorySaverOptimization</td><td>This policy works in conjunction with MemorySaverEnabled and sets the Memory Saver optimization level for WebView recycling behavior. Optimization levels include light (1), default (2), and aggressive (3). The default policy is 2, which means the app will use the default optimization level.</td><td>Windows <br />macOS <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune)<br />visionOS <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Security enhancement</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue causing the Zoom desktop app on Ubuntu to launch duplicate instances when signing in with single sign-on authentication</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where the first occurrence of a recurring meeting was not displayed in the Zoom desktop app calendar when scheduling meetings</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue causing calendar meetings from Exchange to stop syncing and displaying on the Zoom mobile app</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where user group settings were not applying consistently based on user group priority</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users were unable to see breakout room options, such as ask for help, after joining a breakout room</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved issues with how custom recording disclaimers were displayed</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where Samsung Android devices were not vibrating when receiving Zoom calls while the phone was locked</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users could not click on hyperlinks in custom fields displayed in the call pop-up window in Zoom Contact Center</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in version 6.7.6 where the Activity Center would not close</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where gallery view of participants disappeared when the host shared a Keynote presentation in presenter mode on a dual monitor setup</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where agent screen recordings were intermittently not appearing in Quality Management for Zoom Contact Center</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where incoming calls to a shared line group were appearing incorrectly as individual user calls instead of group calls</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the camera screen turned black when joining a Zoom meeting on select Android devices</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where SMS messaging functionality was inaccessible when the window was not maximized to full screen</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where users were not hearing the timer completion sound notification during meetings</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where call queue options became unresponsive after expanding the queue list</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where screen sharing was not working on the Zoom desktop app for Linux on Wayland</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where Zoom Phone was incorrectly adding a US country code to Japanese phone numbers when using click-to-dial from external apps on mobile devices</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where the translate option was not working for messages written in Traditional Chinese</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue where the Zoom meeting window lost its window controls and displayed incorrectly in full-screen mode after disconnecting an external monitor</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue causing the Zoom Workplace app to crash unexpectedly when reopening after the computer had been locked</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where scheduled meetings would inconsistently disappear from the Zoom calendar despite being visible in Outlook</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue causing Zoom to revert to the device&#39;s built-in camera instead of remembering the selected external monitor camera after switching monitors or putting the device into hibernate mode</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue with translated captions not working correctly</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue causing the Zoom mobile app to display different meeting entries than the Zoom desktop app calendar</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue during startup on Fedora Linux systems where the app displayed &#34;Connecting…&#34;, but failed to load</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved a syncing issue with Outlook, causing meetings to not appear in Zoom and displaying incorrect times</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The following features have been pulled from release due to issues with deployment and will be available in another upcoming release:</p>\r\n<ul><li style=\"font-weight: bold;\"><strong>Ability to use companion audio without direct network connectivity to the Zoom Room</strong></li><li style=\"font-weight: bold;\"><strong>Enhancements to meeting transcripts and captions</strong></li><li style=\"font-weight: bold;\"><strong>Support auto-call for scheduled meetings on mobile devices</strong></li><li style=\"font-weight: bold;\"><strong>Improved Webinar Chat for enhanced messaging</strong></li><li><strong>Quiz result integration with LMS gradebooks via LTI 1.3 </strong>(Video Management)</li><li style=\"font-weight: bold;\"><strong>Video management billing and usage reports</strong></li><li style=\"font-weight: bold;\"><strong>Zoom Video Management deployment to Saudi Arabia</strong></li><li style=\"font-weight: bold;\"><strong>Advanced fax cover page management and template deployment capabilities</strong></li></ul>\r\n<h3 id=\"mcetoc_1jjadad917\">March 11, 2026</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.7.8 (32670)</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-

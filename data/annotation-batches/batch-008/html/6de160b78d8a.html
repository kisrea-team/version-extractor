id (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Customized mobile interface for retail environments</td><td>Users can utilize a specialized user interface for Zoom Phone on Android devices used in retail environments through the Shared Mobile Experience (SME). The customized interface prioritizes essential functions like Phone, Push to Talk, and Contacts while removing unnecessary features that are not relevant to retail associate workflows. This streamlined experience only appears when devices are activated as common areas. The feature is initially available for Android clients running on Zebra devices. This focused interface enables retail associates to quickly access the tools they need most during their daily operations. This feature must be enabled by Zoom.</td><td>Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Conversational voicemails for group messaging</td><td>Account owners and admins can enable conversational voicemails, allowing users to broadcast voice or video messages to multiple recipients simultaneously through admin-defined groups or company-wide distribution, with automatic encryption through Customer Managed Keys (CMK) when enabled. The feature integrates with existing Zoom Phone (ZP) security controls, including Personally Identifiable Information (PII) redaction, Bring Your Own Storage (BYOS) compatibility, and voicemail task extraction capabilities. Messages automatically save as drafts when network issues occur during recording, and deleted voicemails follow existing trash folder policies. Admins can monitor all conversational voicemails through the Phone System Management logs interface. This solution helps organizations migrate from legacy premise-based systems while maintaining familiar group communication workflows. This feature must be enabled by Zoom.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Comprehensive mobile alerts for call queue management</td><td>Zoom Phone has enhanced Call Queue (CQ) management on the Zoom Workplace mobile app to provide admins and CQ members with greater visibility into call queue performance and activity. In addition to the existing alert for the number of waiting calls, users can receive more detailed CQ alerts and notifications, including inbound abandoned calls, inbound average call waiting time, inbound calls forwarded to voicemail, and inbound overflowed calls. These expanded alerts help users stay informed and responsive to real-time call conditions directly from their mobile devices.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Call transfer to original callee&#39;s voicemail</td><td>Users can transfer callers directly to the original callee&#39;s voicemail when handling calls that have been transferred, forwarded, or overflowed from another user. The original callee information (the first Zoom Phone number the caller contacted within the account) is displayed in the client interface, allowing users to easily identify who the caller initially contacted and transfer them to that person&#39;s voicemail with a simple button press or short code on desk phones. If the original callee&#39;s voicemail is disabled, an error message appears to inform the user that the transfer cannot be completed. This feature eliminates the need to search for extension numbers or remember names when redirecting callers to the appropriate voicemail.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Call transfer summary sharing</td><td>Users can provide detailed context with the AI Companion call summary feature when transferring calls, so recipients have complete information before answering. The summary can be manually or automatically enabled during calls and offers an option to share summaries with the transfer recipient, including the call&#39;s purpose, previous actions, and recommended next steps. Recipients can view this contextual information once the call is answered, and the summary remains accessible throughout the engagement for reference. This enhancement enables customers to receive consistent, informed service without having to repeat their concerns to multiple representatives.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatic task creation from Zoom Phone call summaries</td><td>Account owners and admins can enable automatic Zoom Task creation from AI Companion call summaries, with options to configure collaborator settings for call participants. Users receive AI-generated task recommendations based on their call summaries and can create tasks manually using a dedicated button that opens the task creation dialog. The feature includes right-click functionality on calls for direct task creation and displays all generated tasks when viewing call history. Call participants can be automatically added as task collaborators based on admin configuration. This seamless integration between phone calls and task management transforms next steps into actionable items without manual intervention.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatic summary integration with Zoom Docs</td><td>Users can automatically save AI Companion live summaries from Zoom Phone calls directly into Zoom Docs. At the end of each call, users receive a prompt to confirm if the AI-generated summary should be saved to Zoom Docs. Each summary document includes metadata such as call time, participants, and source call information for context. Users can edit and comment on the auto-generated summaries after calls end to refine or supplement the information. Account owners and admins can enable or disable this automatic summary-to-document flow at the organization or group level to manage AI data usage based on compliance requirements. This integration allows users to retain and act on call insights without manually transcribing or documenting them.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Alternative enrollment method for shared mobile devices</td><td>Account owners and admins can provision shared Android devices using enrollment tokens instead of activation codes for Shared Mobile Experience (SME) Common Areas. The feature uses client group policy enrollment tokens and customer-supplied network IP information to automatically determine site assignments. Enrollment tokens have a default expiration of at least 12 months, significantly reducing the operational overhead compared to frequently expiring activation codes. This approach eliminates the need for Mobile Device Management (MDM) solutions and resolves compatibility issues with various MDM platforms. The alternative method enables true device sharing across multiple locations and simplifies replacement device management. This feature must be enabled by Zoom.</td><td>Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>AI-powered task extraction from voicemail transcriptions</td><td>Users can create Zoom Tasks directly from their voicemail transcriptions using AI-powered extraction capabilities. The feature provides a UI button and right-click option on voicemails to generate recommended tasks, with extracted tasks appearing in the main Tasks product list. Admins control access through the <strong> Automatically generate tasks from voicemail transcription </strong> policy, which requires voicemail transcription to be enabled and supports English transcriptions only. Users must provide explicit consent before task extraction begins, and the system eliminates duplicate items while providing summarized, actionable content. This integration streamlines voicemail processing by converting audio messages into organized, trackable tasks. This feature must be enabled by Zoom.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Advanced multi-party conference merging</td><td>\r\n<p>Advanced multi-party conference merging enables shared line appearances (SLA) delegates that are a part of two separate multi-party conferences to merge these conferences into a single multi-party conference. This preserves advanced executive/assistant workflows for organizations moving from legacy phone systems to Zoom Phone.</p>\r\n<p>For example, a use case would be:</p>\r\n<ul><li>Assistant 1 establishes a 3-way conference call that includes their executive and a 3rd party on SLA1.</li><li>Assistant 1 calls SLA2. Assistant 2 answers and conferences in their executive.</li><li>Assistant 1, as a member of both conference calls, can merge these into a single large conference call.</li></ul>\r\nThis feature must be enabled by Zoom.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Scheduled callback links for voice channel</td><td>Agents can send scheduled callback links to consumers during active voice engagement. If an issue cannot be fully resolved during the initial interaction, agents can initiate a callback request, allowing consumers to schedule future support at their convenience. The link can be sent directly within the conversation. Admins can enable this capability through queue settings with role-based controls. This helps maintain service continuity by allowing customers to receive additional time or follow-up assistance beyond the current interaction. This feature must be enabled by Zoom.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Immersive chat window for desktop web chat</td><td>Account owners and admins can enable a new an immersive, centered modal chat experience for Zoom Contact Center (ZCC) on desktop and tablet devices. The chat window opens in the center of the screen, keeping users focused on their conversation. Admins can optionally gray out and disable background interaction, reducing accidental exits and helping users stay engaged. If using a <strong>Welcome Screen</strong>, it will be displayed at standard width before expanding. The mobile user experience remains the same and continues to open in full-screen mode. This focused chat experience helps users stay engaged and prevents confusion from multiple chat entries or accidental exits.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Image copy and paste support for web chat</td><td>Consumers can copy and paste images directly into Zoom Contact Center web chat windows using right-click paste or keyboard shortcuts (Ctrl&#43;V, Mac&#43;V). Pasted images display in a preview window before sending, allowing consumers to review and delete images if needed. This creates a faster, more intuitive chat experience, allowing users to share images and files seamlessly.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Gradient color customization for chat interfaces</td><td>Admins can apply gradient colors to the chat window header background component. The feature supports linear gradients using two colors that blend smoothly together, replacing the previous limitation of solid colors only. This enhancement allows admins to easily style and preview gradients across chat components, helping chats reflect the brand&#39;s digital identity without affecting functionality.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Cobrowse support for mobile browsers</td><td>Consumers can share their mobile web browser screens using Cobrowse while in video, voice, or messaging engagements with Zoom Contact Center agents. This feature supports all standard browsers on iOS, iPadOS, and Android devices. Consumers receive the same Cobrowse experience and functionality available on desktop browsers. This enhancement allows agents to assist consumers who use mobile devices to complete applications and forms during video, voice or messaging interactions. This feature must be enabled by Zoom.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080489\" rel=\"nofollow\"> Hub features </a> </span></th></tr><tr class=\"table-row\"><td>Changed feature</td><td>Default availability of Zoom Hub across all account types</td><td>\r\n<p>Zoom Hub is being included and enabled by default for all new and existing Zoom accounts to help streamline and simplify centralized access to and management of Zoom assets, such as recordings, documents, whiteboards, meeting summaries, and more. The option to disable Zoom Hub will be removed from the web portal settings. Zoom will enable Zoom Hub, and remove the option to disable it, for free customers and customers who purchased an account online (without Sales) on December 15, 2025. For all other Zoom accounts (excluding Zoom for Government and Zoom for Defense), Zoom will enable Zoom Hub (and remove the option to disable) on February 6, 2026.</p>\r\n<p>Learn more from <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0083732\" rel=\"nofollow\">frequently asked questions about Zoom Hub enablement for customers</a>.</p>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0081420\" rel=\"nofollow\">Video Management features</a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Transcript-level video search with timestamp playback</td><td>Searching across the entire video repository can include keywords to find specific content within video transcripts. The system automatically generates searchable transcripts when videos are uploaded or clips are recorded, indexing all content with precise timestamps. Search results display matches organized by relevance and timestamp location, allowing users to identify exactly where keywords appear in each video. Videos can automatically start playback from any search result timestamp, beginning 10 seconds prior to the matched content for context. This feature enables rapid content discovery and eliminates the need to manually review entire videos to locate specific information.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Shared Video Management links redirect to Zoom Workplace</td><td>Shared links to Video Management content automatically detect and launch the appropriate viewing environment. The system prioritizes opening links in the installed Zoom Workplace application across desktop, mobile, Zoom Rooms, and in-meeting scenarios, falling back to browser viewing when none of the options are available. Educational (EDU) users receive specialized handling that respects their Learning Management System (LMS) integration requirements, ensuring links open within their educational platform interface. This cross-platform enhancement streamlines video access and maintains consistent user workflows regardless of device or usage context.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Multi-language support for video management interface</td><td>Zoom Video Management features are available in multiple languages to support international users. The video management interface supports Spanish, French, German, Japanese, Indonesian, Korean, Simplified Chinese, Traditional Chinese, Italian, Dutch, and Arabic languages. Users can select their preferred language from the available options to navigate video management features. This multilingual support assists organizations in deploying video management solutions globally while maintaining native language accessibility for international teams.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to Zoom Video Management for adaptive streaming</td><td>Video playback automatically adjusts quality based on the user&#39;s internet connection. The platform supports multiple video formats including MP4, MOV, AVI, MKV, and WebM, with automatic transcoding to ensure broad device compatibility. Videos are delivered through adaptive streaming protocols that dynamically switch between quality levels without interrupting playback or causing buffering. Users can also adjust playback speeds from 0.5x to 2x for enhanced learning experiences and accessibility. This enhancement ensures students and viewers can continue watching content even with spotty internet connections.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatic transcript and smart chapters generation for recordings added to Video Management</td><td>Video Management automatically generates missing transcripts and smart chapters when recordings are added to channels. This ensures that all video content maintains consistent accessibility and navigation features regardless of whether these elements were created during the original recording process. The system detects recordings without existing transcripts or AI-generated chapters and immediately initiates the generation process upon channel addition. This enhancement provides comprehensive content processing across all Zoom platforms and meeting types, ensuring every managed video includes essential accessibility and organizational features.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Use dark mode only in the meeting side panel - EnableDarkRightPanel</td><td>Enabled by default, this policy will set the right side panel in meetings to display in dark mode only.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enroll device type for registration on the ZDM platform - EnrollDeviceType</td><td>This policy works in conjunction with SetEnrollToken4CloudMDM to register the device on the ZDM platform. If this setting is set to \\&#34;smartphone\\&#34;, the device can retrieve the list of available SME accounts from the ZDM platform and sign in with an SME account. The default setting is empty; there will be no impact on the app.</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enable the auto framing feature - EnableAutoFraming</td><td>Disabled by default, this policy allows admins to control the auto-framing feature for users. If this policy is set to true, auto-framing will be enabled. If this policy is not set, the app will use the default setting or user setting.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enable Journal Delete mode in SQLite - EnableDatabaseJournalDeleteMode</td><td>Disabled by default. When enabled, the Zoom desktop app will enable the &#39;journal_mode&#61;DELETE&#39; option in SQLite to enhance compatibility and performance in inefficient storage environments such as NFS or NAS. If this policy is disabled, the app will not enable this option in SQLite.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Disable the screenshot feature in the desktop app - DisableDesktopScreenshot</td><td>Disabled by default, admins can configure this policy to disable all screenshot functions on the Zoom desktop app. If this policy is disabled or not set, the app will use the default setting.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatically detect voice activity to create my notes - EnableAutoDetectedVoiceActivity</td><td>Enabled by default, the desktop app will notify the user when voice activity is detected on specified apps to generate AI Companion summaries and notes.</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with the virtual keyboard disappearing when sharing a screen on iPad</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with the meeting video flickering on iPad when expanding the Participants tab</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with the invitee list loading indefinitely when scheduling a meeting, preventing hosts from inviting participants to their meeting</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in Production Studio where after the share became private, panelists who previously had remote control permission still appeared in the presenter&#39;s &#34;Waiting for someone to control your screen&#34; message</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with search results from a Gmail account not loading when attempting to view from within the Zoom Workplace app</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue in which a subset of users received the error message &#34;You don&#39;t have Zoom Scheduler yet&#34; when attempting to access the Scheduler plugin when composing a new email</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with the code snippet feature missing from users&#39; custom shortcut options on chat compose</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved a formatting issue in custom disclaimers for users signing in to the desktop app</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue with emojis in channel names displaying as plain text instead of the intended emojis</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue with manual captions not recognizing a new paragraph when pressing the <strong>Enter</strong> key</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which changing the Active Directory password logged a user out of Zoom for Intune</td><td>Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users experienced a brief flash of the portrait image at the beginning of a recording when using the slides as background feature</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with the speaker view freezing in computer recordings</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Resolved an authentication issue when joining a meeting that required users to sign in to their Zoom accounts</td><td>iOS (Intune) <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue related to an interpreter&#39;s audio transcribed in automated captions</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where contacts did not populate correctly in the Zoom Phone keypad search bar</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with missing contact information when viewing a call queue from the <strong>Contacts</strong> tab</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with the font on meeting notifications</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Notes</strong>:</p>\r\n<ul><li>The <strong>Enhancements to meeting coach with participant engagement metrics</strong> feature has been pulled from release due to issues with deployment and will be available in another upcoming release.</li><li>The <strong>Support custom emojis in meeting</strong> feature was rolled back due to late bug discovery and will be available in another upcoming release.</li></ul>\r\n<h3 id=\"mcetoc_1jb0fuovd1k\">December 1, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.6.11 (23272)</td><td>6.6.11 (70003)</td><td>6.6.11 (6052)</td><td>6.6.11 (35438)</td><td>6.6.11 (35439)</td><td>6.6.11 (30245)</td><td>6.6.11 (30246)</td><td>6.6.11 (30247)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" />         </div>\r\n    </div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS                 </td></tr><tr class=\"table-row\"><td>Security enhancements</td><td>Windows</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j9vlgea75q\">November 17, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.6.10 (22255)</td><td>6.6.10 (69071)</td><td>6.6.10 (5815)</td><td>6.6.10 (35063)</td><td>6.6.10 (35064)</td><td>6.6.10 (29997)</td><td>6.6.10 (29998)</td><td>6.6.10 (29999)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Universal Link Callback support for automated logout on iOS</td><td>Healthcare organizations and enterprises using shared iOS devices can leverage automated logout functionality through Apple&#39;s Universal Link Callback (ULC) protocol in the Zoom Workplace app. This integration enables communication between the app and enterprise systems such as Imprivata Mobile Device Access (MDA) for triggering secure logout actions when devices are returned to docking stations. The feature performs complete session invalidation by clearing all credentials and configuration data without requiring shared API keys or sensitive information between applications.</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support for macOS Tahoe</td><td>With this update, macOS version 26 (Tahoe) is supported.</td><td>macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to mobile app long-press menu</td><td>From the mobile app&#39;s long-press menu on their device home screen, users will have options for <strong>Start voice recording</strong>, <strong>New call</strong>, and <strong>New message</strong>. Some existing meeting options are removed and My QR code is repurposed to scan codes instead of displaying them. Menu options display conditionally based on user licenses, with voice recording available to users with paid Meetings licenses and cloud recording capabilities, calling options for users with active Phone licenses, and messaging for users with Team Chat access.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meetings features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>In-meeting sign-in options</td><td>While in a meeting, user can sign in to their Zoom account from the profile avatar or meeting menu. A a native modal pop-up will appear, instead of being redirected to an external browser. The sign-in modal supports multiple authentication methods including email and password, Single Sign-On (SSO), Google, Apple, and Facebook. After successful authentication, the meeting session automatically refreshes without requiring users to leave or rejoin the meeting.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>GIPHY integration in meeting chat</td><td>Meeting participants can use GIPHY to send GIFs in meeting chat. Participants can access animated GIFs directly through the chat interface during meetings, regardless of <strong>Advanced Chat Encryption</strong> settings.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to auto update prompts</td><td>Users are no longer required to auto-update their Zoom Workplace app when launching the desktop application. The auto-update prompt appears after meetings end instead of at app startup. When multiple post-meeting prompts are triggered simultaneously, the client prioritizes showing only the update prompt and suppresses the meeting recap dialog. After users dismiss the auto-update prompt five times, the standard meeting recap dialog displays instead if enabled.</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to &#64;mention continuous meeting chat members who are not in the meeting</td><td>During a meeting, members of the Continuous Meeting Chat (CMC) can &#64;mention other members who are not currently participating in the meeting. CMC members can tag any other CMC member, while non-members can only tag users who are present in the meeting.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Expanded language support for automated captions on device</td><td>Automated captions on device support is expanding to include Spanish and French. Users can experience automated captions generated on their eligible devices in these additional languages. Automated captions on device requires Zoom desktop app version <strong>6.5.3</strong> or higher. <br /><strong>Note</strong>: This feature will not be immediately available, as it is dependent on a backend server update currently scheduled for November 23, 2025.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Team Chat Compose character and token limit enhancements</td><td>\r\n<p>Users can see a live character counter when composing messages with Zoom AI Companion, showing their input against the 1,000-character limit. If users exceed this limit in the compose box, a warning message appears in the pop-up but still allows them to proceed. For prompt inputs that exceed the limit, users receive a warning and the submit button is disabled to prevent incomplete processing.</p>\r\n<p>Additionally, when the output reaches the 350-token cap, the <strong>Make Longer</strong> button now displays a tooltip explaining that the message cannot be extended further due to size restrictions. These improvements provide clearer communication of input and output limits, reduce user frustration, and help ensure better message quality.</p>\r\n</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to continuous meeting chat for registration meetings</td><td>Meeting hosts can enable continuous meeting chat when scheduling meetings that require registration. When this option is turned on, a new standalone continuous meeting chat is created to save all in-meeting messages for future access. Participants are notified that their messages will be saved, and after the meeting, hosts receive approval cards to add attendees to the chat. This update helps maintain chat history and supports ongoing collaboration for registration-based meetings.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Transcript export and copying capabilities</td><td>Viewers can export a clip&#39;s full transcripts as SRT or VTT file using the <strong>Download transcript</strong> button shown in the transcript panel. Each transcript paragraph also includes a copy button, letting viewers quickly copy specific text segments to their clipboard. Both features respect existing viewer permissions and aim to help with content localization.</td><td>Windows<br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support delegation for creating clips with AI Companion custom avatars</td><td>The delegation feature is designed for users such as company executives or VIPs who need to delegate executive admins or assistants to generate clips on their behalf featuring the executive&#39;s custom avatar. Delegates receive a secure invitation and are granted limited access, restricted solely to clip generation. Delegates can only generate new clips using a previously created avatar and cannot view or modify avatar creation seed videos, settings, or face and voice data. The delegator will receive a notification whenever a delegate generates a clip, and delegation privileges can be revoked at any time.</td><td>Windows<br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to clip sharing playback control</td><td>Users can control when shared clips begin playing during meetings. When a clip is selected through the in-meeting clip picker, it loads but does not automatically start playing. Presenters must click the Play button to begin playback. This change aligns clip sharing behavior with other Zoom media sharing workflows like screen share with video. The enhancement prevents awkward starts and gives presenters better control over their presentation timing.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Custom avatar creation and management entry point</td><td>Users can create and manage custom avatars directly from the Clips main page on Zoom Workplace app for desktop. The feature provides an independent entry point that launches the same guided creation flow previously available only through the Text-to-Avatar page. Users can access the complete avatar creation and management experience without navigating away from their primary Clips workspace.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Audio preview for avatar scripts </td><td>Users creating Zoom Clips avatars with AI Companion can listen to an audio preview of their avatar script before generating the final video clip. The preview feature includes a dedicated button in the script editor that plays back the script using the selected avatar voice without requiring full video rendering. Users can generate multiple audio previews to test different wording, pacing, or tone adjustments before committing to the final avatar clip generation. This capability helps users refine their content and avoid regenerating clips due to script issues.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to create a clip directly from post-meeting recordings</td><td>Users can create clips directly from meeting recordings through the Meeting Card interface. A Create Clip button appears next to recording assets. Only Recording owners can access this clip creation functionality.</td><td>Windows<br />macOS<br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Voicemail and call handling settings management</td><td>Users can manage their call handling settings and voicemail greetings directly within the Zoom Phone client without accessing the web portal. The feature allows users to set call handling hours and configure settings for when calls are busy or not answered during business and closed hours. Users can record, upload, or use text-to-speech for voicemail greetings, with separate configurations available for different call scenarios. This feature focuses specifically on personal voicemail boxes and excludes shared extensions, holiday hours, and shared voicemail access. This enhancement streamlines the voicemail setup process by providing a centralized location for personal voicemail management within the primary application interface.</td><td>Windows<br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)<br />Zoom Phone Appliances</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhanced location service flexibility for Zoom Phone India</td><td>Account owners and admins can enable Zoom Phone India (ZPI) for users without mandating access for GPS location services. The platform collects location data from GPS services when available and enabled, and automatically falls back to IP address-based location determination when GPS is disabled or unavailable. For international roaming users, geo-fencing rules apply based on GPS location when accessible, otherwise defaulting to IP address location. This enhancement removes activation barriers for organizations with policies that prohibit location services on employee devices.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)<br />Desk phones</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support for Zoom Contact Center mobile app</td><td>Zoom Contact Center (ZCC) agents can now manage customer interactions directly from their iOS or Android mobile phone devices using the ZCC mobile app. This enhancement gives agents greater flexibility and mobility while maintaining high-quality service. Key capabilities include:\r\n<ul><li>Start and end work sessions from the mobile app</li><li>Update availability status in real time</li><li>Opt in or out of queues as needed</li><li>Handle voice engagements with full support for mobile call handling</li><li>Wrap up engagements efficiently, including notes and disposition tagging</li></ul>\r\nThis feature must be enabled by Zoom.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Incoming engagement handling on multiple platforms</td><td>Admins can configure how incoming engagements ring across multiple client locations when an agent is logged in on different devices at the same time. Configuration options include the Zoom Desktop App, Zoom Mobile App, Zoom Web App, Contact Center CTI Client, and PSTN. Admins can define which devices should ring for incoming engagements, while agents can view these settings and edit them if granted permission. This feature ensures a consistent experience for agents and helps minimize customer wait times. This feature must be enabled by Zoom.</td><td><br /><br />Windows <br />macOS <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)<br />CTI connector</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Disable manual calling using dialpad based on role</td><td>Admins can configure user roles that disable access to the dialpad in both the Zoom Contact Center desktop app and CTI connector. Users with dialpad restrictions can still initiate outbound calls through click-to-call functionality from CRM systems, address book contacts, and trusted applications. The dialpad interface is hidden or grayed out for restricted users, to prevent unauthorized use. This feature helps organizations maintain compliance with regulatory constraints that prohibit agents from dialing arbitrary phone numbers. This feature must be enabled by Zoom.</td><td>Windows<br />macOS <br />Linux <br />CTI connector</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Ability to edit global variables</td><td>Admins can allow agents to edit global custom and consumer system variables during active engagements and wrap-up for voice, video, messaging, and email interactions. Agents can update variable values directly in the engagement details panel, and the changes appear in to supervisors during engagement monitoring. Only the assigned agent can make edits while an engagement is active, and editing is disabled once engagement disposition is set. It also enables smoother CRM integration by letting agents send updated data to CRM objects such cases, without switching systems. This feature must be enabled by Zoom.</td><td>Windows<br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0081420\" rel=\"nofollow\">Video Management features</a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Share Video Management channels with Team Chat channels</td><td>Users can share Video Management channels directly with Team Chat channels through an enhanced share sheet with search functionality. When a video channel is shared, team members can access its shared content through the team channel chat&#39;s resources tab. Access permissions automatically sync with team membership, granting new members access when they join and removing access when they leave the team chat. This integration streamlines video content collaboration within existing team communication workflows.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to channel management with collaborator invitation system</td><td>Channel owners can invite collaborators to join their channels through a consent-based email invitation flow. Invited collaborators receive detailed information about joining the channel before accepting the invitation. Once collaborators accept and join a channel, they gain full editing permissions for all content within that channel, including videos and metadata. Channel owners can view invitation status, send reminders for pending invitations, and see collaborator lists displayed in video management interfaces. This feature supports secure collaborative content management while providing clear visibility of editing permissions across channels.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> MSI/PLIST/GPO/MDM features </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Stop UAC prompts for Mesh firewall rules - DisableWindowsMeshUAC</td><td>Disabled by default, this policy allows admins to prevent the client from triggering User Account Control (UAC) prompts when adding firewall rules required for Mesh. If this policy is disabled, the client may trigger a UAC prompt.</td><td>Windows</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Set preferences for client exit - ExitPreference</td><td>With this policy, you can choose if the Zoom desktop app minimizes to the system tray when the main window is closed or if the app fully exits when the main window is closed. If this policy is not set, the desktop app will use the default setting, which is to minimize to the system tray when the main window is closed.</td><td>Windows <br />Linux</td></tr></tbody></table>\r\n</article>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr><tr class=\"table-row\"><td>Resolved an issue where pressing the Space key dismissed inbound engagements in Zoom Contact Center</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue for a subset of users in regarding the embedded Zoom app closing automatically when agents answer a call in Zoom Contact Center</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the screen share dialog window displayed incorrectly or appeared garbled on Linux Ubuntu systems using Wayland</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the auto-call feature did not use the selected video call ringtone in the desktop app settings, and instead played the default ringtone</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which meeting entries on the calendar were not synced correctly</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the Zoom app was consuming excessive CPU and GPU resources on devices running macOS Tahoe 26</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the live streaming message displayed the generic text &#34;This meeting content is being sent to the custom live stream service&#34; instead of &#34;This meeting content is being sent to {customName}&#34;</td><td>Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with Production Studio video controls becoming desynchronized after temporary connection loss</td><td>Windows <br />macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with the Zoom app not syncing with buttons correctly on Apple AirPods Pro 3</td><td>macOS</td></tr><tr class=\"table-row\"><td>Resolved an issue with email synchronization between Zoom Mail and Office 365</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue causing the system to freeze when joining a Zoom meeting or breakout room</td><td>Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue where pink lines were visible on external camera feeds while using ATEM Mini Pro</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue in which channel meeting external participants were being removed from the invitee list if they were added from an external calendar</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where emails sent to a mailing list from external sources did not retain their original external recipients</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where notifications for SMS messages were being doubled in the badge icon on the Windows taskbar</td><td>Windows</td></tr><tr class=\"table-row\"><td>Resolved an issue for a subset of users whose emergency addresses for Zoom Phone were not updating properly</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>Resolved an issue in which the iOS app displayed different emojis than the ones actually enabled for use</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue where users were still receiving images via SMS when the <strong>Allow receiving attachments</strong> setting was disabled by admin</td><td>iOS <br />iOS (Intune)</td></tr><tr class=\"table-row\"><td>Resolved an issue with not being able to select multiple custom share line appearance ringtones in the Zoom app</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<p><strong>Note</strong>: The following features have been pulled from deployment and will be available in an upcoming release:</p>\r\n<ul><li><strong>Enhancements to the Contacts tab</strong></li><li><strong>Multi-language support for video management interface</strong></li><li><strong>Enhancements to Zoom Video Management for adaptive streaming</strong></li><li><strong>Enhancements to adding external users to continuous meeting chat via post-meeting approval card<br /></strong></li><li><strong>Comprehensive mobile alerts for call queue management</strong></li></ul>\r\n<h3 id=\"mcetoc_1j97pbkokf\">November 4, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>--</td><td>6.6.8 (34695)</td><td>6.6.8 (34696)</td><td>--</td><td>--</td><td>--</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fix</td><td>Android <br />Android (Intune)</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j8qvahu4i\">October 30, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>--</td><td>--</td><td>--</td><td>6.6.7 (34585)</td><td>6.6.7 (34586)</td><td>6.6.7 (29432)</td><td>6.6.7 (29433)</td><td>6.6.7 (29434)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j89aadce2h\">October 27, 2025</h3>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.6.6 (19875)</td><td>6.6.6 (67409)</td><td>6.6.6 (5306)</td><td>6.6.6 (34426)</td><td>6.6.6 (34427)</td><td>6.6.6 (29264)</td><td>6.6.6 (29265)</td><td>6.6.6 (29266)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>Resolved issues</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-row\"><td>Minor bug fixes</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune) <br />visionOS</td></tr></tbody></table>\r\n</article>\r\n<h3 id=\"mcetoc_1j84030eha5\">October 22, 2025</h3>\r\n<p><strong>Note</strong>: This release was originally scheduled for October 20, but was delayed by two days.</p>\r\n<h4>Full versions</h4>\r\n<article>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Windows</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">macOS</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Linux</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Android (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">iOS (Intune)*</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">visionOS</th></tr></thead><tbody><tr class=\"table-row\"><td>6.6.5 (19369)</td><td>6.6.5 (67181)</td><td>6.6.5 (5215)</td><td>6.6.5 (34303)</td><td>6.6.5 (34304)</td><td>6.6.5 (29123)</td><td>6.6.5 (29124)</td><td>6.6.5 (29125)</td></tr></tbody></table>\r\n</article>\r\n<p>*The mobile releases require additional approval from their respective app stores and may take a few additional days to be available for download.</p>\r\n<h4>New, enhanced, and changed features</h4>\r\n<article class=\"table-container sortable searchable\">\r\n<div class=\"table-search-container\">\r\n<div class=\"table-search-component\">\r\n<div class=\"table-search-icon\"> </div>\r\n<input class=\"table-search\" type=\"text\" /></div>\r\n</div>\r\n<table class=\"responsive-table\"><thead><tr class=\"table-head-row\"><th class=\"short-text-col\" tabindex=\"0\" data-col=\"0\" aria-sort=\"none\">Type</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"1\" aria-sort=\"none\">Feature title</th><th class=\"long-text-col\" tabindex=\"0\" data-col=\"2\" aria-sort=\"none\">Description</th><th class=\"short-text-col\" tabindex=\"0\" data-col=\"3\" aria-sort=\"none\">Platforms</th></tr></thead><tbody><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\">General features</span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Call a Room feature relocated to overflow menu on mobile</td><td>Eligible users will find the <strong>Call a Room</strong> meeting action moved from the mobile <strong>Home</strong> tab&#39;s main action bar to the overflow actions menu. This change addresses interface crowding that occurred when both <strong>Call a Room</strong> and <strong>Record</strong> features were visible simultaneously, which previously pushed the record feature off screen.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Redesigned video settings interface with improved appearance controls</td><td>Users can access a redesigned video settings interface with the <strong>Camera</strong> tab renamed to <strong>Video</strong> and separate sections for camera and appearance settings. Camera settings include options such as <strong>HD</strong>, <strong>Original ratio</strong>, and <strong>Mirror my video preview</strong> (previously Mirror my video). Appearance settings include <strong>Touch up my appearance</strong>, <strong>Adjust for low light</strong>, <strong>Portrait lighting</strong>, and <strong>Auto-framing</strong>.</td><td>Windows <br />macOS</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0080363\" rel=\"nofollow\"> Meetings features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Task creation from meeting chat messages</td><td>Meeting participants can create and update tasks from the in-meeting chat using a new Tasks option. For any given meeting chat message, the meeting participant can navigate to the <strong>More</strong> menu and select <strong>Create task</strong>. A Zoom Tasks modal opens within the meeting, allowing participants to convert chat discussions into actionable items without leaving the meeting interface.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Meeting host control for Smart name tags from desktop app</td><td>\r\n<p>Meeting hosts can create and edit Smart name tags generated by Zoom Rooms, during a meeting, directly from their Zoom Workplace desktop app. Co-hosts can edit the speaker tags as well. All Smart name tag changes sync across meeting features including closed captions, live transcripts, AI Companion, and cloud recording transcripts. If both Zoom Room users and meeting hosts make edits simultaneously, the most recent change is applied.</p>\r\n<p><strong>Note</strong>: This feature will not be immediately available, as it is dependent on a Zoom Room release currently scheduled for November 3, 2025.</p>\r\n</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to meeting timeout and duration experiences</td><td>For paid users, if no activity including recording, live streaming, or additional participants are detected after 55 minutes, a 5 minute countdown modal will appear. Users can choose to extend the meeting, end it immediately, or disable the inactivity timer entirely. Users can manually disable or enable the inactivity timer from the Zoom Workplace app &gt; <strong>Settings</strong> &gt; <strong>Meetings &amp; webinars</strong> &gt; <strong>Advanced</strong> &gt; <strong>Advanced meeting</strong> &gt; <strong>Do not automatically end meetings after inactivity</strong>.</td><td>Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Optimize Slide Control with Office API</td><td>When enabled, this feature allows the local presenter to have the ability to interact with other applications without interfering with the remote <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0061986#h_59816168783111761168424471\" rel=\"nofollow\">slide control</a> for PowerPoint presentations on Windows.</td><td>Windows</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0064537\" rel=\"nofollow\"> Team Chat features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Usability enhancement for editing messages with images and files on mobile app</td><td>Users can add and remove images and attachments when editing messages on mobile app. The attachments are embedded directly into the compose box input field and become visible when expanded. Users can manage attachments and stickers while editing messages, matching the functionality previously available only on desktop app. This enhancement improves mobile usability and brings message editing closer to the desktop experience.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Unified conversation history for 1:1 instant meetings and side chats</td><td>To ensure real-time synchronization and a seamless transition between meeting chat and direct messages (DMs), DM history is now preloaded into the meeting chat, and any messages sent during the meeting are saved back into the DM. This applies in the following scenarios:\r\n<ul><li>When an instant 1:1 meeting is started from a DM or profile card.</li><li>When a user engages in a 1:1 side chat within a larger continuous meeting chat (CMC).</li></ul>\r\nIf no existing DM exists between the two users (but they are contacts), a new DM will be created. This enhancement provides a unified conversation history, allowing users to continue discussions seamlessly in one place. Both users must be on the new version of the client, and CMC must be enabled for this feature to function. <strong>Note</strong>: This feature will be available to all free accounts starting October 20 and will roll out to all paid accounts on October 23.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Reply directly from notifications on mobile app</td><td>Users can reply to Zoom Team Chat messages and Zoom meeting reminders directly from the notifications they receive on the mobile app. By tapping <strong>Reply</strong> in the notification, they can open a text input field, type a response, and send it without opening the Zoom app.\r\n<ul><li><strong>For chat messages received</strong>:\r\n<ul><li><strong>iOS</strong>: Long-press the chat notification to display options to <strong>Reply</strong> or <strong>Like</strong> the message.</li><li><strong>Android</strong>: Expand the notification to reveal the <strong>Reply</strong> and <strong>Like</strong> options.</li></ul>\r\n</li><li><strong>For meeting notifications</strong>:\r\n<ul><li><strong>iOS</strong>: Long-press the meeting notification to view quick response options such as <strong>Be there in 5 mins</strong>, <strong>I&#39;m running late</strong>, or <strong>Won&#39;t be able to join</strong>, or type a custom message.</li><li><strong>Android</strong>: Expand the meeting notification to access the same preset responses and type a message directly without opening the app.</li></ul>\r\n</li></ul>\r\nThis feature enables faster communication, reduces context switching, and helps maintain productivity.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Remove &#34;[User] joined/left the meeting group chat&#34; system messages</td><td>Users will no longer see system messages indicating when participants join or leave the meeting group chat in continuous meeting chat enabled sessions. Previously, meetings with fewer than 20 participants displayed individual join/leave notifications, while larger meetings showed a message about disabled notifications due to participant volume. The system removes both types of system messages to align with the behavior of meetings without continuous meeting chat and mobile applications. This enhancement reduces chat clutter and provides a cleaner user experience.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Improved channel unread summary link color</td><td>The link color in channel unread summary outputs has been updated for dark mode, enhancing readability and ensuring consistency with the established style.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Enhancements to thread message translation</td><td>Users can translate entire message threads with a single action using the new <strong>Translate thread to {language}</strong> option that appears on the first message in a thread. When activated, all messages in the thread are translated simultaneously into the selected language. Users can toggle between the original and translated versions of messages at any time, with the translated state applying consistently across the entire thread.</td><td>Windows<br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Context-aware search functionality within chat and channel views on mobile app</td><td>Users can search for messages within their current chat or channel context through a persistent search entry point available directly in individual conversation views on mobile app. The search functionality automatically preselects the currently open chat or channel as the default search scope, eliminating the need for manual filter selection. Users have the flexibility to adjust or remove the contextual filter if they want to expand their search beyond the current conversation. The interface clearly labels the search context to help users understand which conversation is being searched. This feature reduces the steps required to find relevant messages within specific conversations.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Automatic message resending</td><td>Users can automatically resend failed messages when network connectivity is restored. When users attempt to send messages during offline or weak network conditions, the system will queue these messages and automatically send them once a stable connection is reestablished. During offline mode, users will see a toast notification explaining which types of messages will be sent automatically. Messages that cannot be sent automatically will display a failed indicator when the user comes back online. This feature currently supports messages without attachments, eliminating the need for users to manually resend each failed message.</td><td>iOS<br />iOS (Intune)<br />Android<br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0068160\" rel=\"nofollow\"> Clips features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Stream recently viewed clips in meetings</td><td>Users can access <strong>Recent</strong> in addition to <strong>My clips</strong> and <strong>Shared with me</strong> when streaming clips during meetings or webinars. This update allows them to stream recently viewed clips, as long as they have the required view permissions.</td><td>Windows <br />macOS <br />Linux</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Optional clip link sharing in meeting chat</td><td>Users have the option to prevent clip links from being automatically shared in continuous meeting chat when streaming clips during Zoom Meetings. This new setting in the clip picker addresses scenarios where presenters want to show clips without providing ongoing access to the content. The feature helps users avoid exposing clip links to unintended participants or situations where content should only be viewed during the live presentation.</td><td><br />Windows <br />macOS <br />Linux <br />iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Clips avatars support for mobile devices</td><td>Mobile users can create Clips avatars using text-to-avatar generation in their mobile device. This can be done using the Web portal or the Zoom Workplace mobile app. Mobile users access the same avatar generation workflow available on desktop.</td><td>iOS <br />iOS (Intune) <br />Android <br />Android (Intune)</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0062333\" rel=\"nofollow\"> Phone features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Support for Zoom Phone AI and transcription language expansion</td><td>Zoom Phone supports five additional languages—Hindi, Tamil, Telugu, Bengali, and Dutch—across multiple AI-powered features. This enhancement expands language availability for Call summary with AI Companion, Voicemail Tasks with AI Companion, and Voicemail Prioritization with AI Companion, as well as live call transcription, call recording transcription, voicemail transcription, and Text-to-Speech (TTS) services. This feature allows users and admins to select from a broader range of languages, improving accessibility and communication. <strong>Note</strong>: These languages are available for users on version 6.5.5 or later.</td><td>Windows <br />macOS <br />Linux <br />iOS<br />Android<br />Zoom Phone Appliances</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Play ringtones on secondary audio device for Linux</td><td>Users working on Linux can configure Zoom Phone to play ringtones through a secondary audio device. This capability addresses a common challenge where calls might be missed when a user&#39;s primary headset is not being worn. The setting can be accessed in the Zoom Workplace app settings under the Audio &gt; Speaker section, allowing users to specify which secondary device should play incoming call notifications. By enabling ringtone playback on an additional audio output, this feature helps ensure important calls are not missed.</td><td>Linux</td></tr><tr class=\"table-row\"><td>Changed feature</td><td>Continuous ringing for simultaneous call queue members</td><td>Call queue members experience continuous ringing during simultaneous call queue routing when the maximum wait time exceeds 30 seconds. The previous 5-second pause that occurred every 30 seconds has been reduced to 500 milliseconds, creating an uninterrupted ringing experience. The enhancement eliminates user confusion caused by the extended pause, which previously made call recipients think calls had ended. This change reduces missed calls and improves call handling reliability in busy work environments. <strong>Note</strong>: New customers will have this setting enabled by default. Existing customers can request Zoom to enable this feature. This feature must be enabled by Zoom.</td><td><br />Windows <br />macOS <br />Linux <br />iOS<br />Android<br />Zoom Phone Appliances</td></tr><tr class=\"table-divider-row\"><th colspan=\"100%\"><span class=\"divider-text\"> <a href=\"https://support.zoom.com/hc/en/article?id&#61;zm_kb&amp;sysparm_article&#61;KB0067626\" rel=\"nofollow\"> Contact Center features </a> </span></th></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>Group SMS messaging</td><td>Agents can now include multiple participants in SMS engagements, supporting up to three additional phone numbers beyond the primary consumer. Both internal employees and external users can be added to outbound group conversations. Inbound group SMS messages are also supported when consumers send messages to multiple recipients. This enhancement supports collaborative customer service scenarios where multiple team members or consumer participants need to be part of the same conversation. No additional admin changes are required to enable this feature for agents.</td><td><br />Windows <br />macOS</td></tr><tr class=\"table-row\"><td>New or enhanced feature</td><td>General availability for setting agent&#39;s next status while occupied</td><td>Agents can specify their next status while their agent status is set to an <strong>Occupied</strong> state. When an agent is <strong>Occupied</strong>, they can set their status to <strong>Ready</strong> or <strong>Not Ready</strong>, which will take effect once they are no longer <strong>Occupied</strong> with current engagements. This feature provides smoother agent transitions between their work statuses during the day. Supe

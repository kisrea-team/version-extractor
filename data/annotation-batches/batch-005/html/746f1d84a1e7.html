        <script>window.__CDN_DISPATCH__={"kling-web":["v1-kling.kechuangai.com","v2-kling.kechuangai.com"]}</script><script charset="UTF-8">window['kConf_ytech.klingWeb.devEnterpriseMembershipGuideInfo_18n']={"en":{"footerNote":"Purchase Enterprise Plan now to enjoy special offers. If the current plans don't meet your needs, custom solutions are also available—please contact our sales team for more information.","highlightItems":["Create without APIs: Skip complex API integration. Team members can log in to a dedicated platform and start creating right away — faster onboarding, lower operational friction.","Enterprise-ready services: Supports enterprise verification, corporate payment, and centralized purchasing, with dedicated business support to better fit enterprise finance workflows and compliance requirements.","Granular asset management: Three-level permission management across enterprise, project, and member. Centrally manage enterprise assets and allocate resources as needed with greater precision.","Upgraded creative capabilities: Enhanced creation capabilities with support for high concurrency, native 4K output, and more subject-reference creation options. Get early access to new features and create more efficiently.","Intellectual property protection: All creative outputs belong to the enterprise. Kling AI strictly follows data governance standards and never uses enterprise data for model training, giving your team greater confidence and peace of mind."],"highlightsTitle":"Key Highlights","intro":"Dear Kling AI enterprise users, thank you for your continued trust and support. We're excited to officially launch our new Enterprise Plan. Whether you're a small or medium-sized business, a large enterprise, or a professional creative team, the Enterprise Plan gives you a centralized management system to allocate and control assets with precision across projects and team members. Team members can create directly without API integration, helping organizations activate resources more efficiently and significantly improve creative productivity.","sections":[{"description":"Log into「Enterprise Admin System」to submit your enterprise verification. Upon approval, you'll unlock exclusive enterprise benefits including corporate payment, invoicing, and dedicated business liaison services.","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/business-verification-en.490208feb768aa66.png"],"subtitle":"Complete enterprise credential verification to unlock enterprise-level service privileges","title":"Enterprise Verification"},{"description":"Funds are added to a unified enterprise account, where administrators can centrally purchase and allocate assets based on project and team needs.","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/account-top-up-1-en.2ed9e4ff25555c94.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/account-top-up-2-en.f01483bef8ecf331.png"],"subtitle":"One-stop top-up and management, providing stable support for team creation","title":"Account Top-Up"},{"bullets":["Project Management: Supports creating and editing project information.","Member Management: Supports adding members to the enterprise or projects, and managing member roles."],"description":"Purchase membership assets centrally and distribute them across different projects and members — enabling \"one purchase, all use.\" Before allocating assets, you'll need to create projects and add members first.","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/member-bulk-purchase-1-en.9a1f5a10dd5f29f9.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/member-bulk-purchase-2-en.2a5279cf2199154f.png"],"subtitle":"Purchase in bulk, and allocate flexibly as needed","title":"Centralized Procurement"},{"description":"The enterprise centrally manages all assets under its account. Assets can be allocated by project and further distributed to individual members — enabling on-demand resource allocation and efficient circulation, minimizing waste.","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/assets-admin-1-en.e67bc2917090eb77.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/assets-admin-2-en.6bb4c6cd4f0c57b6.png"],"title":"Asset Management"}],"title":"Kling AI Enterprise Plan — Now Live!","usageGuideTitle":"Enterprise Plan User Guide"},"ja":{"footerNote":"今なら企業会員お得なキャンペーンを実施中です。既存プランでニーズを満たせない場合は、用途に合わせたカスタムプランの作成にも対応しております。ぜひ営業チームまでお問い合わせください。","highlightItems":["API 不要で制作可能：複雑な API 接続作業が不要、専用プラットフォームにログインするだけで簡単に制作でき、導入のハードルが低い","企業専用サポート：企業認証、企業振込、一括購入に対応。専任営業が窓口となり、企業の経理業務やコンプライアンス要件にワンストップで対応、安心してご利用いただけます","詳細なリソース管理：企業・プロジェクト・メンバーの 3 段階権限管理を搭載。企業のリソースを統制し、必要分だけ配分でき、細やかな運用が実現","制作機能強化：クリエイティブ性能が全面的に強化され、高負荷同時実行、ネイティブ 4K 直接出力、複数オブジェクト参照生成に対応。新機能を先行体験でき、制作スピードが向上","知的財産保護：作成した成果物の知財権は企業に帰属。プラットフォームは厳格なデータ規範を順守し、企業データをモデル学習に転用することは一切ございません"],"highlightsTitle":"主な機能の特長","intro":"Kling AI 法人ユーザーの皆様、日頃よりご愛顧とご信頼を賜り、誠にありがとうございます。この度、新たな「企業会員」サービスを正式リリースいたしました。中小企業、大規模グループ、専門クリエイティブチームを問わず、法人管理システムを活用して会員リソースを一括管理・詳細に制御し、プロジェクトやメンバーへ必要に応じて配分可能です。メンバーは API を利用せずに制作を行え、リソースを効率的に活用し、チームの制作生産性を大幅に向上させます。","sections":[{"description":"企業管理画面より認証申請を行い、審査通過後は企業限定特典を利用可能。企業振込、領収書発行、専任営業の対応サービスをご活用いただけます。","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/business-verification-en.490208feb768aa66.png"],"subtitle":"企業資格審査を完了すると、企業向け機能が解放されます。","title":"企業認証"},{"description":"チャージされた資金は企業アカウントに集約され、管理者がプロジェクトやメンバーごとにアセットを配分できます。","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/account-top-up-1-en.2ed9e4ff25555c94.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/account-top-up-2-en.f01483bef8ecf331.png"],"subtitle":"ワンストップでのチャージ管理により、チームの制作活動を安定的にサポートします。","title":"アカウントチャージ"},{"bullets":["「プロジェクト管理」：プロジェクト情報の作成・編集が可能","「メンバー管理」：企業およびプロジェクトへのメンバー追加、役割設定が可能"],"description":"一括購入したアセットをプロジェクトやメンバーに割り当てることで、「一人が購入し、全員が利用」する運用を実現できます。配分前にはプロジェクトの作成とメンバー追加が必要です。","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/member-bulk-purchase-1-en.9a1f5a10dd5f29f9.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/member-bulk-purchase-2-en.2a5279cf2199154f.png"],"subtitle":"会員をまとめて購入し、柔軟に配分可能。","title":"会員の一括購入"},{"description":"企業アカウント内のアセットを一元管理し、プロジェクト単位での配分や個人への割り当ても可能。リソースを効率的に活用し、無駄を防ぎます。","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/assets-admin-1-en.e67bc2917090eb77.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/assets-admin-2-en.6bb4c6cd4f0c57b6.png"],"title":"アセット管理"}],"title":"Kling AI 企業会員新登場！","usageGuideTitle":"企業会員ご利用ガイド"},"ko":{"footerNote":"지금 기업 멤버십을 구매하시면 특별 할인 혜택도 함께 누릴 수 있습니다. 현재 제공되는 멤버십 플랜으로 요구사항을 충족하기 어려운 경우, 맞춤형 플랜 설계도 지원해 드립니다. 자세한 상담을 원하시면 문의를 남겨 주세요.","highlightItems":["API 없이 바로 창작: 복잡한 API 연동 과정 없이 전용 플랫폼에 로그인만 하면 바로 창작할 수 있습니다. 더욱 쉽고 빠르게 시작해 보세요.","기업 전용 서비스: 기업 인증, 법인 결제, 통합 구매를 지원하며, 전담 비즈니스 매니저를 통해 기업의 재무 프로세스 및 컴플라이언스 요구사항에 맞춘 원스톱 서비스를 제공합니다.","정교한 자산 관리: 기업·프로젝트·구성원 단위의 3단계 권한 관리 체계를 제공하여 기업 자원을 통합적으로 관리하고, 필요에 따라 유연하게 배분할 수 있습니다.","향상된 창작 역량: 고성능 창작 환경을 제공하며, 높은 동시 처리 성능, 네이티브 4K 출력, 다중 레퍼런스 기반 창작을 지원합니다. 또한 신규 기능을 가장 먼저 체험할 수 있어 더욱 효율적인 창작이 가능합니다.","지식재산권 보호: 창작 결과물의 권리는 기업에 귀속됩니다. 또한 플랫폼은 엄격한 데이터 관리 정책을 준수하며, 기업 데이터를 모델 학습에 활용하지 않아 안심하고 창작할 수 있습니다."],"highlightsTitle":"핵심 기능 및 장점","intro":"Kling AI 기업 고객 여러분, 항상 Kling AI를 믿고 이용해 주시고 아낌없는 성원과 관심을 보내주셔서 진심으로 감사드립니다. 오늘 저희는 새로운 「기업 멤버십」 서비스를 공식 출시하게 되었습니다! 중소기업, 대기업 그룹, 전문 크리에이티브 팀 등 어떠한 조직 형태의 기업이라도 기업 관리 체계를 기반으로 멤버십 자산을 통합적으로 운영하고 관리할 수 있습니다. 또한 멤버십 자산을 프로젝트 및 구성원에게 필요에 따라 배분하여 더욱 체계적이고 효율적으로 활용할 수 있습니다. 구성원은 API를 호출하지 않고도 직접 창작을 진행할 수 있으며, 이를 통해 자원을 효율적으로 활성화하고 활용도를 높일 수 있습니다. 또한 기업은 멤버십 자산에 대한 정교한 관리와 통제를 실현할 수 있으며, 팀 전체의 콘텐츠 제작 효율과 협업 생산성을 크게 향상시킬 수 있습니다.","sections":[{"description":"기업 관리자 페이지에서 기업 인증을 진행할 수 있습니다. 인증 심사를 통과하면 기업 전용 혜택이 활성화되며, 법인 결제, 세금계산서 발행 및 전담 비즈니스 지원 서비스를 이용할 수 있습니다.","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/business-verification-en.490208feb768aa66.png"],"subtitle":"기업 인증을 완료하여 엔터프라이즈급 서비스 권한을 활성화하세요.","title":"기업 인증"},{"description":"충전된 금액은 기업 통합 계정으로 입금되며, 기업 관리자는 프로젝트 및 구성원의 필요에 따라 자산을 통합 구매하거나 맞춤형으로 배분할 수 있습니다.","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/account-top-up-1-en.2ed9e4ff25555c94.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/account-top-up-2-en.f01483bef8ecf331.png"],"subtitle":"원스톱 충전 및 관리 기능을 통해 팀의 창작 활동을 안정적으로 지원합니다.","title":"계정 충전"},{"bullets":["「프로젝트 관리」: 프로젝트 생성 및 프로젝트 정보 수정 기능을 지원합니다.","「구성원 관리」: 구성원을 기업 또는 프로젝트에 추가할 수 있으며, 구성원의 역할 및 권한을 조정할 수 있습니다."],"description":"멤버십 자산을 필요에 따라 통합 구매하고, 서로 다른 프로젝트 및 구성원에게 배분할 수 있어 「한 사람이 구매하고, 전 구성원이 함께 사용하는」 운영 방식을 실현할 수 있습니다. 자산을 배분하기 전에 먼저 프로젝트를 생성하고 구성원을 추가해야 합니다.","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/member-bulk-purchase-1-en.9a1f5a10dd5f29f9.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/member-bulk-purchase-2-en.2a5279cf2199154f.png"],"subtitle":"기업 멤버십을 통합 구매하고, 필요에 따라 유연하게 배분할 수 있습니다.","title":"멤버십 통합 구매"},{"description":"기업은 계정 내 자산을 통합적으로 관리할 수 있으며, 프로젝트 단위로 자산을 배분할 수 있습니다. 또한 구성원 개인에게도 자산을 배분할 수 있어, 자원을 필요에 따라 유연하게 배치하고 효율적으로 활용할 수 있습니다. 이를 통해 자산의 효율적인 순환을 지원하고 자원 낭비를 방지할 수 있습니다.","images":["https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/assets-admin-1-en.e67bc2917090eb77.png","https://s15-kling.klingai.com/kos/s101/nlav112918/kling-web-tob/images/enterprise-membership-guide/assets-admin-2-en.6bb4c6cd4f0c57b6.png"],"title":"자산 관리"}],"title":"Kling AI 기업 멤버십 신규 출시!","usageGuideTitle":"기업 멤버십 이용 가이드"},"zh":{"footerNote":"现在购买企业会员，还能享受超值优惠，若当前会员方案未能满足您的需求，我们也支持按需定制，欢迎留咨商务团队进行沟通～","highlightItems":["免 API 创作：告别复杂接口接入流程，直登专属平台即可便捷创作，上手更轻松","企业专属服务：支持企业认证、对公支付 、集中采购，配备专属商务对接，一站式适配企业财务流程与合规需求，合作更省心","精细化资产管控：企业/项目/成员三级权限管理，支持统一管控企业资源，按需分配，管理更精细","创作能力升级：创作能力全面进阶，支持高并发、原生4K直出、更多主体参考创作，抢先体验新功能，创作更高效","知识产权保障：创作成果归属企业，平台严守数据规范，绝不挪用企业数据训练模型，创作更安心"],"highlightsTitle":"核心功能亮点","intro":"亲爱的可灵 AI 企业用户，感谢大家一直以来的信任与陪伴。今天我们正式推出全新的「企业会员」服务！无论您是中小企业、大型集团还是专业创作团队，均可依托企业管理体系，统筹调配、精细化管控会员资产，按需分配至项目及成员。成员无需调用 API 即可创作，高效盘活资源，大幅提升团队创作效率～","sections":[{"description":"在企业后台进行企业认证，通过企业认证审核后，即可开通专属企业权益，享受对公支付、开票及专属商务对接服务","images":["https://p2-kling.klingai.com/kcdn/cdn-kcdn112452/kling-web-tob/images/enterprise-membership-guide/business-verification-zh.4314830cdf72297b.png"],"subtitle":"完成企业资质验证，解锁企业级服务权限","title":"企业认证"},{"description":"充值后资金将进入企业统一账户，企业管理员可按项目、成员需求集中采购或定制资产","images":["https://p1-kling.klingai.com/kcdn/cdn-kcdn112452/kling-web-tob/images/enterprise-membership-guide/account-top-up-1-zh.df8732fd0fa439e3.png","https://p2-kling.klingai.com/kcdn/cdn-kcdn112452/kling-web-tob/images/enterprise-membership-guide/account-top-up-2-zh.7fb27b824559b59a.png"],"subtitle":"一站式充值管控，为团队创作提供稳定支持","title":"账户充值"},{"bullets":["「项目管理」：支持创建/修改项目信息","「成员管理」：支持添加成员至企业、项目，以及调整成员身份"],"description":"按需集中采购会员资产并支持分配至不同项目、成员，实现 “一人采购，全员使用”，分配资产前需先创建项目、添加成员","images":["https://p1-kling.klingai.com/kcdn/cdn-kcdn112452/kling-web-tob/images/enterprise-membership-guide/member-bulk-purchase-1-zh.8f675fad71b4b96a.png","https://p1-kling.klingai.com/kcdn/cdn-kcdn112452/kling-web-tob/images/enterprise-membership-guide/member-bulk       var pathname = window.location.pathname
      var normalizedPath = pathname

        normalizedPath = normalizedPath.slice(0, -1)
      }
      var canonicalUrl = window.location.origin.replace(/\/+$/, '') + normalizedPath

      var link = document.getElementById('kling-canonical')
      if (!link) {
        link = document.querySelector("link[rel='canonical']")
      }
      if (link) {
        link.href = canonicalUrl.split('?')[0].split('#')[0]

        var meta = document.querySelector(selector)
        if (!meta) {
          meta = document.createElement('meta')
          Object.keys(attrs).forEach(function (key) {

          document.head.appendChild(meta)

        var labelOverrides = {
          dev: 'Developer Platform',

          'claw-auth': 'Claw Auth'

          return labelOverrides[segment]

          .filter(Boolean)

            var lower = word.toLowerCase()
            if (lower === 'ai' || lower === 'api') {

  <h1 id="kling-seo-h1" class="kling-seo-h1">Kling AI Developer Platform</h1>
  <script>
      ; (function () {
        var labelOverrides = {
          dev: 'Developer Platform',
          pricing: 'Pricing',
          'claw-auth': 'Claw Auth'
        }

        function toTitleText(segment) {
          if (labelOverrides[segment]) {
            return labelOverrides[segment]
          }
          return segment
            .split(/[-_]+/)
            .filter(Boolean)
            .map(function (word) {
              if (word.toLowerCase() === 'ai' || word.toLowerCase() === 'api') {
                return word.toUpperCase()
              }
              return word.charAt(0).toUpperCase() + word.slice(1)
            })
            .join(' ')
        }

        function buildSeoH1(pathname) {
          var normalizedPath = (pathname || '/dev').split('?')[0].split('#')[0]
          if (normalizedPath !== '/' && normalizedPath.endsWith('/')) {
            normalizedPath = normalizedPath.slice(0, -1)
          }
          if (normalizedPath === '/dev') {
            return 'Kling AI Developer Platform'
          }

          var parts = normalizedPath
            .replace(/^\/+/, '')
            .split('/')
            .filter(function (part) {
              return part && part !== 'dev' && part !== 'new' && part !== 'edit'
            })
            .map(toTitleText)

          return parts.length
            ? 'Kling AI Developer ' + parts.join(' ')
            : 'Kling AI Developer Platform'
        }

        function updateSeoH1() {
          var heading = document.getElementById('kling-seo-h1')
          if (heading) {
            heading.textContent = buildSeoH1(window.location.pathname)
          }
        }

        updateSeoH1()

        var rawPushState = window.history.pushState
        var rawReplaceState = window.history.replaceState
        window.history.pushState = function () {
          rawPushState.apply(this, arguments)
          updateSeoH1()
        }
        window.history.replaceState = function () {
          rawReplaceState.apply(this, arguments)
          updateSeoH1()
        }
        window.addEventListener('popstate', updateSeoH1)
      })()
  </script>
